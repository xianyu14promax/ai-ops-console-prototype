.opb-tmh span{font-size:11px;opacity:.85}
.opb-tmb{display:flex;flex-direction:column;gap:3px;flex:1;margin-top:6px;min-height:0}
.opb-tms{background:rgba(255,255,255,.18);border-radius:3px;padding:4px 7px;font-size:11px;line-height:1.35;overflow:hidden;display:flex;min-height:0;word-break:break-all}
/* ② 传播主体（2026-10-19 业主标注稿）：3 留圆心，61 / 2,300 用引线标到环外右侧；
   右列只放「这层是谁」，整体右对齐 —— 环里不再压字，图例里也不再挤数字 */
.opb-con.opb-con-call{width:min(300px,44%);height:auto;flex:0 0 auto}
.opb-con-call .opb-call{fill:none;stroke:#aab7ca;stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}
.opb-con-call .opb-call-n{font-size:16px;font-weight:600;fill:var(--text);font-variant-numeric:tabular-nums}
.opb-con-call .opb-call-c{font-size:19px;font-weight:600;fill:#fff}
.opb-con-call .opb-call-l{font-size:9.5px;fill:#e3edff;letter-spacing:.04em}
.opb-split-v .opb-leg-2{width:auto;max-width:none;margin-left:6px;flex:1 1 auto}
.opb-leg-2{gap:20px}
.opb-leg-2 span{align-items:center;gap:6px}
.opb-leg-2 b{margin-left:0;flex:0 0 auto;text-align:left;min-width:0;font-size:12px;font-weight:500;color:var(--text);line-height:1.4}
.opb-leg-2 em{margin-left:auto;flex:0 1 auto;text-align:right;font-size:11.5px;color:var(--faint);line-height:1.5;text-wrap:pretty}
.opb-kv{color:var(--faint);font-size:11px}
.opb-kv em{font-style:normal;color:var(--sub);margin-right:3px}
.opb-strip{margin-top:9px;font-size:11.5px;color:var(--sub);background:var(--bg-subtle-1);border-radius:4px;padding:6px 9px;line-height:1.55}
.opb-strip b{color:var(--text);font-weight:600}
.opb-tm-p{font-size:12px;fill:#fff;font-weight:600}
.opb-tm-pv{font-size:10px;fill:#fff;fill-opacity:.72}
.opb-tm-c{font-size:10.5px;fill:#fff;fill-opacity:.92}
.opb-con{width:144px;height:144px;flex:0 0 auto}
.opb-con-v{font-size:16px;font-weight:600;fill:#fff}
.opb-con-s{font-size:9.5px;fill:#e3edff}
.opb-con-n{font-size:10px;font-weight:600;fill:#5b7396}
.opb-con-l{font-size:9px;font-weight:500;fill:#e6efff;letter-spacing:.06em}
.opb-mx{display:flex;flex-direction:column;gap:6px}
.opb-row{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:6px;align-items:center;font-size:12px;color:var(--sub)}
.opb-row b{text-align:center;font-weight:600;color:#1f2430;border-radius:4px;padding:6px 0;font-variant-numeric:tabular-nums}
.opb-row-h b{background:none;color:var(--faint);font-weight:400;font-size:11px;padding:0}
.opb-mxg{display:grid;grid-template-columns:30px 1fr;grid-template-rows:1fr auto;gap:6px}
.opb-mx-y{display:flex;flex-direction:column;justify-content:space-between;font-size:10px;color:var(--faint);text-align:center}
.opb-mx-body{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:4px;height:172px}
.opb-mc{border-radius:4px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2px 4px;font-size:10px;color:#4b5563;padding:2px;line-height:1.2}
.opb-dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:0 0 auto}
.opb-mx-x{grid-column:2;display:grid;grid-template-columns:repeat(4,1fr);font-size:10px;color:var(--faint);text-align:center;position:relative}
.opb-mx-x span{position:absolute;right:0;top:13px}
/* ⑥ 圈层态度：100% 堆叠条 —— 五格热力块颜色太淡，看不出「谁最对立」 */
.opb-srs{display:flex;flex-direction:column;gap:7px;margin-top:2px}
.opb-sr{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center}
.opb-sr>span{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opb-sr>b{display:flex;height:24px;border-radius:4px;overflow:hidden;background:var(--bg-subtle-1)}
.opb-sr>b>i{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;font-weight:600;color:#fff;min-width:0;overflow:hidden;font-variant-numeric:tabular-nums}
.opb-sr i.s{background:#3f9e63}
.opb-sr i.m{background:#b9c3d3;color:#39445a}
.opb-sr i.o{background:#d9534f}
.opb-sr-h>span{font-size:11px;color:var(--faint)}
.opb-sr b.h{height:auto;background:none;justify-content:flex-end;gap:16px}
.opb-sr b.h em{font-style:normal;font-size:11px;color:var(--faint);font-weight:400}
.opb-chips{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.opb-chips span{font-size:11px;color:var(--faint);border:1px dashed var(--line);border-radius:var(--dsw-radius-pill);padding:2px 9px}
.opb-chips span.on{color:var(--green);border-color:rgba(22,163,74,.35);border-style:solid;background:var(--green-bg)}
.opb-rep{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.opb-seg{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;flex:1;min-width:280px}
.opb-seg i{height:26px;border-radius:3px;background:var(--bg-subtle-3);font-style:normal;font-size:11px;color:var(--faint);display:flex;align-items:center;justify-content:center}
.opb-seg i.on{background:var(--blue-weak);color:var(--blue);box-shadow:inset 0 0 0 1px rgba(37,99,235,.18)}
.opb-ax{font-size:9.5px;fill:#9aa3b5}
.opb-mark{font-size:9.5px;fill:#8a93a6}
.opb-db-n{font-size:11.5px;fill:#4b5563}
.opb-db-v{font-size:11px;fill:#9aa3b5}
.opb-db-vb{font-size:11px;fill:#1f2430;font-weight:600}
/* 窄屏单列：必须点名 .w5/.w6/.w7 —— `.opb-card.w6`(0,2,0) 的特异度高于 `.opb-card`(0,1,0)，
   只写 .opb-card 的话媒体查询根本压不住，实测 1280 宽仍是两列 469px。 */
@media (max-width:1360px){.opb-card.w4,.opb-card.w5,.opb-card.w6,.opb-card.w7,.opb-card.w8,.opb-card.w12,.opb-col{grid-column:span 12}}
.opb-lgd{display:flex;gap:14px;align-items:center;font-size:11px;color:var(--faint);margin:2px 0 4px}
.opb-lgd span{display:flex;align-items:center;gap:5px}
.opb-lgd i{width:9px;height:9px;border-radius:50%;display:inline-block}
.opb-lgd i.hollow{background:#fff;border:2px solid #94a3b8}
.opb-lgd i.solid{background:#16a34a;border:2px solid #16a34a}
/* ⑧ 双序列图例：面积 vs 折线，形状要能区分，不能只换个颜色 */
.opb-lgd i.area{background:rgba(37,99,235,.16);border:1px solid #2563eb;border-radius:2px}
.opb-lgd i.line{background:#dc2626;border-radius:2px;height:3px}
.opb-lgd-n{margin-left:auto}
/* v37c 重构：结论头条 + 章节条 + 成本三数 */
.opb-hero{display:flex;align-items:center;gap:24px;background:linear-gradient(180deg,#f6f9ff,#fff);border:1px solid #e3ecff;border-radius:var(--dsw-radius-xs);padding:16px 18px;margin-bottom:14px;flex-wrap:wrap}
.hr-l{flex:1;min-width:300px}
.hr-k{font-size:11px;color:var(--blue);letter-spacing:.03em}
.hr-v{font-size:19px;font-weight:600;color:#1f2430;margin:6px 0 5px;line-height:1.35}
.hr-sub{font-size:12px;color:var(--sub);line-height:1.55}
.hr-kpis{display:flex;gap:26px;flex-wrap:wrap}
.hr-kpis>div{display:flex;flex-direction:column;gap:2px;min-width:62px}
.hr-kpis b{font-size:20px;font-weight:600;color:#1f2430;font-variant-numeric:tabular-nums;line-height:1.2}
.hr-kpis span{font-size:11px;color:var(--faint)}
.opb-ch{grid-column:1/-1;display:flex;align-items:baseline;gap:9px;margin:12px 0 -2px;padding-left:10px;border-left:3px solid var(--blue)}
.opb-ch i{font-style:normal;font-size:11px;color:var(--blue);font-weight:600}
.opb-ch h4{font-size:14px;font-weight:600;color:#1f2430}
.opb-ch span{font-size:11.5px;color:var(--faint)}
.opb-kpi3{display:flex;gap:7px;margin-top:9px}
.opb-kpi3>div{flex:1;background:var(--bg-subtle-1);border-radius:4px;padding:6px 4px;text-align:center;min-width:0}
.opb-kpi3 b{font-size:15px;font-weight:600;color:#1f2430;display:block;font-variant-numeric:tabular-nums}
.opb-kpi3 b span{font-size:10px;color:var(--faint);margin-left:1px;font-weight:400}
.opb-kpi3 i{font-style:normal;font-size:10px;color:var(--faint);display:block;margin-top:1px}
.opb-lad-hot{font-size:9px;fill:#2563eb}
/* v37b 双视角判断卡（只在案例模式出）：雷达 / 影响三档 / 成本条 / 人群优先级 / 定义权阶梯 / 外溢四格 */
.opb-radar{width:236px;height:216px;flex:0 0 auto}
.opb-rd{font-size:10px;fill:#5b6478}
.opb-rdv{font-size:9px;fill:#9aa3b5}
.opb-biz{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;justify-content:center}
.opb-imp{display:flex;flex-direction:column;gap:7px}
.opb-imp-r{display:grid;grid-template-columns:32px 1fr;gap:2px 8px;align-items:center}
.opb-imp-r>span{font-size:11.5px;color:var(--sub);grid-row:span 2}
.opb-imp-r>b{display:block;height:8px;background:var(--bg-subtle-3);border-radius:4px;overflow:hidden}
.opb-imp-r>b>i{display:block;height:100%;border-radius:4px}
.opb-imp-r>em{font-style:normal;font-size:10.5px;color:var(--faint)}
.opb-cost .bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--bg-subtle-3)}
.opb-cost .bar i{display:block;height:100%}
.opb-cost .cap{margin-top:6px;font-size:11px;color:var(--sub);line-height:1.5}
.opb-cost .cap b{color:var(--text);font-weight:600}
.opb-prio{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.opb-prio span{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--faint);border:1px solid var(--line-soft);border-radius:var(--dsw-radius-pill);padding:3px 9px;background:var(--bg-subtle-1)}
.opb-prio span.p1{color:var(--blue);background:var(--blue-weak);border-color:rgba(37,99,235,.18);font-weight:500}
.opb-prio i{font-style:normal;font-size:9.5px;width:14px;height:14px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;border:1px solid currentColor}
.opb-lad{font-size:11px;fill:#2563eb}
.opb-lad2{font-size:9.5px;fill:#7f93b8}
.opb-lad-on{font-size:11px;fill:#fff;font-weight:600}
.opb-lad-on2{font-size:9.5px;fill:#dbeafe}
.opb-quad{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.opb-quad>div{border-left:3px solid var(--line);background:var(--bg-subtle-1);border-radius:0 4px 4px 0;padding:7px 9px}
.opb-quad b{display:block;font-size:11.5px;color:var(--text);font-weight:600}
.opb-quad span{display:block;font-size:10.5px;color:var(--faint);line-height:1.45;margin-top:2px}
.opb-merge{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opb-merge>div{font-size:12px;color:var(--sub);line-height:1.65;background:var(--bg-subtle-1);border-radius:4px;padding:10px 12px}
.opb-merge>div>i{font-style:normal;display:inline-block;font-size:10.5px;color:var(--blue);background:var(--blue-weak);border-radius:3px;padding:1px 6px;margin-right:6px}
.opb-merge .core{grid-column:1/-1;background:#f7faff;border:1px solid #e3ecff;color:var(--text)}
/* 实验模式的收口：左边一句「能不能投」，右边是还差哪几步 */
.opb-end{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
.opb-end .v{flex:0 0 auto;min-width:190px}
.opb-end .v>b{display:block;font-size:20px;font-weight:600;color:#1f2430;line-height:1.3}
.opb-end .v>span{display:block;font-size:12px;color:var(--sub);line-height:1.6;margin-top:5px;max-width:280px}
.opb-end ol{flex:1;min-width:280px;margin:2px 0 0;padding-left:18px;font-size:12.5px;color:var(--sub);line-height:1.95}
.opb-end li>b{color:var(--text);font-weight:600}
.opb-merge .core b{color:var(--blue);font-weight:600}
.opb-foot{margin-top:12px;font-size:11.5px;color:var(--faint);line-height:1.6}
.opb-foot b{color:var(--sub);font-weight:600}

/* SECTION: v41-journey（2026-10-21）── Agent 详情第五页「编排」
   一套前缀 jr-，只服务 assets/v41-agent-journey.js。
   三栏：左节点工具箱 214 / 中画布自适应 / 右旅程概览 296。
   颜色全部走 dsh-tokens 的语义令牌；只有连线与网格这两处需要中间灰（令牌里没有，
   且必须比 --line 深、比 --decor 浅），另立两个局部变量，改色只改这里。 */
/* 整页铺满（2026-10-22 业主「下面还有空」）：
   原来 panel 写死 498px，视口一高（1200/1440）页面底下就空出一条。
   试过 height:100% 往下传，但 .content 的 clientHeight 比可视高度大（830 vs 712），
   传下去反而把面板顶出视口 34px、整页要滚一下才看得全。
   量产过三档视口：页头到面板顶恒为 272px、面板以下固定占 76px（页尾+留白），
   所以直接 calc(100vh - 336px) —— 900 / 1200 / 800 三档都正好贴到距底 24px。 */
.jr-wrap{--jr-wire:#c3cedd;--jr-grid:#dfe6ef;
  display:flex;flex-direction:column}
.jr-wrap>.jr-bar{flex:0 0 auto}
.jr-wrap>.jr-main{flex:0 0 auto}
.jr-wrap>.jr-foot{flex:0 0 auto;margin-top:10px}
.jr-bar{display:flex;align-items:center;gap:12px;flex-wrap:nowrap;background:var(--card);
  border:1px solid var(--line);border-radius:var(--dsw-radius-md);padding:9px 12px;margin-bottom:8px}
/* 工具条不许换行（2026-10-22）：原来 flex-wrap:wrap，"未保存"胶囊一出现就挤到第二行，
   整页内容下移 39px，画布跟着跳一下。现在恒定一行，宽度不够时由名称框自己收窄。 */
.jr-bar-l{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.jr-bar-m{flex:1 1 120px;min-width:70px;display:flex;align-items:center;gap:9px;padding-left:2px}
/* 有未保存改动：7px 圆点，不占宽度也不推挤工具条 */
.jr-dirty-dot{width:7px;height:7px;border-radius:50%;background:var(--amber);flex:0 0 auto;margin-left:-4px}
.jr-name{font-size:15px;font-weight:600;color:var(--text);background:transparent;border:0;
  border-bottom:1px solid transparent;padding:1px 0;min-width:120px;max-width:260px;width:100%;outline:none}
.jr-name:hover{border-bottom-color:var(--line)}
.jr-name:focus{border-bottom-color:var(--blue)}
.jr-btn{display:inline-flex;align-items:center;gap:5px}
.jr-btn .jr-ico{width:13px;height:13px;stroke-width:1.9}
.jr-dirty{font-size:11px;color:var(--amber);background:var(--amber-bg);border-radius:var(--dsw-radius-pill);padding:2px 8px}
.jr-bar-r{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.jr-input{font:inherit;font-size:12.5px;color:var(--text);background:var(--card);
  border:1px solid var(--line);border-radius:var(--dsw-radius-sm);padding:6px 9px;outline:none}
.jr-input:focus{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-weak)}
.jr-select{min-width:172px;cursor:pointer}
.jr-note{font-size:11.5px;color:var(--faint);line-height:1.6;margin:0 0 10px 2px}
.jr-foot{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;padding:6px 12px;background:var(--bg-subtle-1);
  border:1px solid var(--line-soft);border-radius:var(--dsw-radius-sm);font-size:11px;color:var(--faint);line-height:1.5}
.jr-foot>span{flex:1;min-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jr-foot b{color:var(--sub);font-weight:600;margin-right:5px}

.jr-main{display:grid;grid-template-columns:224px minmax(0,1fr) 288px;gap:10px;align-items:stretch}
/* 专注模式：左右两栏收起，画布吃满宽度。
   三栏时中栏 610px，六列流程只能缩到 0.72 再看一半；专注后 1190px，
   同一张图 0.96 就全见、字号 12px。左工具箱变成浮层（左上「工具箱」按钮或点一下就出）。 */
.jr-main.focus{grid-template-columns:minmax(0,1fr);position:relative}
.jr-main.focus>.jr-side{display:none}
.jr-main.focus>.jr-rail{display:none}
.jr-main.focus>.jr-rail.show{display:flex;position:absolute;left:0;top:0;bottom:0;width:224px;
  z-index:12;box-shadow:0 12px 36px #00000030}
.jr-tools-btn{position:absolute;left:12px;top:44px;z-index:6;display:inline-flex;align-items:center;gap:4px;
  font-size:11.5px;color:var(--sub);background:var(--card);border:1px solid var(--line);
  border-radius:var(--dsw-radius-pill);padding:4px 10px;box-shadow:var(--dsw-elevation-pop)}
.jr-tools-btn:hover{color:var(--blue);border-color:var(--blue-line)}
.jr-tools-btn .jr-ico{width:12px;height:12px}
.jr-panel{background:var(--card);border:1px solid var(--line);border-radius:var(--dsw-radius-md);
  display:flex;flex-direction:column;min-width:0;overflow:hidden;
  /* 高度跟着视口走，让三栏一直铺到页面底部（见 .jr-wrap 上方的标定说明） */
  height:calc(100vh - 336px);min-height:420px}
.jr-panel-h{display:flex;align-items:center;gap:8px;justify-content:space-between;
  padding:9px 12px;border-bottom:1px solid var(--line-soft);font-size:12.5px;font-weight:600;flex:0 0 auto}
/* 画布头右侧的两个小工具（整理 / 专注）：放这里是它们该在的地方 —— 属于画布，不属于旅程工具条 */
.jr-hd{display:flex;align-items:center;gap:6px;font-weight:400}
.jr-hd-btn{width:24px;height:22px;border-radius:6px;border:1px solid transparent;color:var(--faint);
  display:inline-flex;align-items:center;justify-content:center}
.jr-hd-btn:hover{background:var(--bg-subtle-2);color:var(--blue);border-color:var(--line-soft)}
.jr-hd-btn.on{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-line)}
/* 试运行状态：照扣子的做法 —— 跑过一遍的节点加绿框，右上角一个小徽标，
   当前正在跑的那一步是实心绿环。未参与主路径（兜底）的节点标灰，不假装跑过。
   ⚠ 用 box-shadow 画绿框，不要改 border-color：节点左边那条 3px 分类色条就是 border-left，
   用 border-color 会把四边一起刷绿，分类色直接没了（上一版踩过）。 */
.jr-node.run-active{box-shadow:0 0 0 2px rgba(16,185,129,.55),0 6px 18px #00000018;z-index:6}
.jr-node.run-ok{box-shadow:0 0 0 1.5px rgba(16,185,129,.42),0 1px 2px #0000000a}
.jr-node.run-skip{opacity:.62}
.jr-run-badge{position:absolute;right:-7px;top:-7px;width:16px;height:16px;border-radius:50%;z-index:7;
  display:flex;align-items:center;justify-content:center;font-size:10px;line-height:1;color:#fff;
  box-shadow:0 1px 3px #00000026}
.jr-run-badge.ok{background:#10b981}
.jr-run-badge.skip{background:var(--decor);font-size:9px}
.jr-runbar{position:absolute;left:50%;top:46px;transform:translateX(-50%);z-index:9;
  display:flex;align-items:center;gap:8px;pointer-events:none;
  background:var(--card);border:1px solid var(--line);border-radius:var(--dsw-radius-pill);
  padding:5px 12px;font-size:11.5px;color:var(--sub);box-shadow:var(--dsw-elevation-pop);white-space:nowrap}
.jr-runbar b{color:var(--green);font-variant-numeric:tabular-nums}
/* 画布头的试运行主按钮：扣子把「试运行」放在最显眼的位置（绿色实心），这里跟着它 */
.jr-hd-run{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 10px;border-radius:6px;
  background:#10b981;color:#fff;font-size:11.5px;font-weight:600;border:1px solid #0ea371}
.jr-hd-run:hover{background:#0ea371}
.jr-hd-run .jr-ico{width:12px;height:12px;stroke-width:2.2}
.jr-count{font-weight:400;color:var(--faint);font-size:11px}
.jr-hint{font-weight:400;color:var(--faint);font-size:11px;text-align:right}

/* ── 左：节点工具箱 ───────────────────────────────── */
.jr-rail-q{padding:8px 10px 4px;flex:0 0 auto}
.jr-rail-q .jr-input{width:100%}
.jr-tools{padding:4px 8px 10px;overflow:auto;flex:1 1 auto;min-height:0}
.jr-tool-g{padding:8px 6px 6px}
.jr-tool-g{display:flex;align-items:center;justify-content:flex-start;gap:5px}
.jr-tool-g>b{font-size:11px;font-weight:600;color:var(--faint);letter-spacing:.02em}
.jr-tool-g>i{font-style:normal;font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums}
.jr-rail-hint{font-size:10.5px;color:var(--faint);line-height:1.5;padding:2px 12px 6px}
.jr-tool{display:flex;align-items:flex-start;gap:8px;width:100%;text-align:left;
  padding:6px 8px;border-radius:8px;border:1px solid var(--line-soft);background:var(--card);
  font-size:12.5px;color:var(--text);margin-bottom:6px}
.jr-tool:hover{background:var(--bg-subtle-1);border-color:var(--blue-line);box-shadow:0 1px 3px #0000000a}
.jr-tool:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.jr-tool-i{width:26px;height:26px;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
  border-radius:7px;border:1px solid transparent}
.jr-ico{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;display:block}
.jr-tool-i.k-trigger{color:var(--green);background:var(--green-bg);border-color:#c8ecd6}
.jr-tool-i.k-wait{color:var(--amber);background:var(--amber-bg);border-color:#f3ddb4}
.jr-tool-i.k-action{color:var(--blue);background:var(--blue-bg);border-color:var(--blue-line)}
.jr-tool-i.k-branch{color:var(--purple);background:#f5f0ff;border-color:#e4d5ff}
.jr-tool-i.k-agent{color:var(--blue-deep);background:var(--blue-bg);border-color:var(--blue-line)}
.jr-tool-i.k-end{color:var(--sub);background:var(--bg-subtle-3);border-color:var(--line)}
.jr-tool-t{flex:1;min-width:0;display:flex;flex-direction:column}
.jr-tool-t b{font-size:12px;font-weight:500;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jr-tool-t i{font-style:normal;font-size:10px;color:var(--faint);line-height:1.35;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jr-tool-plus{color:var(--faint);font-size:12px;opacity:0}
.jr-tool:hover .jr-tool-plus{opacity:1}
.jr-tip{font-size:11px;color:var(--faint);line-height:1.6;padding:8px 8px 2px}

/* ── 中：画布 ─────────────────────────────────────── */
.jr-stage-wrap{position:relative}
/* 画布锚在左上（2026-10-22 改，原来是 flex + align-items:center + margin:auto 居中）。
   居中会让"画布尺寸一变，整张图就整体位移"：实测从工具箱拖一个节点进来，画布变高 40px，
   垂直居中点跟着上移，刚落位的节点就和鼠标错开 39px；加/删节点时整张图也会跳一下。
   React Flow 的 viewport 本来就是左上锚定，内容变多只往右下长，已有节点一动不动。 */
.jr-stage{position:relative;flex:1 1 auto;min-height:0;overflow:auto;display:block;
  background-color:var(--bg-subtle-1);
  background-image:radial-gradient(var(--jr-grid) 1px,transparent 1px);
  background-size:16px 16px}
.jr-canvas{position:relative;transform-origin:0 0;margin:0;animation:jrCanvasIn .15s ease-out}
/* 画布整块重建时给一个极短的淡入（2026-10-22）。切旅程 / 新建 / 加删节点都是整块替换 DOM，
   硬切在视觉上就是"闪一下"；0.15s 的淡入把硬切变成过渡，不改变任何布局与坐标。
   拖动、选中不重渲染，所以不会触发它。 */
@keyframes jrCanvasIn{from{opacity:.55}to{opacity:1}}
/* 空白处可抓：光标提示"这里能拖动整张图"（React Flow 同款） */
.jr-stage{cursor:grab}
.jr-stage.panning{cursor:grabbing;user-select:none}
.jr-stage.drop-on{background-color:var(--blue-bg);box-shadow:inset 0 0 0 2px var(--blue-line)}
.jr-tool.dragging{opacity:.45;cursor:grabbing}
.jr-svg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.jr-e{fill:none;stroke:var(--jr-wire);stroke-width:1.5;stroke-linecap:round;
  pointer-events:stroke;cursor:pointer}
.jr-e:hover{stroke:var(--blue)}
.jr-e.sel{stroke:var(--red);stroke-width:2.4}
.jr-e.linking{stroke:var(--blue);stroke-width:1.8;stroke-dasharray:5 4;pointer-events:none}
.jr-ah-p{fill:var(--jr-wire)}
.jr-ah-p.fb{fill:var(--amber)}
.jr-e.fb{stroke:var(--amber);stroke-dasharray:4 3}
.jr-e.on{stroke:var(--blue);stroke-width:2.2}
/* 连线上的 hover 删除点：默认不接收指针（否则会挡住边的点选），悬停那条边才亮出来 */
.jr-eg .jr-e-del{fill:var(--card);stroke:var(--jr-wire);stroke-width:1;opacity:0;pointer-events:none;
  cursor:pointer;transition:opacity .12s}
.jr-eg .jr-e-x{stroke:var(--faint);stroke-width:1.5;fill:none;opacity:0;pointer-events:none;transition:opacity .12s}
.jr-eg:hover .jr-e-del,.jr-eg.sel .jr-e-del{opacity:1;pointer-events:all}
.jr-eg:hover .jr-e-x,.jr-eg.sel .jr-e-x{opacity:1}
.jr-e-del:hover{stroke:var(--red);fill:var(--red-bg)}
.jr-e-del:hover+.jr-e-x{stroke:var(--red)}
/* 节点卡：照 nexus-frontend 的 JourneyNodeCard 结构 ——
   圆角 12、左侧 3px 分类色条、图标方形、名称 + 「分类 · 类型」、摘要行。
   v41b（2026-10-22）：宽度 208 → 168、内距 12 → 10 一档，让 6 列在 610px 中栏里
   缩到 0.72 还有 9.4px 字；尺寸常量在 v41-agent-journey.js 的 NW/H，两边必须同步改。 */
.jr-node{position:absolute;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--line);
  border-radius:12px;padding:9px 10px;cursor:grab;box-shadow:0 1px 2px #0000000a;
  display:flex;flex-direction:column;gap:6px;overflow:visible;
  transition:box-shadow .15s,border-color .15s}
.jr-node:hover{box-shadow:0 4px 14px #00000014}
.jr-node.dragging{cursor:grabbing;box-shadow:0 12px 28px #00000020;z-index:6}
.jr-node:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.jr-node.is-self{background:var(--blue-weak);border-color:var(--blue-line);border-left-color:var(--blue)}
.jr-n-row{display:flex;align-items:center;gap:7px;min-width:0}
.jr-n-ico{width:26px;height:26px;border-radius:7px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center}
.jr-n-ico .jr-ico{width:14px;height:14px}
.jr-n-body{min-width:0;flex:1}
.jr-n-name{display:block;font-size:13px;font-weight:500;line-height:1.25;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jr-n-sub{display:block;font-style:normal;font-size:11.5px;line-height:1.3;color:var(--faint);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.jr-n-sum{display:block;font-size:11.5px;line-height:1.4;color:var(--sub);
  border-top:1px solid var(--line-soft);padding-top:6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 选中态（2026-10-22 补）：原来选中只在右上角冒一个删除按钮，卡片本身一点变化都没有，
   看着像"点了没反应"。原版选中是明确的蓝环 + 轻微抬起。 */
.jr-node.on{border-color:var(--blue);border-left-color:var(--blue);
  box-shadow:0 0 0 2px var(--blue-line),0 6px 18px #00000018;z-index:5}
/* 拉线时鼠标悬停/靠近的节点：给一块淡蓝底，告诉用户"松手就连到这里" */
.jr-node.link-hot{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-weak),0 6px 18px #00000018;z-index:7}
/* 拖动时的对齐辅助线（原版 FlowCanvas 的 helper lines） */
.jr-guide{position:absolute;background:var(--blue);opacity:.5;pointer-events:none;z-index:8}
.jr-guide.v{width:1px}
.jr-guide.h{height:1px}
.jr-guide.dot{width:5px;height:5px;border-radius:50%;opacity:.9;transform:translate(-2px,-2px)}
/* 选中才出现的删除按钮（右上角 -8px，和源码一致） */
.jr-n-del{position:absolute;right:-8px;top:-8px;width:20px;height:20px;border-radius:50%;
  border:1px solid var(--line);background:var(--card);color:var(--faint);font-size:14px;line-height:1;
  display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px #00000014;z-index:7}
.jr-n-del:hover{border-color:#f0b4b4;background:var(--red-bg);color:var(--red)}
/* 连接点：贴在卡片右缘（-6px），默认透明但可点，hover 卡片或它自身才显形。
   不能设 pointer-events:none —— 它伸出卡片，鼠标一移过去 hover 就断，永远点不到。 */
.jr-port{position:absolute;right:-6px;top:50%;width:11px;height:11px;margin-top:-5.5px;
  border-radius:50%;background:var(--card);border:2px solid var(--blue);
  opacity:0;pointer-events:all;transition:opacity .12s,transform .12s;cursor:crosshair;z-index:6}
.jr-node:hover .jr-port,.jr-port:hover{opacity:1}
.jr-port:hover{transform:scale(1.25)}
.jr-el{position:absolute;transform:translate(-50%,-50%);font-size:10px;line-height:1;
  padding:3px 6px;border-radius:var(--dsw-radius-pill);background:var(--card);
  border:1px solid var(--jr-wire);color:var(--sub);white-space:nowrap;pointer-events:none;z-index:2}
.jr-el.ok{border-color:#bfe8cd;color:var(--green);background:var(--green-bg)}
.jr-el.no{border-color:#e4d5ff;color:var(--purple);background:#f8f4ff}
.jr-el.fb{border-color:#f3ddb4;color:var(--amber);background:var(--amber-bg)}
.jr-empty{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:4;
  background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 14px;
  font-size:12px;color:var(--sub);box-shadow:var(--dsw-elevation-pop);pointer-events:none}
.jr-mini{position:absolute;right:12px;bottom:12px;background:var(--card);border:1px solid var(--line);
  border-radius:6px;padding:2px;box-shadow:var(--dsw-elevation-pop);z-index:3;line-height:0;opacity:.92;cursor:pointer}
/* 小地图上的当前视口框：没有它，小地图只是装饰 */
.jr-mini-vp{fill:var(--blue);fill-opacity:.10;stroke:var(--blue);stroke-opacity:.6;stroke-width:1}
.jr-mini svg{display:block}
.jr-mini-b{fill:var(--line)}
.jr-mini-b.k-trigger{fill:var(--green)}
.jr-mini-b.k-wait{fill:var(--amber)}
.jr-mini-b.k-action{fill:var(--blue)}
.jr-mini-b.k-branch{fill:var(--purple)}
.jr-mini-b.k-agent{fill:var(--blue-deep)}
.jr-mini-b.k-end{fill:var(--decor)}
.jr-tail{position:absolute;right:12px;bottom:84px;font-size:11px;color:var(--amber);
  background:var(--amber-bg);border:1px dashed #f3ddb4;border-radius:var(--dsw-radius-pill);padding:4px 10px;z-index:3}
.jr-tail:hover{border-color:var(--amber)}
.jr-zoom{position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;gap:1px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--dsw-radius-sm);
  box-shadow:var(--dsw-elevation-pop);overflow:hidden;z-index:3}
/* 当前缩放百分比（原版 Controls 里那一行）：没有它，用户不知道自己在 72% 还是 100% */
.jr-pct{font-size:10px;color:var(--faint);text-align:center;padding:3px 0 4px;
  border-bottom:1px solid var(--line-soft);font-variant-numeric:tabular-nums;user-select:none}
.jr-zoom button{width:28px;height:26px;font-size:13px;color:var(--sub);display:flex;align-items:center;justify-content:center}
.jr-zoom button+button{border-top:1px solid var(--line-soft)}
.jr-zoom button:hover{background:var(--bg-subtle-2);color:var(--blue)}

/* ── 右：旅程概览 / 节点详情 ─────────────────────── */
.jr-side-b{padding:10px 12px 14px;overflow:auto;flex:1 1 auto;min-height:0}
.jr-side-t{font-size:10.5px;font-weight:600;color:var(--faint);margin:12px 0 5px;letter-spacing:.02em}
.jr-side-t:first-child{margin-top:0}
.jr-desc{margin:0;font-size:12.5px;line-height:1.62;color:var(--text);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.jr-saved2{margin-top:8px;color:var(--faint);font-size:11px}
.jr-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.jr-tags span{font-size:10.5px;color:var(--sub);background:var(--bg-subtle-3);border-radius:var(--dsw-radius-pill);padding:2px 8px}
.jr-saved{margin:0;font-size:11.5px;color:var(--sub);line-height:1.6}
.jr-st{font-size:11px;font-weight:500;color:var(--faint)}
.jr-st.ok{color:var(--green)}.jr-st.warn{color:var(--amber)}
.jr-comp{display:flex;flex-direction:column;gap:4px}
.jr-comp.two{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
.jr-comp-r{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--sub)}
.jr-comp-l{flex:1;min-width:0}
.jr-comp-r b{font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
.jr-dot{width:6px;height:6px;border-radius:50%;flex:0 0 auto}
.jr-dot.green{background:var(--green)}.jr-dot.blue{background:var(--blue)}
.jr-dot.amber{background:var(--amber)}.jr-dot.purple{background:var(--purple)}
.jr-dot.grey{background:var(--decor)}
.jr-grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.jr-grid2>div{background:var(--bg-subtle-2);border-radius:var(--dsw-radius-sm);padding:6px 9px}
.jr-grid2 b{display:block;font-size:15.5px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.jr-grid2 span{display:block;font-size:10.5px;color:var(--faint);margin-top:2px}

/* 节点详情：四问（谁做 / 收什么 / 交什么 / 卡了怎么办）是这一屏的正文 */
.jr-back{font-size:11px;color:var(--blue);font-weight:400}
.jr-ns-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.jr-field{display:block;margin-bottom:9px}
.jr-field>span{display:block;font-size:11px;color:var(--faint);margin-bottom:4px}
.jr-field .jr-input{width:100%}
.jr-cfg-form{margin-bottom:4px}
.jr-ns-h b{display:block;font-size:13.5px;font-weight:600;line-height:1.35}
.jr-ns-h i{display:block;font-style:normal;font-size:10.5px;color:var(--faint);margin-top:1px}
.jr-flow4{margin-top:10px;display:flex;flex-direction:column;gap:1px;
  border:1px solid var(--line);border-radius:var(--dsw-radius-sm);overflow:hidden}
.jr-flow4-r{display:flex;gap:8px;padding:7px 9px;background:var(--card);align-items:flex-start}
.jr-flow4-r+.jr-flow4-r{border-top:1px solid var(--line-soft)}
.jr-flow4-r>span{flex:0 0 62px;font-size:10.5px;color:var(--faint);line-height:1.6}
.jr-flow4-r>b{flex:1;min-width:0;font-size:11.5px;font-weight:500;line-height:1.6;color:var(--text)}
.jr-flow4-r.fail{background:var(--amber-bg)}
.jr-flow4-r.fail>span{color:var(--amber)}
.jr-cfg{display:flex;flex-direction:column;gap:1px;border:1px solid var(--line);border-radius:var(--dsw-radius-sm);overflow:hidden}
.jr-cfg-r{display:flex;gap:8px;padding:6px 9px;font-size:11.5px;background:var(--card)}
.jr-cfg-r+.jr-cfg-r{border-top:1px solid var(--line-soft)}
.jr-cfg-r span{flex:0 0 62px;color:var(--faint);font-size:10.5px;line-height:1.6}
.jr-cfg-r b{flex:1;min-width:0;font-weight:500;line-height:1.6}
.jr-del{margin-top:12px;width:100%;justify-content:center}

/* 状态分段（草稿 / 运行中 / 已暂停） */
.jr-seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--dsw-radius-sm);overflow:hidden;background:var(--card)}
.jr-seg-b{font-size:11.5px;color:var(--sub);padding:5px 9px;border-right:1px solid var(--line)}
.jr-seg-b:last-child{border-right:0}
.jr-seg-b:hover{background:var(--bg-subtle-2)}
.jr-seg-b.on{font-weight:600}
.jr-seg-b.on.draft{background:var(--bg-subtle-3);color:var(--text)}
.jr-seg-b.on.running{background:var(--green-bg);color:var(--green)}
.jr-seg-b.on.paused{background:var(--amber-bg);color:var(--amber)}

/* 预览弹层里的执行序列表 */
.jr-pv-h{font-size:12.5px;color:var(--sub);line-height:1.7;margin-bottom:10px}
.jr-pv{width:100%;border-collapse:collapse;font-size:12px}
.jr-pv th{text-align:left;font-weight:600;color:var(--faint);font-size:11px;padding:6px 8px;
  border-bottom:1px solid var(--line);background:var(--bg-subtle-1);white-space:nowrap}
.jr-pv td{padding:7px 8px;border-bottom:1px solid var(--line-soft);vertical-align:top;line-height:1.55}
.jr-pv b{font-weight:600}
.jr-pv-s{font-size:11px;color:var(--faint);margin-top:1px}
.jr-pv-i{color:var(--faint);font-variant-numeric:tabular-nums;width:28px}
.jr-pv-io{color:var(--sub);max-width:280px}

/* 三栏**在任何宽度都保留** —— 左工具箱 / 中画布 / 右概览就是这张图的样子，
   窄屏把左右两栏收窄，画布自己缩放；不改成上下堆叠（那样形态就没了）。 */
@media (max-width:1600px){
  .jr-main{grid-template-columns:210px minmax(0,1fr) 270px}
  .jr-hint{display:none}
}
@media (max-width:1320px){
  .jr-main{grid-template-columns:200px minmax(0,1fr) 246px}
  .jr-bar{gap:8px}
  .jr-bar-r{gap:6px}
  .jr-tool-t i{display:none}
}
