@media (max-width:1280px){ .as-body{grid-template-columns:minmax(0,1fr) !important} .as-grip{display:none} .as-side{position:static} .as-traj-body{grid-template-columns:minmax(0,1fr)} }
/* v37：窄屏右栏改成**覆盖层**（用户主动打开的临时态），不再和正文抢同一条竖轴。
   病因（1280×800 实测）：这一档 .as-body 是单列，正文列与右栏各占一行 ——
   grid-auto-rows:minmax(0,100%) 让两行都想拿满高，结果各被压到 **75px**，正文只剩 5 行。
   现在：默认不渲染右栏（sessUI 的 sideOpen 初值按视口给 false），需要时打开 → 浮在正文之上，
   正文列始终独占整条高度（169px，仍不宽裕，但不再是 75）。
   绝对定位的 grid 子项不占轨道，所以 .as-body 只剩一行，grid-auto-rows 也就不再分赃。 */
@media (max-width:1280px){
  .content--as .as-body{position:relative}
  .content--as .as-body>.as-side{position:absolute;right:0;top:0;bottom:0;width:min(340px,88%);z-index:3;
    background:var(--d-surface);border-left:.5px solid var(--d-border1);
    box-shadow:var(--dsw-elevation-panel);border-radius:0}
}
/* 会话区 = 受视口限制的独立滚动口（输入条遮挡正文的**根因修法**）
   ─────────────────────────────────────────────────────────────────────────────
   问题（两次实测）：原布局是"整页 #content 滚动 + .as-composer position:sticky 叠在内容上"。
   第一次修法（给正文列预留输入条高度）只在贴底那一格成立；滚到中间位置时 sticky 仍会
   浮在正文上（1280 档实测重叠 ≤39px）。原因不在预留量，而在**滚动口选错了**：
   sticky 的停止线是滚动容器的内容底，只要滚动容器不是会话区，"浮起并覆盖"就不可避免。

   源码 ConversationRoot 的解法（ConversationRoot.module.css:401-434）：
     .body        —— 受视口限制的高度（不随内容长高）
       .scrollBody —— 正文列自己滚
       .composerSeat —— 输入条座位，.body 的**兄弟之外**的一层（不覆盖内容）

   这里照它做，但**只作用域在 Agent 详情页**（下面每条选择器都挂 .content--as 前缀，
   该类由 app.js 只在 state.cap==='agent-wb' && state.agentId 时写到 #content 上）：
   · #content 不再整页滚动，而是把确定高度传给会话区；
   · .as-view 变成纵向 flex + 受视口限制，**自己滚**，于是 .as-body（正文+右栏的 grid）
     拿到确定高度：右栏的 sticky、正文列的 100%、轨道带的 100dvh 都照旧生效；
   · 输入条 / 「回到底部」/ 任务条 / 状态条 / 口径条移到 .as-body **之外**（v27 渲染层改的），
     成为滚动口的兄弟 —— 不滚动、不覆盖、恒在视口底部。
   其它能力页（含 Agent 详情的其它页签）不含 .as-view，不受影响；
   轨迹屏同样套用（两屏共用 .as-view）。 */
/* v32 修正（2026-10-15）：这条链的**前提**以前写错了 —— .content 其实不是 flex 列，
   （只给高度会与 Agent 详情页页头/版本条/页签行/页脚口径条争空间 —— 实测它们会先分走
   698px 里的一大半，会话区只剩 264px，输入条虽然可见但正文没什么可看的）。
   会话区内的分配照样是 `flex:1 1 0` + `height:0`：输入条/状态条这些固定件先拿内容高，
   剩下的全给正文列。 */
/* v50 修：页头族四件（返回行 / 页头 / 版本条 / 第一排页签）必须 `flex-shrink:0`。
   v49 把 .as-view 改成 min-height 一整屏后，.content--as 里「页头族 205 + as-view 930」
   超过容器 930，flex 收缩开始压榨没有 flex-shrink:0 的兄弟 —— 实测第一排页签被压到
   **1px 高**（getBoundingClientRect [310,311]），「监控 / 管理 / 日志」整个消失，
   elementFromPoint 在页签位置命中的是第二排的 .as-tab。加了这行，四件保持原高，
   多出的 251px 由 .content--as 的 overflow-y:auto 承担（往下滚页头滚走）。 */
.content--as>.ph-backrow,.content--as>.page-head,.content--as>.verbar,.content--as>.tabs{flex-shrink:0}
/* v49：**让 .as-view 占满一整屏**（业主：class="as-view" 就这容器高度要一整个屏）。
   改前：.content--as 是 overflow:hidden 的 flex 列，.as-view 只能拿到「视口 − 顶栏 − 页头族」的
   残余高度 —— 1600×1000 实测只剩 649（页头族吃掉 236），.as-body 再减页签 31 + 输入条 186，
   右栏可视只有 432，而右栏内容要 635 → 底部 200 多被截掉，必须滚才能看。
   改后：内容区允许滚动，.as-view 的 min-height = 视口 − 顶栏（= 一整屏）。
   往下滚时页头族随页面滚走，.as-view 正好铺满整屏，右栏拿到 713（635 全部显示）。
   输入条 position:sticky bottom:0 挂在 #content 这个滚动容器上，滚到哪都贴底，
   所以「页头滚走」不会把输入框带走。 */
.content--as{display:flex;flex-direction:column;padding:24px 24px 0;overflow-y:auto;min-height:0}
/* v37：padding 从 0 改为 24px 24px 0 —— 原写法为了让会话区满幅，把 #content 的内边距整个清零，
   代价是**页头族比其它三个页签整体错位**（实测文本级坐标，1600×1000）：
     左侧（返回行 / 「客服助手 Agent」/ 版本条 / 外层页签）x −24、y −24；
     右侧（「近 24 小时」/「提交发布」）x +24、y −24。
   于是「会话 ⇄ 监控」一点，整行左半往外蹦、右半往里收，各跳 24px —— 切页签的"拉扯感"。
   现在把这份内边距还给 #content（页头族天然对齐其它页签），会话区用负 margin 反向拉回满幅。
   注意 padding-bottom 仍是 0：输入条要贴视口底，44px 的页脚位只属于整页滚动的页签。 */
.content--as>.as-view{flex:0 0 auto;min-height:calc(100vh - 70px);display:flex;flex-direction:column;margin:0 -24px}
/* ── 往下传高度：.as-body 是"正文列 + 右栏"的 grid，必须拿到**确定高度**，
      否则正文列不会自己滚（flex/grid 子项的自动最小尺寸会把父级顶高）。
   ① .as-view 的 flex 行 = .as-body 满、其余（输入条/回底/任务条/状态条/口径条）按内容；
   ② .as-body 的高度用 height:0 + flex:1 1 auto 求出来（height:0 是给 flex 基准，
      实际高度由 flex-grow 决定 = 剩余空间，不依赖 height:100% 的相对解析）；
   ③ 高度没有走 height:100% 的相对解析，而是 height:0 + flex:1 直接算出来，
      再用 grid-auto-rows:100% 把这一行的行高**钉在容器高**上；正文列自己 height:100%
      拿到这个确定高度后才能作为滚动口（否则它的自动高度会等于内容高，"滚动"变成"撑高"）。 */
.content--as .as-view>.as-body{flex:1 1 0;height:0;min-height:0;overflow:hidden;grid-auto-rows:minmax(0,100%);align-content:start}
/* v37 根因修正：正文列拿到确定高度 = **必须 align-self:stretch**。
   .as-body 的基座是 `align-items:start`（第 3447 行，为整页滚动那版写的），grid 行高虽然
   已被 grid-auto-rows:minmax(0,100%) 钉在容器高（实测 421.672px），但 start 对齐让 item
   按内容高（实测 3505px）铺开、溢出后被 .as-body 的 overflow:hidden 裁掉 ——
   正文列因此**永远不是滚动口**：滚轮在正文上滚不动，3497px 的内容只有 422px 能看见。
   右栏早就用 `align-self:stretch` 单点修过（见下面 .as-side 那条），正文列漏了这一句。 */
.content--as .as-body>.as-feed-col{align-self:stretch;min-height:0;overflow-y:auto;overscroll-behavior-y:contain;padding-bottom:8px}
/* 轮次轨道的"带"改按**正文列自己的高度**算（逐字搬入的 .turnnav-frame 用的是
   --dsh-conversation-viewport-height − --dsh-composer-height，那是"整页滚动"时代的算法：
   正文列一旦成为滚动口，视口高度就与它无关了 —— 1600×1000 下 100dvh 的带会把整条轨道
   算到可视区之外，刻度一个都画不出来）。
   做法：槽位高 = 正文列高，band = 可见高 − 16px，源码的 `top: band/2 + translateY(-50%)`
   于是把刻度放在正文列可视区的中部（与源码的相对位置一致）。
   输入条高度仍由 bindComposerReserve 用 ResizeObserver 实测写回 --as-composer-h，
   只是它不再参与轨道带的计算。 */
.content--as .as-feed-col{--turn-rail-band:clamp(120px,calc(100% - 16px),560px) !important}
.content--as .as-feed-col .as-rail-slot{height:100%;min-height:120px}
.content--as .as-body>.as-side{align-self:start}
/* 右栏成为**独立滚动列**（v32，2026-10-16）：as-focus(151px) / meta-bar(461px) 搬进右栏后
   内容总高实测 1125.5px，而 .as-body 只有 426.8px 且 overflow:hidden —— 不滚的话
   三张 .as-side-p 会被整块裁掉、够不着。dsh 的右栏本身也是一条独立滚动轨道。
   ⚠ min-height:0 不能省：grid/flex 子项默认 min-height:auto，只写 overflow-y:auto
   在部分内核下撑不出滚动口（与上面 .as-feed-col 那条同一写法）。
   ⚠ 这条与上一条 .as-side 的 align-self:start **同优先级 (0,3,0)、位置更靠后** → 覆盖生效；
   实测 computed alignSelf=stretch / overflowY=auto 已确认（不是"看起来应该生效"）。 */
.content--as .as-body>.as-side{align-self:stretch;min-height:0;overflow-y:auto;overscroll-behavior-y:contain}
/* 右栏滚起来时顶部状态区常驻（对齐 dsh sidebar-right 的固定头）。
   它原来是透明底，滚动后会和下面内容重叠 —— sticky 头必须自带底色。
   用 --d-surface（= --dsw-alias-bg-base）：右栏沿路（.as-side / .as-body / .as-view / main.content）
   都没有自己的底色，实际基色就是 bg-base，所以这里不硬套别的令牌。 */
.content--as .as-body>.as-side>.as-side-top{position:sticky;top:0;z-index:1;background:var(--d-surface)}
/* ⚠ 这里原本是一组 7 个座位、统一给 `flex:0 0 auto` 的 `.content--as>.as-view>.xxx`：
   as-composer / as-bottom / as-tasks / as-task-list / as-status / as-live-bar / meta-bar。
   本轮 dsh 对齐把 as-tasks、as-task-list、as-status、as-live-bar 搬进 composer 的 .as-c-dock，
   as-focus 与 meta-bar 搬进右栏 .as-side —— 它们**不再以 .as-view 直接子元素出现**，
   原选择器命中不了任何元素（留着只会让下一个读代码的人以为这些件还挂在 .as-view 上），故剔除。
   实测 .as-view 的直接子元素只剩 .as-hd / .as-body / .as-composer（.as-bottom 仅 st.follow===false
   时才渲染）。所以**仍在座的两个保留**，它们是真守卫：删掉后 .as-composer 的 computed
   flex-shrink 会从 0 变 1（实测），会话列一变矮就会把输入卡压扁，而 dsh 的规矩是
   "正文让位、composer 永不让位"。 */
.content--as>.as-view>.as-composer,
.content--as>.as-view>.as-bottom{flex:0 0 auto}
/* 口径条 .meta-bar 的旧座位规则（`.content--as>.as-view>.meta-bar` 那条 `max-height:9.5em` +
   `overflow-y:auto`）已删除：它本轮已从 .as-feed-col 搬进右栏 .as-side，不再是 .as-view
   直接子元素，那条上限从此命中不了任何元素。 */
/* 页签行是**座位**：不随正文滚走（1280×800 下它是首屏的第一块，滚走会让人失去"我在哪一屏"）。
   .as-hd 是会话屏的 header、.as-tabs 是**轨迹屏**的 .as-view 直接子元素（轨迹屏没有 header，
   页签条仍自成一条），两个都仍然在座。 */
.content--as>.as-view>.as-hd,
.content--as>.as-view>.as-tabs{flex:0 0 auto}
/* SECTION: v27-scoped-type */
/* ── v27：业务屏的档位收敛（作用域覆盖，不修改上面任何既有规则）────────────────
   问题：全站实测出现过 16 档字号（含 12.5 / 11.5 / 10.5 / 14.5 / 13.5 这类非阶梯值）
   与 27 种 padding 组合，同屏"12 还是 12.5"只能靠人记。
   档位定案（与已确认的决定一致）：字号 24 / 20 / 16 / 15 / 14 / 12 / 11；
   间距只用 4 的倍数（4/8/12/16/20/24）。
   作用域：main.content:not(.content--as) —— 排除 DSH 对话屏与轨迹屏，
   那两屏的几何是逐元素照 DSH 源码核对的，不能动。 */
main.content:not(.content--as) .sub-h{font-size:14px;margin:16px 0 8px}
main.content:not(.content--as) .bt-note{font-size:12px;line-height:1.7}
main.content:not(.content--as) .td-sub{font-size:12px;margin-top:2px}
main.content:not(.content--as) .m-sub{font-size:12px}
main.content:not(.content--as) .m-label{font-size:12px}
main.content:not(.content--as) .pill{font-size:12px}
main.content:not(.content--as) .tag{font-size:12px}
main.content:not(.content--as) .meta-row{font-size:13px}
/* 小号变体：原 4px 12px 的按钮在 14px 基准下偏小，统一到 8px 12px（TDesign small = 24px 高） */
main.content:not(.content--as) .btn-ghost.sm,
main.content:not(.content--as) .btn-danger.sm,
main.content:not(.content--as) .btn-warn.sm{padding:4px 12px;font-size:12px;min-height:24px}
main.content:not(.content--as) .btn-primary.sm,.btn-primary.sm{padding:4px 12px;font-size:12px;min-height:24px;border-radius:var(--dsw-radius-btn)}
/* SECTION: v28-identity */
/* ── v28：身份页（成员详情弹窗）─────────────────────────────────────────────
   阿里云 RAM 用户详情是分模块的长页；我们放在弹窗里，所以用紧凑排版 +
   顶部一句话摘要，避免"要读完所有块才知道这人该不该留"。
   类名统一 p- 前缀，不与 DSH 共用类混用。 */
.p-head{display:flex;align-items:center;gap:8px;padding:12px;border:1px solid var(--line);border-radius:var(--dsw-radius-sm);background:#fafbfd;margin-bottom:12px}
.p-head-main{display:flex;flex-direction:column;min-width:0;flex:1}
.p-head-main b{font-size:15px}
.p-head-upn{font-size:12px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-head-state{display:flex;align-items:center;gap:4px;flex:0 0 auto}
.p-head .av-face{margin-right:4px}
/* 权限来源分组：角色 / 用户组 / 直接授予 三段并排，来源一眼可分 */
.p-src-h{display:flex;align-items:center;gap:8px;margin:12px 0 6px;font-weight:600;font-size:13px}
.p-src-hint{font-weight:400;font-size:12px;color:var(--sub)}
/* 权限标签：右栏最长的就是这一段（67 个权限点）。原来 gap 4/6 + .tag 默认内距，
   单栏高度到 1533px —— 分栏本来是为了"一屏内可对比"，一栏自己超长就失去意义。
   收紧为 3/4 与更小的内距，优先保证"来源分布"能一眼扫完。 */
.p-src-list{display:flex;flex-wrap:wrap;gap:3px 4px}
.p-src-list .tag{padding:1px 6px;border-radius:var(--dsw-radius-btn)}
.p-grp{padding:8px 12px;border:1px solid var(--line-soft);border-radius:var(--dsw-radius-sm);margin-bottom:6px}
.p-grp b{font-size:13px;margin-right:8px}
.p-grp .td-sub{font-size:12px}
/* 角色变更的差异预览：新增 / 失去 / 变更后总数。高危用红色，避免"降权"被误当成"提权" */
.p-diff{margin-top:8px}
.p-diff-in{display:flex;flex-direction:column;gap:4px;padding:8px 12px;border:1px solid var(--line);border-radius:var(--dsw-radius-sm);background:#fafbfd;font-size:13px}
.p-diff-in.is-warn{border-color:#f0d9a8;background:#fffbf2}
.p-diff-in.is-danger{border-color:#f3c4c4;background:#fff7f7}
/* SECTION: v28-twocol */
/* ── v28：成员详情双栏 ─────────────────────────────────────────────────────
   左「身份」/ 右「权限」，中间 1px 分隔栏。
   为什么分：这一屏要判断的是"这份权限还该不该留"，
   而判断依据一半在身份（谁、从哪来、怎么登录、有没有 MFA），
   一半在权限（有哪些、从哪来、是不是高危）。一长条滚动会让人只看一半就下结论。
   顶部摘要与「调整角色」按钮跨栏保留在上方 —— 它们是全局动作，不属于任何一栏。 */
.p-cols{display:grid;grid-template-columns:1.05fr 1px 1.05fr;gap:0 20px;align-items:start}
.p-col{min-width:0}
/* 分隔栏用 align-self:start（不 stretch）—— stretch 会让它跟着**最高**那栏拉到 1533px，
   而左栏只有 602px，一条线拖出内容之外一大截。改为与两栏内容大致齐平（min-height 兜底）。 */
.p-col-sep{width:1px;align-self:stretch;max-height:720px;background:var(--line);min-height:240px}
/* SECTION: v29-perm-editor */
/* ── v29：权限编辑器 ───────────────────────────────────────────────────────
   清单即编辑器：每个权限点旁边就是勾选框，底部常驻变更预览与保存。
   高危项用左侧红条 + 红字标识，勾中后预览区立刻累计"含高危 N"。 */
.pe{margin-top:4px}
.pe-sec{border:1px solid var(--line-soft);border-radius:var(--dsw-radius-sm);margin-bottom:8px;overflow:hidden}
.pe-sec>summary{cursor:pointer;padding:8px 12px;display:flex;align-items:center;gap:8px;list-style:none;background:#fafbfd}
.pe-sec>summary::-webkit-details-marker{display:none}
.pe-sec>summary::before{content:"▸";color:var(--faint);font-size:11px}
.pe-sec[open]>summary::before{content:"▾"}
.pe-sec-hd{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fafbfd;border-bottom:1px solid var(--line-soft)}
.pe-sec-h{font-weight:600;font-size:13px}
.pe-sec-hint{font-size:12px;color:var(--sub);flex:1;min-width:0}
.pe-jump{font-size:12px;color:var(--blue);cursor:pointer;flex:0 0 auto}
.pe-list{padding:8px 12px;display:grid;grid-template-columns:1fr 1fr;gap:2px 12px}
.pe-item{display:flex;align-items:center;gap:6px;padding:3px 4px;border-radius:var(--dsw-radius-xs);cursor:pointer;font-size:13px;min-width:0}
.pe-item:hover{background:#f6f8fc}
.pe-item.is-high{box-shadow:inset 2px 0 0 var(--red)}
/* 权限名要能读完：原来 white-space:nowrap + ellipsis 把 `engine:session:intervene`
   截成 `engine:sess...` —— 恰恰把"这是什么权限"截没了。改为允许换行，
   密度靠 grid 的列宽控制，而不是靠截断。 */
.pe-label{flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.4}
.pe-high{color:var(--red);font-size:11px;margin-left:4px;flex:0 0 auto}
.pe-via{font-size:11px;color:var(--faint);flex:0 0 auto}
.pe-bar{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--dsw-radius-sm);background:#fafbfd;margin-top:4px;position:sticky;bottom:0}
.pe-diff{flex:1;font-size:13px;color:var(--sub)}
.pe-diff.is-changed{color:var(--text)}
.pe-diff.is-high{color:var(--red)}
.pe-warn{color:var(--red);font-size:12px}
.pe-ok{color:var(--green);font-size:12px}
.pe-bar-btns{display:flex;gap:8px;flex:0 0 auto}
.pe-high-table{border:1px solid var(--line-soft);border-radius:var(--dsw-radius-sm);overflow:hidden}
.pe-high-row{display:flex;align-items:center;gap:12px;padding:6px 12px;border-bottom:1px solid var(--line-soft);font-size:13px}
.pe-high-row:last-child{border-bottom:0}
.pe-high-name{flex:1;min-width:0}
.pe-high-via{font-size:11px;color:var(--faint);flex:0 0 auto}
.pe-high-use{font-size:12px;flex:0 0 auto;color:var(--sub)}
.pe-high-use.is-never{color:var(--red);font-weight:600}
.p-col .dl{grid-template-columns:88px 1fr}
/* 窄屏退回单栏：硬分两栏会把权限标签挤到换行难读 */
@media (max-width:1080px){
  .p-cols{grid-template-columns:1fr}
  .p-col-sep{display:none}
}
.modal.wide .dl{display:grid;grid-template-columns:96px 1fr;gap:4px 12px;margin:0 0 4px}
.modal.wide .dl dt{color:var(--sub);font-size:13px;padding-top:2px}
.modal.wide .dl dd{margin:0;font-size:13px;min-width:0;overflow-wrap:anywhere}

    /* ==========================================================================
       SECTION: agent-detail-top（v32，2026-10-15）
       业主清单第 ① 项：详情页要有「返回上一级」。
       ⚠ 2026-10-16 修订（外壳对齐）：原方案是**单起一行**（.ph-backrow，24px + 6px 间距 ≈ 30px），
       现已改为**并进 page-head 最左**（dsh 的 headerLeading 槽位：返回/层级控制就在标题行内，
       不在其上再加一行）。`.ph-backrow` / `.ph-back-crumb` 随 renderers.js 的 backRow 一并废弃。
       ========================================================================== */
    .ph-back{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px 0 8px;
      border:1px solid var(--line);border-radius:var(--dsw-radius-btn);background:#fff;color:var(--text);
      font-size:13px;cursor:pointer;transition:border-color var(--ds-transition-duration-fast) var(--ds-ease-in-out),
      color var(--ds-transition-duration-fast) var(--ds-ease-in-out)}
    /* v36：外壳对齐 —— 上面这条是**共享件**，基类保持原值不动。
       `.ph-back` 还有第二处实例（assets/v10-detail-asset.js:52 的返回按钮
       `data-act="ph-back"`，persona/kb/exp 三个详情页共用），走基类必然把它们也压薄。
       所以这里认「**这个返回键本身**」而不是「容器类」：`data-act="goto-cap"` 在全仓只有
       renderers.js 这一处 `.ph-back` 在用（Agent 详情屏 4 个页签共用同一个返回键），
       于是四页签一起对齐、persona/kb/exp 完全不受影响。 */
    .ph-back[data-act="goto-cap"]{height:24px;padding:0 9px 0 7px;font-size:12px}
    .ph-back:hover{border-color:var(--blue);color:var(--blue)}
    .ph-back:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
    .ph-back svg{flex:0 0 auto}

    /* ==========================================================================
       SECTION: ds-usage（v32，2026-10-15）
       业主清单第 ④ 项：运行监控「参考 DS 控制台样子」。
       对照的是 DeepSeek 平台的用量/账单页，把它那套**版式**搬过来（不是搬颜色系统）：
         ① 顶部筛选行：胶囊筛选 + 右侧实心「导出」
         ② 三张大数卡：标签在上、数值极大、单位淡
         ③ 图表卡：卡头「金额（CNY） 合计」+ 右侧分段切换
         ④ 分组区：每个模型两张小图（请求次数 / Tokens）
       柱色沿用对标页取到的六个色相（只用于图表数据，不承载语义）。
       ========================================================================== */
    .ds-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 14px}
    .ds-filter{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;
      border:1px solid var(--line);border-radius:var(--dsw-radius-pill);background:#fff;font-size:13px;color:var(--text)}
    .ds-filter>i{font-style:normal;color:var(--sub);font-size:12px}
    .ds-filter>b{font-weight:600}
    .ds-filter svg{color:var(--faint)}
    .ds-filter:hover{border-color:var(--blue)}
    .ds-bar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
    .ds-export{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 16px;border:0;
      border-radius:var(--dsw-radius-pill);background:#111;color:#fff;font-size:13px;font-weight:600;cursor:pointer}
    .ds-export:hover{opacity:.88}
    .ds-export:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
    .ds-more{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:#fff;cursor:pointer;color:var(--sub)}
    .ds-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:14px}
    @media (max-width:980px){.ds-cards{grid-template-columns:1fr}}
    /* v42（2026-10-22）：底由 #f4f5f6 改白 + 细边。
       对标页（DeepSeek 用量信息）是**白页底 + 浅灰卡**；本仓页面底是 --bg（#f4f6fa），
       同一个浅灰贴上去几乎看不见 —— 卡与底只差一个色阶，三张卡读起来像一块悬浮文字。
       改成与 .ds-panel 同一套「白底 + 1px 边」，卡与图表卡在页面上是同一层实体。 */
    .ds-card{background:#fff;border:1px solid var(--line);border-radius:var(--dsw-radius-lg);padding:16px 18px}
    .ds-card>span{display:block;font-size:13px;color:var(--sub);margin-bottom:10px}
    .ds-card>b{display:block;font-size:32px;line-height:1.15;font-weight:600;letter-spacing:-.5px;
      font-variant-numeric:tabular-nums;color:var(--text)}
    .ds-card>b em{font-style:normal;font-size:14px;font-weight:500;color:var(--faint);margin-left:6px}
    .ds-card>u{display:block;text-decoration:none;margin-top:8px;font-size:12px;color:var(--sub)}
    /* position:relative —— 堆叠柱的整列浮层（.chart-tip）要相对这张卡定位 */
    .ds-panel{position:relative;border:1px solid var(--line);border-radius:var(--dsw-radius-lg);background:#fff;margin-bottom:14px}
    .ds-panel-h{display:flex;align-items:center;gap:12px;padding:14px 16px 6px}
    .ds-panel-h h3{margin:0;font-size:14px;font-weight:600}
    .ds-panel-h .sum{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
    .ds-panel-h .sw{margin-left:auto;display:flex;gap:4px;background:var(--bg-subtle-3);border-radius:var(--dsw-radius-pill);padding:3px}
    .ds-sw{border:0;background:transparent;border-radius:var(--dsw-radius-pill);padding:4px 14px;font-size:12px;color:var(--sub);cursor:pointer}
    .ds-sw.on{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
    .ds-legend{display:flex;gap:16px;flex-wrap:wrap;padding:0 16px 12px;font-size:12px;color:var(--sub)}
    .ds-legend span{display:inline-flex;align-items:center;gap:6px}
    .ds-legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
    .ds-axis{fill:var(--faint);font-size:11px;font-variant-numeric:tabular-nums}
    .ds-chart{display:block;width:100%}
    .ds-chart-empty{padding:36px 16px;text-align:center;color:var(--faint);font-size:13px}
    .ds-groups{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
    .ds-group-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin:6px 0 0}
    .ds-group-h em{font-style:normal;font-weight:400;color:var(--faint);font-size:12px}
    .ds-grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    @media (max-width:980px){.ds-grid2{grid-template-columns:1fr}}
    .ds-mini{padding:12px 16px 8px}
    .ds-mini>b{display:block;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
    .ds-mini>span{font-size:12px;color:var(--sub)}
    .ds-note{padding:0 16px 12px;font-size:12px;color:var(--faint);line-height:1.7}
    /* 堆叠柱 hover（2026-10-22，对标 DeepSeek 用量页）：该列保持原色、其余列变淡，
       另有一条竖向虚线标出"看的是哪一天"。虚线走 stroke-dasharray 而不是背景图，
       因为它要跟着列中心移动（x 由 app.js 写）。 */
    .sb-guide{stroke:#b9bfcc;stroke-width:1;stroke-dasharray:3 3;pointer-events:none}
    .chart-stack .sb-col{transition:opacity .12s ease}
    .chart-stack.acting .sb-col{opacity:.35}
    .chart-stack.acting .sb-col.on{opacity:1}
    /* 浮层里分组名后面的占比（"56.1%"），深底上要压到次级亮度 */
    .chart-tip .ct-sub{font-style:normal;color:rgba(255,255,255,.5);margin-left:6px;font-size:11px;
      font-variant-numeric:tabular-nums}
    /* v32：会话屏的扁头（几何理由见 renderers.js 的 compactHead 注释）——
       一行身份 + 一行描述，右侧仍是时间范围与发布动作。 */
    .page-head.slim{align-items:center;margin-bottom:6px;gap:12px}
    .page-head.slim .ph-title{font-size:15px;line-height:1.25;gap:6px}
    .page-head.slim .ph-desc.slim{margin-top:2px;font-size:12px;line-height:1.35;color:var(--faint);max-width:640px;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    /* v36：外壳对齐 —— 会话屏扁头（.page-head.slim）右侧的「时间范围 + 预检 + 提交发布」三件套
       是**唯一实例**，这里只收内边距与字号；可点、可见、不换行一律保持。 */
    .content--as .page-head.slim .ph-side{gap:6px}
    .content--as .page-head.slim .ph-side .range-pick .rp-btn{padding:5px 10px;font-size:12px}
    .content--as .page-head.slim .ph-side .btn-ghost,
    .content--as .page-head.slim .ph-side .btn-primary{padding:5px 12px;font-size:12.5px}
    .vh-ver{font-size:12px;font-weight:400;color:var(--sub);background:var(--bg-subtle-2);
      border:1px solid var(--line);border-radius:var(--dsw-radius-pill);padding:1px 8px;margin-left:6px}
    .vh-ver b{font-weight:600;color:var(--text)}
    .vh-ver.gray{color:var(--amber);border-color:var(--amber-bg);background:var(--amber-bg)}
    .vh-ver.draft{color:var(--faint)}
    .vh-ver.full{color:var(--green);border-color:var(--green-bg);background:var(--green-bg)}
    /* ==========================================================================
       SECTION: tf（2026-10-25）── Agent 详情 › 监控 › 操作 的「执行轨迹」
       业主原话：「将轨迹翻译成，懂？放在操作里」。会话 › 轨迹那边是逐行事件账本，
       这里把它译成**横向节点流水**：一个节点一张卡（图标 + 名称 + 类型 + 本节点读数），
       卡与卡之间是流转箭头；失败节点标红且是终点，拓扑里它后面的节点画虚线「未执行」。
       随后业主贴了四行流水图「懂？」—— 一条 trace 一行（行首时间 / 成败，行下整条流水），
       按时间往下铺，不是"点 chip 换一条看"。
       数据不另编：节点 / 顺序 / 耗时 / token / 错误码全部来自 FACTS.getTrace(traceId).spans
       （与 trace 列表同一份 row —— facts.js 顶部那条"单一数据源"注释守的就是它）。
       ========================================================================== */
    .tf-card{background:var(--card);border:1px solid var(--line);border-radius:var(--dsw-radius-lg);
      padding:14px 16px;margin-top:14px}
    .tf-head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:10px}
    .tf-head h3{margin:0;font-size:14px;font-weight:600;line-height:1.4}
    .tf-head .tf-sub{display:block;font-size:12px;color:var(--sub);line-height:1.6;margin-top:2px}
    .tf-head .tf-act{margin-left:auto;flex:0 0 auto}
    .tf-list{display:flex;flex-direction:column}
    .tf-row{padding:12px 0 4px;border-top:1px solid var(--line-soft)}
    .tf-row:first-child{border-top:0;padding-top:2px}
    .tf-row-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
    .tf-row-meta{font-size:12px;color:var(--faint);line-height:1.6;min-width:0;
      font-variant-numeric:tabular-nums}
    .tf-row-meta b.bad{color:var(--red)}
    .tf-row-act{margin-left:auto;flex:0 0 auto}
    .tf-row-q{font-size:12px;color:var(--sub);line-height:1.6;margin:-2px 0 6px}
    /* 行首的「几点的这次」：只读标签，不再是选择器（点它下面的按钮看全量 trace）。 */
    .tf-chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;
      border:1px solid var(--line);border-radius:var(--dsw-radius-pill);background:#fff;
      font-size:12px;font-variant-numeric:tabular-nums;flex:0 0 auto}
    .tf-chip em{font-style:normal;font-size:11px;color:inherit}
    .tf-chip i{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
    .tf-chip.is-ok{color:#15803d;border-color:#c6e6d3;background:#f7fcf9}
    .tf-chip.is-ok i{background:var(--green)}
    .tf-chip.is-bad{color:var(--red);border-color:#f3c9c9;background:#fffafa}
    .tf-chip.is-bad i{background:var(--red)}
    .tf-scroll{overflow-x:auto;padding:6px 2px 8px;scrollbar-width:thin}
    /* 卡宽随容器伸缩：宽屏（1920）每张到 190px，1440 视口下 7 个节点的工具型拓扑也能整条放下
       （约 133px/张）；再窄才横向滚 —— 字号始终不缩，靠减宽度而不是缩字。 */
    .tf-flow{display:flex;align-items:stretch;width:100%}
    .tf-node{position:relative;flex:1 1 0;min-width:132px;max-width:190px;background:#fff;
      border:1px solid var(--line);border-left:3px solid var(--line);border-radius:12px;padding:10px 11px;
      display:flex;flex-direction:column;gap:6px;box-shadow:0 1px 2px #0000000a}
    .tf-node.k-start{border-left-color:#94a3b8}
    .tf-node.k-llm{border-left-color:#3b82f6}
    .tf-node.k-tool{border-left-color:#8b5cf6}
    .tf-node.k-guard{border-left-color:#f59e0b}
    .tf-node.k-end{border-left-color:#16a34a}
    .tf-node.is-fail{border-color:#f3c9c9;border-left-color:var(--red);background:#fffafa}
    .tf-node.is-off{border-style:dashed;background:var(--bg-subtle-1);opacity:.68}
    .tf-n-top{display:flex;align-items:center;gap:8px;min-width:0}
    .tf-n-ico{width:26px;height:26px;border-radius:7px;flex:0 0 auto;
      display:flex;align-items:center;justify-content:center}
    .tf-node.k-start .tf-n-ico{background:#eef1f5;color:#64748b}
    .tf-node.k-llm .tf-n-ico{background:#e8f0fe;color:#2563eb}
    .tf-node.k-tool .tf-n-ico{background:#f2ecfe;color:#7c3aed}
    .tf-node.k-guard .tf-n-ico{background:#fdf3e2;color:#b45309}
    .tf-node.k-end .tf-n-ico{background:#e8f6ee;color:#15803d}
    .tf-node.is-fail .tf-n-ico{background:var(--red-bg);color:var(--red)}
    .tf-n-name{font-size:13px;font-weight:600;line-height:1.3;color:var(--text);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
    .tf-n-kind{font-size:11.5px;line-height:1.35;color:var(--faint);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .tf-n-meta{display:flex;align-items:center;gap:4px;border-top:1px solid var(--line-soft);
      padding-top:6px;margin-top:auto;font-size:10.5px;color:var(--sub);
      font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
    .tf-n-meta b{font-weight:600;color:var(--text)}
    .tf-n-meta span{min-width:0;overflow:hidden;text-overflow:ellipsis}
    .tf-node.is-fail .tf-n-meta b{color:var(--red)}
    .tf-node.is-off .tf-n-meta{color:var(--faint)}
    .tf-link{flex:0 0 20px;width:20px;position:relative;display:flex;align-items:center;justify-content:center}
    .tf-link:before{content:'';position:absolute;left:4px;right:8px;top:50%;height:1px;background:#c9d1e0}
    .tf-link:after{content:'';position:absolute;right:4px;top:calc(50% - 4px);width:8px;height:8px;
      border-top:1px solid #c9d1e0;border-right:1px solid #c9d1e0;transform:rotate(45deg)}
    /* 未执行段的首个连接段稍微加宽放「中断」二字，但仍要收在 28px 内：
       7 节点 + 这段 34px 时，1440 下第二行会横向溢出 24px（实测），28 刚好不溢。 */
    .tf-link.off{flex:0 0 28px;width:28px}
    .tf-link.off:before{background:none;border-top:1px dashed #c9d1e0}
    .tf-link.off:after{border-color:#d7dde8}
    /* 「中断」压在箭头线中段（白底把线断开），不占卡面、也不掉到卡片下沿外面。 */
    .tf-link span{position:absolute;top:50%;transform:translateY(-50%);font-size:9.5px;line-height:1;
      letter-spacing:0;color:var(--faint);white-space:nowrap;background:var(--card);padding:0 1px}
    .tf-note{font-size:11.5px;color:var(--faint);line-height:1.7;margin-top:2px}
    /* ==========================================================================
       SECTION: cwall（v33，2026-10-15）
       业主清单第 ⑤ 项：MCP / 技能 / 沙盒等做成**卡片墙**放在一页。
       版式参照的是能力画廊那一类页面：顶部页内分页（连接器 / 技能 / 知识库 / 沙盒），
       下面一片等宽卡片，每张卡 = 图标 + 名称 + 一句话 + 3~4 个关键数字 + 状态。
       为什么不用表格：这几类资产的核心动作是"挑一个挂给 Agent"，
       浏览与比较比逐列对齐更重要；真要逐列比，网关页与沙盒页本来就是表。
       ========================================================================== */
    .cwall-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px;border-bottom:1px solid var(--line);padding-bottom:10px}
    .cwall-tab{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border:1px solid var(--line);
      border-radius:var(--dsw-radius-pill);background:#fff;color:var(--sub);font-size:13px;cursor:pointer}
    .cwall-tab:hover{border-color:var(--blue);color:var(--blue)}
    .cwall-tab.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
    .cwall-tab:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
    .cwall-tab svg{flex:0 0 auto}
    .cwall-n{font-style:normal;font-size:11px;min-width:18px;text-align:center;border-radius:9px;
      background:var(--bg-subtle-3);color:var(--sub);padding:1px 5px}
    .cwall-tab.on .cwall-n{background:rgba(255,255,255,.24);color:#fff}
    .cwall-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px}
    .cwall-lab{font-size:12px;color:var(--faint)}
    .cwall-chips{display:flex;gap:6px;flex-wrap:wrap}
    .cwall-chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border:1px solid var(--line);
      border-radius:var(--dsw-radius-pill);background:#fff;color:var(--sub);font-size:12px;cursor:pointer}
    .cwall-chip:hover{border-color:var(--blue);color:var(--blue)}
    .cwall-chip.on{border-color:var(--blue);color:var(--blue);background:var(--blue-bg);font-weight:600}
    .cwall-chip i{font-style:normal;color:var(--faint)}
    .cwall-chip.on i{color:var(--blue)}
    .cwall-count{margin-left:auto;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
    /* v36（2026-10-15 业主：「记得卡片样式，要有我们自己的风格」）：
       形制保留（图标 + 名称 + 一句话 + 关键数字 + 右上角一个动作），长相换回本仓设计语言 ——
       浅底 + 发丝线分格、状态点用 statedot 原语、身份标识等宽、读数用等宽数字，
       不借腾讯云那版的深色卡与品牌墙味道。
       结构：外层 div 负责边框/告警竖条/悬停；内部是 .cw-main（整卡点开详情）＋页脚两颗**有文字**的控件
       （.cw-join「接入」按钮 / .cw-open「详情 →」链接）—— 不用图标按钮、更不用加号：加号是"从能力市场装别人的东西"的语义，而我们的资产是自己建的。 */
    .cwall{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
    @media (min-width:1680px){.cwall{grid-template-columns:repeat(4,minmax(0,1fr))}}
    @media (max-width:1180px){.cwall{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media (max-width:720px){.cwall{grid-template-columns:1fr}}
    .cwall-card{position:relative;display:flex;flex-direction:column;min-width:0;
      border:1px solid var(--line);border-radius:var(--dsw-radius-lg);background:#fff;
      transition:border-color var(--ds-transition-duration-fast) var(--ds-ease-in-out),
      background var(--ds-transition-duration-fast) var(--ds-ease-in-out)}
    .cwall-card:hover{border-color:var(--blue);background:var(--bg-subtle-1)}
    .cwall-card:focus-within{border-color:var(--blue)}
    /* 告警态不给左侧色条（2026-10-19 业主：「不要这个」），状态靠页脚那行字变红区分 */
    .cw-main{display:flex;flex-direction:column;gap:9px;text-align:left;min-width:0;
      padding:13px 14px 10px;border:0;background:transparent;font:inherit;color:inherit;cursor:pointer}
    .cw-main:focus-visible{outline:2px solid var(--blue);outline-offset:-2px;border-radius:var(--dsw-radius-lg)}
    /* v36b：右上角不再有「＋」（业主：我们的资产是自己建的，不用商店那种加号），标题也就不需要留空位了。 */
    .cw-hd{display:flex;align-items:center;gap:10px;min-width:0}
    .cw-ico{flex:0 0 32px;width:32px;height:32px;border-radius:var(--dsw-radius-md);display:inline-flex;
      align-items:center;justify-content:center;background:var(--blue-bg);color:var(--blue)}
    .cw-ico[data-tone="purple"]{background:#f3f0ff;color:#6b46c1}
    .cw-ico[data-tone="green"]{background:var(--green-bg);color:var(--green)}
    .cw-ico[data-tone="amber"]{background:var(--amber-bg);color:var(--amber)}
    .cw-ico[data-tone="gray"]{background:var(--bg-subtle-3);color:var(--sub)}
    .cw-title{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1 1 auto}
    .cw-title b{font-size:14px;font-weight:600;overflow-wrap:anywhere}
    .cw-title em{font-style:normal;font-size:11px;color:var(--faint);
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .cw-desc{font-size:13px;color:var(--sub);line-height:1.6;min-height:2.6em;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    /* 读数用发丝线分格：标签 11px、数值等宽数字（与 KPI 卡、明细表同一套读法） */
    .cw-metas{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line-soft)}
    .cw-meta{display:flex;flex-direction:column;gap:1px;padding:7px 0 0;min-width:0}
    .cw-meta:nth-child(even){padding-left:12px;border-left:1px solid var(--line-soft)}
    /* 第二行读数补一条横线：不然 2×2 只有竖线，读起来不像表（实测截图对比后加的） */
    .cw-meta:nth-child(n+3){border-top:1px solid var(--line-soft);padding-top:8px;margin-top:8px}
    .cw-meta i{font-style:normal;font-size:11px;color:var(--faint)}
    .cw-meta b{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .cw-foot{display:flex;align-items:center;gap:8px;padding:8px 14px 11px;min-width:0;
      border-top:1px solid var(--line-soft);font-size:12px;color:var(--faint)}
    .cw-state{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;color:var(--sub)}
    /* 需要关注：只把这一行字染红，不加圆点、不加左色条（业主 2026-10-19）
       色值直取 :root 的 error-primary —— --d-red 那层别名没定义在 :root，取到空值会退回灰色（实测踩到）。 */
    .cw-state.is-warn{color:var(--dsw-alias-state-error-primary);font-weight:600}
    .cw-refs{flex:1 1 auto;min-width:0;text-align:right;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    /* 卡片页脚的两颗动作：接入是 .btn-ghost.sm（全站同款），详情是蓝色文字链接 */
    .cw-join{flex:0 0 auto}
    .cw-foot .btn-ghost.sm{min-height:24px}
    .cw-open{flex:0 0 auto;color:var(--blue);font-weight:600;display:inline-flex;align-items:center;gap:3px}
    .cw-open i{font-style:normal;transition:transform var(--ds-transition-duration-fast) var(--ds-ease-in-out)}
    .cwall-card:hover .cw-open i{transform:translateX(2px)}
    /* 抽屉里的「接入到 Agent」：卡片墙（v39，业主截图要求由行列表改卡片）
       两列而不是三列：抽屉内容宽约 640px，三列会把 Agent 名和「接入」按钮挤成两行。
       卡片按「谁 → 干什么 → 多大量」三层排：头行认人、描述一行看用途、脚注看模型与调用量。 */
    .cw-agents{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 12px}
    .cw-ag{display:flex;flex-direction:column;gap:7px;min-width:0;padding:11px 12px 10px;
      border:1px solid var(--line-soft);border-radius:var(--dsw-radius-lg,10px);background:var(--card)}
    .cw-ag.on{border-color:var(--blue-line);background:var(--blue-bg)}
    .cw-ag-hd{display:flex;align-items:center;gap:9px;min-width:0}
    .cw-ag .av{width:28px;height:28px;flex:0 0 28px;font-size:12px;margin:0}
    .cw-ag-t{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 auto}
    .cw-ag-t b{font-size:13px;font-weight:600;color:var(--text);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cw-ag-t em{font-style:normal;font-size:11.5px;color:var(--faint);min-height:16px;
      display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden}
    .cw-ag-tag{font-style:normal;font-size:10.5px;line-height:14px;padding:0 5px;border-radius:999px;
      border:1px solid var(--blue-line);background:var(--blue-bg);color:var(--blue);white-space:nowrap}
    .cw-ag-desc{font-size:12px;color:var(--sub);line-height:1.55;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .cw-ag-ft{display:flex;align-items:center;gap:8px;margin-top:auto}
    .cw-ag-m{flex:1 1 auto;min-width:0;font-size:11px;color:var(--faint);
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .cw-ag-ft .btn-ghost.sm{min-height:24px}
    .cw-ag-on{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--d-green)}
    /* 接入后就地勾工具：默认全开（蓝），关掉的是灰边空底。工具名是机器令牌，走等宽体。 */
    .cw-ag-tools{display:flex;flex-direction:column;gap:5px;padding-top:7px;border-top:1px dashed var(--line-soft)}
    .cw-ag-tools-h{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--faint)}
    .cw-ag-tools-h b{color:var(--sub);font-weight:600;font-variant-numeric:tabular-nums}
    .cw-ag-tools-l{display:flex;flex-wrap:wrap;gap:4px}
    .cw-tool{font-family:"SF Mono",Consolas,monospace;font-size:11px;line-height:1.55;padding:1px 7px;
      border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--faint);cursor:pointer}
    .cw-tool.on{border-color:var(--blue-line);background:var(--blue-bg);color:var(--blue)}
    .cw-tool:hover{border-color:var(--blue)}
    /* 抽屉两栏（v40，业主截图：像文档查看器那样左右各一屏、各自滚）
       信息在左（一列键值，窄），操在右（2 列 Agent 卡，宽）—— 所以是 1fr / 1.35fr。 */
    .cw-2col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:20px;margin-top:6px}
    .cw-pane{min-width:0;max-height:60vh;overflow:auto}
    .cw-pane-l{border-right:1px solid var(--line-soft);padding-right:20px}
    .cw-note{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line-soft);
      font-size:12px;color:var(--faint);line-height:1.65}
    .cw-note b{color:var(--sub);font-weight:600}
    .cw-hint{margin-left:8px;font-weight:400;font-size:11.5px;color:var(--faint)}
    .cw-raw{margin-top:16px;border-top:1px dashed var(--line-soft);padding-top:10px}
    .cw-raw>summary{cursor:pointer;font-size:12px;color:var(--faint);list-style:none}
    .cw-raw>summary::-webkit-details-marker{display:none}
    .cw-raw>summary::before{content:'▸';display:inline-block;margin-right:6px}
    .cw-raw[open]>summary::before{content:'▾'}
    .cw-raw .dl{margin-top:8px}
    .cw-users{display:flex;flex-wrap:wrap;gap:6px}
    .cw-user{font-size:12px;line-height:1.6;padding:2px 8px;border-radius:999px;
      background:var(--bg-subtle-2);color:var(--sub)}
    .cw-empty{font-size:12px;color:var(--faint)}
    @media (max-width:980px){
      .cw-2col{grid-template-columns:1fr}
      .cw-pane{max-height:none;overflow:visible}
      .cw-pane-l{border-right:0;padding-right:0;padding-bottom:14px;border-bottom:1px solid var(--line-soft)}
    }
    .cw-actions{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
    /* ==========================================================================
       SECTION: perm-edit（v34，2026-10-15）
       业主清单第 ⑥ 项：权限类控件要能**直接编辑**，不做只读陈列。
       这里只放工具授权与回滚条件这两块的样式；确认层/理由框/审计都复用 v10-ui 既有件，
       不重复实现（那套已经收口了门禁、风险档与审计）。
       ========================================================================== */
    .ptool-row{border-top:1px solid var(--line-soft);padding:10px 0 4px}
    .ptool-row:first-of-type{border-top:0}
    .ptool-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
    .ptool-ico{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
      border-radius:var(--dsw-radius-sm);background:var(--blue-bg);color:var(--blue)}
    .ptool-hd b{font-size:13px}
    .ptool-src{font-size:12px;color:var(--faint);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .ptool-n{margin-left:auto;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
    .ptool-chips{display:flex;flex-wrap:wrap;gap:6px}
    .ptool{display:inline-flex;align-items:stretch;border:1px solid var(--line);border-radius:var(--dsw-radius-pill);
      background:#fff;overflow:hidden}
    .ptool.on{border-color:var(--blue);background:var(--blue-bg)}
    .ptool-b{border:0;background:transparent;font:inherit;font-size:12px;color:var(--sub);cursor:pointer;
      padding:4px 10px;display:inline-flex;align-items:center;gap:4px}
    .ptool.on .ptool-b{color:var(--blue);font-weight:600}
    .ptool-b:hover{color:var(--blue)}
    .ptool-b:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
    .ptool-w{font-style:normal;font-size:10px;color:var(--amber);border:1px solid var(--amber-bg);
      background:var(--amber-bg);border-radius:3px;padding:0 3px}
    .ptool-u{border:0;border-left:1px solid var(--line);background:#fff;color:var(--blue);font-size:11px;
      cursor:pointer;padding:4px 8px}
    .ptool-undo{display:flex;align-items:center;gap:10px;margin-top:10px;padding:8px 12px;border-radius:var(--dsw-radius-md);
      background:var(--blue-bg);font-size:12px;color:var(--sub)}
    .ptool-undo b{color:var(--text)}
    .rg-ctl{display:inline-flex;gap:6px;flex-wrap:wrap;margin-left:8px}
    .perm-flash{animation:permFlash 1.6s ease-out}
    @keyframes permFlash{0%{box-shadow:0 0 0 3px var(--blue-bg)}100%{box-shadow:0 0 0 0 rgba(37,99,235,0)}}
    /* v33b：二级分页（业主：「分页下面再分页」）。
       一级是资产大类，二级是"在这一类里看什么" —— 二级做成**下划线式**页签，
       与一级的胶囊拉开层级：胶囊=选了哪一类，下划线=这一类里的哪张视图。 */
    .cwall-subtabs{display:flex;gap:2px;flex-wrap:wrap;margin:-4px 0 12px;border-bottom:1px solid var(--line)}
    .cwall-subtab{border:0;background:transparent;font:inherit;font-size:13px;color:var(--sub);cursor:pointer;
      padding:7px 12px 9px;border-bottom:2px solid transparent;margin-bottom:-1px}
    .cwall-subtab:hover{color:var(--blue)}
    .cwall-subtab.on{color:var(--blue);font-weight:600;border-bottom-color:var(--blue)}
    .cwall-subtab:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
    /* 嵌进来的原能力页自带 page-head（它们原本是独立的侧栏页）——
       在这里降级成小节标题：保留它自己的口径说明，但不再抢一级页头的层级。 */
    .cwall-deep .page-head{margin:6px 0 12px;padding:0;border:0;align-items:flex-start}
    .cwall-deep .page-head .ph-title{font-size:15px;font-weight:600}
    .cwall-deep .page-head .ph-desc{font-size:12px;color:var(--faint);margin-top:4px;max-width:none}
    .cwall-deep .page-head .ph-side{margin-left:auto}
    /* SECTION: awc（v38，2026-10-18）── Agent 详情 › 管理 › 联系
       形制学自业主给的能力画廊截图：一行一张卡，图标在左、名称 + 一句话在中间、右上角一个动作。
       配色不照搬截图（那套是深色卡）：本页是浅底，插一排黑卡会把整页的层级打断，
       所以底色/描边走本仓令牌，只有图标底色沿用 .cw-ico 的五档（色值只此一处）。 */
    /* 2026-10-18 第三轮（业主：「不要抽屉收纳，全部展开，全部竖向分类排列」）：
       左侧分类列取消 —— 四类直接从上往下铺，每类一个小标题；点卡片就地展开参数，没有弹层。 */
    .awc-sec{display:flex;align-items:baseline;gap:8px;margin:22px 0 10px}
    .awc-sec:first-of-type{margin-top:14px}
    .awc-sec h4{font-size:14px;font-weight:600}
    .awc-sec em{font-style:normal;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
    .awc-col{min-width:0}
    .awc-stat{font-size:12px;color:var(--faint);margin:0 0 2px;font-variant-numeric:tabular-nums}
    .awc-stat b{font-weight:600;color:var(--sub)}
    .awc-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
    @media (min-width:1680px){.awc-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
    @media (max-width:1180px){.awc-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media (max-width:720px){.awc-grid{grid-template-columns:1fr}}
    .awc-card{position:relative;display:flex;flex-direction:column;align-items:stretch;min-width:0;
      padding:11px 12px;border:1px solid var(--line);border-radius:var(--dsw-radius-md);
      background:var(--card);transition:border-color .12s ease,background .12s ease}
    .awc-row{display:flex;align-items:center;gap:11px;min-width:0}
    .awc-card:hover{border-color:var(--blue)}
    /* 已联系：淡蓝底 + 左侧品牌蓝竖条（状态靠位置+底色区分，不靠堆颜色） */
    .awc-card.on{background:var(--blue-bg);border-color:var(--blue-line)}
    .awc-card.on::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:3px;
      border-radius:0 3px 3px 0;background:var(--blue)}
    /* 服务没接入时的工具卡：置灰但**仍可读**（不隐藏 —— 藏起来就看不出"还能授什么"） */
    .awc-card.off{opacity:.55}
    .awc-card .cw-ico{flex:0 0 38px;width:38px;height:38px;border-radius:11px}
    .awc-txt{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
    .awc-txt b{font-size:14px;font-weight:600;line-height:1.35;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .awc-txt b.mono{font-family:var(--mono,ui-monospace,SFMono-Regular,Menlo,monospace);font-size:13px}
    .awc-txt em{font-style:normal;font-size:12px;color:var(--sub);line-height:1.4;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    /* 右上角的动作：**开关**（业主：「人家是库所以有加，我们是按钮」）。
       ＋ 是"从库里装一个"的语义；我们是"这个 Agent 现在连不连它"，用开关才对。
       开＝品牌绿（与全站"可用/通过"同一色），关＝灰；点卡片主体是另一件事（开详情）。 */
    .awc-main{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:11px;
      background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
    .awc-main:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:6px}
    .awc-sw{flex:0 0 38px;width:38px;height:21px;border-radius:11px;border:0;padding:0;
      position:relative;cursor:pointer;background:var(--bg-subtle-3);transition:background .15s ease}
    .awc-sw i{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;
      background:#fff;box-shadow:0 1px 2px rgba(15,23,42,.24);transition:transform .15s ease}
    .awc-sw:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
    .awc-card.on .awc-sw{background:var(--green)}
    .awc-card.on .awc-sw i{transform:translateX(17px)}
    .awc-card.off .awc-sw{cursor:not-allowed;background:var(--bg-subtle-3);opacity:.6}
    .awc-card.off .awc-sw i{background:var(--bg-subtle-1)}
    /* 详情抽屉里：一行一个可编辑项，档位做成小按钮（本仓抽屉里没有统一表单皮肤，
       而"点一下就改"正是这一页的交互，不让人手打数字）。 */
    .awc-dt{display:flex;align-items:center;gap:11px;margin:0 0 12px}
    .awc-dt .cw-ico{flex:0 0 42px;width:42px;height:42px;border-radius:12px}
    .awc-dt-t{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
    .awc-dt-t b{font-size:15px;font-weight:600}
    .awc-dt-t b.mono{font-family:var(--mono,ui-monospace,SFMono-Regular,Menlo,monospace);font-size:13px}
    .awc-dt-t em{font-style:normal;font-size:12px;color:var(--sub);
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    /* 参数项在窄卡片里竖排（标签一行、档位一行）：横排时 4 个档位放不下会折成两行，更难读 */
    .awc-fld{display:flex;flex-direction:column;align-items:flex-start;gap:5px;
      padding:7px 0;border-bottom:1px solid var(--line-soft)}
    .awc-fld:last-child{border-bottom:0}
    .awc-fld>i{font-style:normal;font-size:11px;color:var(--faint);flex:0 0 auto}
    .awc-opts{display:flex;gap:6px;flex-wrap:wrap}
    /* 就地展开区：事实一行 + 参数若干行（不再是抽屉） */
    .awc-card.is-open{border-color:var(--blue);background:#fff}
    .awc-exp{border-top:1px solid var(--line-soft);margin-top:10px;padding-top:9px}
    /* 事实一行一条（标签 + 值横排）：卡片只有 1/3 宽，竖排的窄格里长值会挤成三行 */
    .awc-facts{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
    .awc-fact{display:flex;gap:8px;align-items:baseline;min-width:0}
    .awc-fact i{flex:0 0 72px;font-style:normal;font-size:11px;color:var(--faint)}
    .awc-fact b{flex:1 1 auto;min-width:0;font-size:12px;font-weight:500;color:var(--sub);line-height:1.5}
    .awc-exp-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:9px}
    .awc-hint{font-size:11px;color:var(--faint)}
    .awc-opt{height:26px;padding:0 11px;border:1px solid var(--line);border-radius:var(--dsw-radius-sm);
      background:var(--card);color:var(--sub);font-size:12px;cursor:pointer;font-variant-numeric:tabular-nums}
    .awc-opt:hover{border-color:var(--blue);color:var(--blue)}
    .awc-opt.on{border-color:var(--blue);background:var(--blue-bg);color:var(--blue);font-weight:600}
    .awc-opt:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
    /* SECTION: am-sec（2026-10-18）── Agent 详情 › 管理 的分节标（01–04）
       四个二级分页合并成一条长页后，需要"段"的层级：编号 + 标题 + 一句它回答什么问题。
       不用卡片、不用底色 —— 它只是一条视线锚点，不该和下面的卡抢重量。 */
    .am-sec{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:26px 0 12px}
    .am-sec:first-child{margin-top:0}
    .am-no{font-size:11px;font-weight:600;color:var(--blue);background:var(--blue-bg);
      border:1px solid var(--blue-line);border-radius:4px;padding:0 5px;line-height:17px;
      font-variant-numeric:tabular-nums;flex:0 0 auto}
    .am-sec h2{font-size:16px;font-weight:600;line-height:1.4}
    .am-sec .am-side{margin-left:auto;display:inline-flex;gap:8px;align-items:center}
/* SECTION: v37 舆情分析看板（11 层）── 只服务 assets/v37-op-board.js
   为什么自己一套前缀而不是复用 .card：看板是 12 栅格密排 + 图表容器，卡片内边距/高度分配
   与普通 .card 不同（普通卡 16px + margin-bottom:14px，会把 12 栅格挤成瀑布）。
   颜色一律取令牌，只有图表分区（红/黄/绿/蓝）用语义色值，与 risk 分级同一套。 */
.opb{margin-top:18px}
/* 评估范围：网络 + 地图这两张卡属于「当前实验样本」，跟上面的案例结论不同源，标一句免得混起来 */
.op-scope{display:flex;align-items:center;gap:8px;margin:20px 0 10px;font-size:12px;color:var(--sub);font-weight:500}
.op-scope:before{content:'';width:3px;height:12px;border-radius:2px;background:var(--line)}
.opb-sec{display:flex;align-items:baseline;gap:10px;margin:2px 0 12px;flex-wrap:wrap}
.opb-sec h3{font-size:16px;font-weight:600}
.opb-sub{font-size:12px;color:var(--faint)}
.opb-meta{margin-left:auto;font-size:12px;color:var(--sub);background:var(--bg-subtle-2);border-radius:var(--dsw-radius-pill);padding:3px 10px}
/* 2026-10-18 晚：看板固定走案例，标题行的数据源开关（.opb-sw）已删除 */
.opb-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.opb-card{background:var(--card);border:1px solid var(--line);border-radius:var(--dsw-radius-xs);padding:13px 15px 11px;display:flex;flex-direction:column;min-width:0}
.opb-card.w4{grid-column:span 4}
.opb-card.w5{grid-column:span 5}
.opb-card.w6{grid-column:span 6}
.opb-card.w7{grid-column:span 7}
.opb-card.w8{grid-column:span 8}
/* 同一列里叠两张卡（② 拆成 影响 + 主体）：外层占 6 列，内层各自撑满、按内容均分高度 */
.opb-col{grid-column:span 6;display:flex;flex-direction:column;gap:14px;min-width:0}
.opb-col>.opb-card{grid-column:auto;flex:1}
.opb-imp3{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px}
.opb-imp3 .r{display:grid;grid-template-columns:46px 30px 1fr;gap:10px;align-items:center}
.opb-imp3 .r>b{font-size:13px;font-weight:600;text-align:right;letter-spacing:.02em}
.opb-face{width:26px;height:26px;flex:0 0 auto;display:block}
/* 影响卡：只放一个结论（大表情 + 大字 + 一句依据） */
.opb-big{flex:1;display:flex;align-items:center;gap:14px;min-height:0}
.opb-big .opb-face{width:44px;height:44px}
.opb-big .tx b{display:block;font-size:18px;font-weight:600;color:#b91c1c;line-height:1.3}
.opb-big .tx span{display:block;font-size:12.5px;color:var(--sub);line-height:1.6;margin-top:5px}
.opb-imp3 .r>span{font-size:12.5px;color:#1f2430;line-height:1.55}
.opb-imp3 .r>span em{font-style:normal;color:var(--faint);margin-right:6px}
.opb-card.w12{grid-column:span 12}
.opb-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.opb-l{font-style:normal;font-size:11px;color:var(--blue);background:var(--blue-weak);border-radius:4px;padding:1px 5px;line-height:16px;flex:0 0 auto}
.opb-h h4{font-size:14px;font-weight:600}
.opb-cs{margin-left:auto;font-size:11px;color:var(--faint);white-space:nowrap}
.opb-note{margin-top:auto;padding-top:9px;font-size:11.5px;color:var(--faint);line-height:1.5;border-top:1px dashed var(--line-soft)}
.opb-svg{width:100%;display:block;overflow:visible}
.opb-tm{max-width:560px;margin:0 auto}
.opb-tl-t{font-size:11.5px;fill:#5b6478}
.opb-tl-s{font-size:10.5px;fill:#9aa3b5}
/* ① 竖排时间线：阶段号 · 事件 · 一句话说明（业主给的节点样式） */
.opb-flow{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;margin:2px 0;background:linear-gradient(#d3dded,#d3dded) no-repeat 10.5px 26px/3px calc(100% - 26px)}
.opb-fl{display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:center;padding:13px 0}
.opb-fl i{width:18px;height:18px;border-radius:50%;border:3.5px solid #fff;justify-self:center;position:relative;z-index:1;box-shadow:0 0 0 1px rgba(31,36,48,.07)}
.opb-fl .k{display:block;font-size:11px;color:var(--blue);line-height:1.3;letter-spacing:.02em}
.opb-fl b{display:block;font-size:15.5px;color:#1f2430;font-weight:500;line-height:1.35;margin:1px 0 2px}
.opb-fl em{display:block;font-style:normal;font-size:12px;color:var(--faint);line-height:1.5}
.opb-ring{width:80px;height:80px;flex:0 0 auto}
.opb-rings{display:flex;gap:4px;justify-content:space-between;margin-top:2px}
.opb-rings .opb-ring{width:76px;height:76px}
.opb-rings-s .opb-ring{width:62px;height:62px}
.opb-ring-v{font-size:16px;font-weight:600;fill:#1f2430}
.opb-ring-s{font-size:9px;fill:#8a93a6}
.opb-rc{display:flex;align-items:center;justify-content:center}
.opb-donut{width:142px;height:142px;flex:0 0 auto}
.opb-dv{font-size:14px;font-weight:600;fill:#1f2430}
.opb-ds{font-size:8.5px;fill:#8a93a6}
.opb-split{display:flex;gap:14px;align-items:center;margin-top:2px}
/* 同一行里卡片被最高的那张撑开：让图与图例占满剩余高度并居中，别都堆在顶部 */
.opb-card .opb-split{flex:1}
/* ② 的邻居（时间线）很高：三层说明按高度均分，和左侧节点大致对齐，别全挤在中间 */
.opb-split-v{align-items:stretch;justify-content:space-between}
.opb-split-v .opb-leg{flex:0 1 auto;margin-left:auto;width:60%;max-width:392px}
.opb-split-v .opb-con{align-self:center}
.opb-leg{display:grid;grid-template-columns:1fr 1fr;gap:3px 14px;font-size:11.5px;color:var(--sub);flex:1;min-width:0;align-content:center}
.opb-leg span{display:flex;align-items:center;gap:5px;white-space:nowrap}
.opb-leg i{width:7px;height:7px;border-radius:2px;flex:0 0 auto}
.opb-leg b{margin-left:auto;color:var(--text);font-weight:500}
.opb-leg-v{grid-template-columns:1fr;gap:14px}
.opb-leg-v em{font-size:11.5px}
.opb-leg-v b{font-size:15px;font-weight:600}
.opb-leg-v span{white-space:normal;align-items:flex-start}
.opb-leg em{font-style:normal;flex:1;min-width:0;font-size:10.5px;color:var(--faint);line-height:1.45}
.opb-leg-v b{margin-left:auto;flex:0 0 auto;text-align:right;min-width:46px;font-variant-numeric:tabular-nums;line-height:1.4}
/* ④ 可下钻的图例（2026-10-19）：整行可点，右侧给个 ›；hover 才上底色，平时不抢 */
.opb-leg-btn{cursor:pointer;border-radius:4px;padding:2px 5px;margin:-2px -5px;transition:background .15s}
.opb-leg-btn:hover{background:var(--bg-subtle-2)}
.opb-leg-btn:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.opb-leg-btn s{text-decoration:none;color:var(--decor);margin-left:2px;font-size:10px;line-height:1}
.opb-back{cursor:pointer;color:var(--blue);font-weight:500}
.opb-back:hover{text-decoration:underline}
.opb-back:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:3px}
/* ④ 渠道与路径（2026-10-19）：图例按「点火→站队→收口→定型」单列排，行内带角色标；
   路径三问接在图下面 —— 渠道和路径不分成两块看 */
.opb-chan .opb-donut{width:118px;height:118px}
.opb-chan .opb-leg{grid-template-columns:1fr;gap:2px;font-size:11px;align-content:center}
.opb-role{text-decoration:none;font-style:normal;font-size:9.5px;line-height:1;padding:2px 4px;border-radius:3px;background:var(--bg-subtle-2);color:var(--sub);margin:0 3px}
.opb-path{margin-top:8px;border-top:1px dashed var(--line);padding-top:7px;display:flex;flex-direction:column;gap:3px;font-size:10.5px;color:var(--sub);line-height:1.5}
.opb-path b{display:inline-block;min-width:42px;color:var(--text);font-weight:600}
.opb-tell{display:flex;flex-direction:column;gap:10px;padding:8px 0 2px}
.opb-tell-r{display:flex;gap:9px;align-items:flex-start;font-size:12px;color:var(--sub);line-height:1.6}
.opb-tell-r span{flex:1;min-width:0}
.opb-tell-k{flex:0 0 auto;width:38px;height:20px;border-radius:4px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font-style:normal}
.opb-tell-k.k1{background:#eef4ff;color:#2563eb}
.opb-tell-k.k2{background:#fef2f2;color:#b91c1c}
.opb-tell-k.k3{background:#f3f4f6;color:#6b7280}
.opb-read{margin-top:10px;padding-left:9px;border-left:3px solid var(--blue);font-size:11.5px;color:var(--sub);line-height:1.6}
.opb-read b{color:var(--text);font-weight:600}
/* ④ 重构（2026-10-19 业主口径）：上半路径条，下半渠道块，两个维度压在一张卡里 */
.opb-rail{display:grid;grid-template-columns:repeat(4,1fr);gap:0 12px;position:relative;margin:2px 0 12px;padding-top:15px}
.opb-rail:before{content:'';position:absolute;left:3px;right:3px;top:4px;height:1px;background:#cfd6e2;z-index:0}
.opb-st{z-index:1}
.opb-st{position:relative;font-size:10.5px;line-height:1.5;color:var(--sub)}

.opb-st p{margin:0}
.opb-st .t{font-size:10px;color:var(--faint)}
.opb-st .n{font-size:11.5px;font-weight:600;color:var(--text)}
.opb-st.on i{background:var(--red)}
.opb-st.on .n{color:var(--red)}
.opb-st .mk{display:inline-block;margin-top:2px;font-size:9.5px;color:#b91c1c;background:#fef2f2;border-radius:2px;padding:0 4px}
.opb-cg{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1;align-content:space-evenly}
.opb-cb{border:1px solid var(--line);border-radius:5px;padding:7px 9px 8px;background:#fff}
.opb-cb h5{margin:0 0 3px;font-size:11.5px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:5px}

.opb-cb h5 span{margin-left:auto;font-size:11px;font-weight:500;color:var(--faint);font-variant-numeric:tabular-nums}
.opb-cb p{margin:0;font-size:10.5px;line-height:1.55;color:var(--sub)}
.opb-cb p b{color:var(--text);font-weight:600;margin-right:4px}
.opb-pit{margin-top:7px;font-size:10.5px;color:var(--faint);line-height:1.55}
.opb-pit b{color:var(--sub);font-weight:600;margin-right:5px}
/* ③ HTML 议题树（2026-10-19 业主：按比例铺满）—— 宽度=份额、子块高度=子份额，不再有 SVG 留白 */
.opb-tmf{display:flex;gap:3px;flex:1;min-height:300px}
.opb-tmc{display:flex;flex-direction:column;min-width:0;border-radius:4px;padding:8px 9px 9px;color:#fff;overflow:hidden}
.opb-tmh{display:flex;align-items:baseline;flex-wrap:wrap;column-gap:6px;line-height:1.3}
