.chart-wrap{position:relative}
.chart{display:block;width:100%}
.chart-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:9px}
.chart-legend span{display:flex;align-items:center;gap:4px}
.chart-legend i{width:11px;height:11px;border-radius:var(--dsw-radius-xs);display:inline-block}
.chart-tip{position:absolute;top:6px;background:#111827;color:#fff;font-size:12px;border-radius:var(--dsw-radius-sm);padding:8px 8px;pointer-events:none;display:flex;flex-direction:column;gap:2px;z-index:5;min-width:150px;line-height:1.5}
.chart-tip b{font-size:12px}
.chart-tip .bad{color:#fca5a5}
/* v27：提示内容改成「标题行 + 每行色块」结构（对标 DeepSeek 控制台的 tooltip）——
   色块把数字对回图上哪根柱/哪条线，标题行给该点时间与总量；深色底保持设计稿自身语言。 */
.chart-tip .ct-hd{display:flex;align-items:center;gap:12px;justify-content:space-between;
  margin-bottom:5px;padding-bottom:4px;border-bottom:1px solid rgba(255,255,255,.16)}
.chart-tip .ct-hd b{font-variant-numeric:tabular-nums}
.chart-tip .ct-row{display:flex;align-items:center;gap:7px;line-height:1.75}
.chart-tip .ct-row i{width:9px;height:9px;border-radius:var(--dsw-radius-xs);flex:0 0 9px}
.chart-tip .ct-row span{color:rgba(255,255,255,.72)}
.chart-tip .ct-row b{margin-left:auto;font-variant-numeric:tabular-nums}
.chart-empty{padding:32px;text-align:center;color:var(--faint);font-size:13px}
.hbar-list{display:flex;flex-direction:column;gap:8px}
.hbar-row{display:grid;grid-template-columns:minmax(88px,150px) 1fr auto;gap:8px;align-items:center;font-size:13px}
.hbar-row[data-drill]{cursor:pointer}
.hbar-label{color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar-track{background:var(--bg-subtle-3);border-radius:var(--dsw-radius-pill);height:9px;overflow:hidden}
.hbar-track i{display:block;height:100%;border-radius:var(--dsw-radius-pill)}
.hbar-val{text-align:right;white-space:nowrap;color:var(--text);font-variant-numeric:tabular-nums}
.hbar-val em{font-style:normal;color:var(--faint);font-size:12px}
.flame{--label-w:190px;--chart-w:520px}
.fl-axis{display:flex;margin-left:var(--label-w);margin-bottom:5px;position:relative;height:14px;font-size:11px;color:var(--faint)}
.fl-axis span{position:absolute;transform:translateX(-50%)}
.fl-row{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line-soft)}
.fl-row:last-of-type{border-bottom:0}
.fl-name{flex:0 0 var(--label-w);display:flex;align-items:center;gap:6px;font-size:13px;min-width:0}
.fl-name em{font-size:11px;color:var(--faint);font-style:normal;background:var(--bg-subtle-3);border-radius:var(--dsw-radius-xs);padding:0 4px;flex:0 0 auto}
.fl-name b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fl-track{flex:1;position:relative;height:15px;background:var(--bg-subtle-1);border-radius:var(--dsw-radius-xs);min-width:60px}
.fl-bar{position:absolute;top:0;height:100%;border-radius:var(--dsw-radius-xs);min-width:2px;opacity:.9}
.fl-row:hover .fl-bar{opacity:1}
.fl-dur{flex:0 0 66px;text-align:right;font-size:12px;color:var(--sub);font-family:"SF Mono",Consolas,monospace}
.fl-fail{background:#fffafa}
.fl-fail .fl-name b{color:var(--red);font-weight:600}
.fl-total{margin-top:10px;font-size:13px;color:var(--sub);border-top:1px solid var(--line);padding-top:8px}
.fl-total b.ok{color:var(--green)}.fl-total b.bad{color:var(--red)}
.gauge{display:flex;align-items:center;gap:8px}
.gauge-track{flex:1;background:var(--bg-subtle-3);border-radius:var(--dsw-radius-pill);height:7px;overflow:hidden;min-width:60px}
.gauge-track i{display:block;height:100%;border-radius:var(--dsw-radius-pill)}
.gauge-val{font-size:12px;font-weight:600;flex:0 0 auto;font-variant-numeric:tabular-nums}

/* SECTION: misc-pages */
.dim-cmp{display:flex;flex-direction:column;gap:2px}
.dim-row{display:grid;grid-template-columns:110px 1fr auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:13px}
.dim-row:last-child{border-bottom:0}
.dim-name{color:var(--sub)}
.dim-vals{text-align:right;font-family:"SF Mono",Consolas,monospace;font-size:13px}
.dim-vals b{font-weight:600}
.dim-diff{flex:0 0 74px;text-align:right;font-weight:600;font-size:13px}
.err-card{border-color:#f3c9c9;background:#fffafa}
.err-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px;margin-bottom:9px}
.err-head .mono{color:var(--faint);font-size:12px}
.err-msg{font-size:13px;color:var(--red);line-height:1.65;background:#fff;border:1px solid #f3c9c9;border-radius:var(--dsw-radius-sm);padding:12px 12px}
.err-stack{margin-top:9px}
.err-stack summary{font-size:13px;color:var(--sub);cursor:pointer}
.err-stack pre{background:#fff;border:1px solid var(--line);border-radius:var(--dsw-radius-sm);padding:8px 12px;font-size:12px;overflow-x:auto;margin-top:7px;line-height:1.65;font-family:"SF Mono",Consolas,monospace;color:var(--sub)}
.err-acts{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.svc{border:1px solid var(--line);border-radius:var(--dsw-radius-md);padding:12px 16px;background:var(--bg-subtle-1)}
.svc.warn{border-color:#f0dcae;background:#fffdf7}
.svc.bad{border-color:#f3c9c9;background:#fffafa}
.svc-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.svc-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:0 0 7px}
.svc.warn .svc-dot{background:var(--amber)}
.svc.bad .svc-dot{background:var(--red);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.svc-h b{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis}
.svc-kv{display:flex;justify-content:space-between;font-size:12px;padding:4px 0}
.svc-kv span{color:var(--faint)}
.svc-kv b{font-family:"SF Mono",Consolas,monospace;font-weight:600}
.svc-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;border-top:1px solid var(--line-soft);padding-top:8px}
/* 2026-10-20 走查修复：这排小按钮原来 5 个挤在一行、被 flex 压到 26px 宽，
   「日志 / 限流 / 熔断」两个字放不下 → 竖排成「日/志」。按钮字一律不折行，宽度不够就整体换行。 */
.svc-acts .lnk{white-space:nowrap;flex:0 0 auto}
/* 访问复核表末列的两个决定按钮：并排、不折行 */
.rv-acts{display:inline-flex;gap:8px;align-items:center;white-space:nowrap}
/* 用户生命周期：5 个阶段等宽一行排开。原来用 flex:1，最后一行只剩一张卡时会被拉满整行。 */
.lc-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:1180px){.lc-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:780px){.lc-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lc-grid>button,.lc-grid>div{min-width:0}
/* SECTION: decision-room（v50 决策会议室）
   版式照业主给的编排图：顶部平台块 + 树形派活线 + 五列泳道 + 卡片编号徽章 + 底部汇聚。
   画布固定 1200px 不自动缩放 —— 十一张卡片挤进 1096 只有 6px 的字，宁可横向滚。 */
.dec-wrap{display:flex;flex-direction:column;gap:20px;padding-bottom:44px}
.dec-head{display:flex;align-items:flex-start;justify-content:space-between;gap:28px;flex-wrap:wrap}
.dec-kicker{font-size:11px;color:var(--faint)}
.dec-head-l h1{font-size:21px;font-weight:600;margin:6px 0 6px}
.dec-head-l p{font-size:13px;color:var(--sub);line-height:1.7;max-width:640px}
.dec-head-r{display:flex;flex-direction:column;align-items:flex-end;gap:8px;padding-top:4px}
.dec-state{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--green);
  background:#eef8f1;border:1px solid #cbe7d5;border-radius:999px;padding:4px 11px}
.dec-state i{width:6px;height:6px;border-radius:50%;background:var(--green)}
.dec-meta{font-size:12px;color:var(--faint);font-family:"SF Mono",Consolas,monospace}
.dec-stage{overflow-x:auto;overflow-y:hidden;padding:2px 8px 8px}
/* ── 朝堂制（v51）：左文右武六部，中间留堂 ────────────────────────────
   十八席 = 《六韬·王翼》十八职。堂上只放业主的输入条：拍板的是人，
   说的话和收敛的结论都在画布下面两段，不往画布里再塞一遍。 */
/* ── 画布（v52）：世界层 + 视口。方卡铺在里面，能缩放能拖，一键适应窗口 ──
   ⚠ 不写死高度给页面：画布自己撑住一屏，里面装不下就缩/拖，页面不跟着长。
   2026-10-25 业主「不行就拉高，而不是把卡片变小」：一列九席 104 的方卡要 1081 高，
   画布至少留到 1143（1121 的世界层 + 20 留白 + 2 边框），默认 1:1 不缩卡；屏幕更高就吃满一屏。 */
.hall-canvas{position:relative;height:max(1143px,calc(100vh - 296px));border-radius:14px;
  border:1px solid var(--line);overflow:hidden;cursor:grab;user-select:none;
  background:
    linear-gradient(#f2f5fa 1px,transparent 1px) 0 0/24px 24px,
    linear-gradient(90deg,#f2f5fa 1px,transparent 1px) 0 0/24px 24px,
    #fdfeff}
.hall-canvas.panning{cursor:grabbing}
.hall-world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.hall{position:relative}

/* 右上角工具条：缩放 −/值/+、适应、1:1 */
/* 工具条与提示压在堂中央的空白带上（上下各一条）：
   四个角在 100% 时全是席卡和部名，工具条放角上会盖住「作战执行」那一行部名。 */
.hall-bar{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:20;
  display:flex;align-items:center;gap:1px;
  background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px;
  box-shadow:0 2px 10px rgba(20,35,70,.08)}
.hall-bar button{border:0;background:transparent;color:var(--sub);font-size:11px;line-height:1;
  padding:5px 9px;border-radius:999px;cursor:pointer;font-family:inherit}
.hall-bar button:hover{background:var(--bg-subtle-3);color:var(--text)}
.hall-bar .hall-zoomv{min-width:44px;text-align:center;font-size:11px;color:var(--faint);
  font-variant-numeric:tabular-nums}
/* 提示挂在缩放条下面：说的就是缩放和拖动，别放画布底边 ——
   输入条滚到底会贴着画布底边停，正好压住它。 */
.hall-hint{position:absolute;left:50%;top:50px;transform:translateX(-50%);z-index:14;
  font-size:10.5px;color:var(--faint);
  background:rgba(255,255,255,.9);border:1px solid var(--line-soft);border-radius:6px;padding:3px 8px}

/* 一组：三张方卡竖排（2026-10-25 业主「左右竖向排列」+「方形卡片」）。
   部名那一行比方卡略宽，往堂里伸一点点 —— 方卡只到 88，名字要写全。 */
.hall-dept{position:absolute;z-index:2;display:flex;flex-direction:column;gap:7px}
.hall-dept-h{display:flex;align-items:center;gap:5px;height:18px;white-space:nowrap}
.hall-dept.right .hall-dept-h{justify-content:flex-end}
.hall-side{width:16px;height:16px;border-radius:4px;background:#e8eefb;color:#5b76c9;
  font-size:10px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 16px}
.hall-dept.right .hall-side{background:#f7ecec;color:#a8646a}
.hall-dept-h b{font-size:11.5px;font-weight:600;color:#3b56c4;letter-spacing:.02em}
.hall-dept-h i{font-size:10px;font-style:normal;color:#8aa0c8}
.hall-dept-body{display:flex;flex-direction:column;gap:7px}

/* 席卡：104×104 方卡，白底一圈淡绿（在场），右上角是这次说过的次数 */
.hall-agent{position:relative;width:104px;height:104px;border-radius:13px;background:#fff;
  border:1px solid #cfe0d5;box-shadow:0 0 0 3px rgba(63,160,110,.07);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 4px}
.hall-ico{width:20px;height:20px;border-radius:7px;background:#4a6cf7;color:#fff;
  display:inline-flex;align-items:center;justify-content:center;flex:0 0 20px;margin-bottom:1px}
.hall-agent b{font-size:13px;font-weight:600;color:#1f2a3d;line-height:1.25;white-space:nowrap}
.hall-agent u{font-size:10.5px;color:#7b8798;text-decoration:none;line-height:1.3;white-space:nowrap}
.hall-n{position:absolute;right:6px;top:5px;min-width:16px;height:16px;border-radius:999px;
  background:#4a6cf7;color:#fff;font-size:10px;font-style:normal;display:flex;
  align-items:center;justify-content:center;padding:0 4px}

/* 页头「不进工作台」的标记 */
.dec-own{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#8a6a2a;
  background:#fffcf3;border:1px solid #e3cb95;border-radius:999px;padding:3px 9px}

/* ── 业主席开口处（v53）：形制照业主给的截图（左下加号、右下发送），
      2026-10-25 业主「这个改为我们配色」—— 参考图那套浅灰底 + 深绿发送是本原型里没有的颜色，
      换成全站令牌：白卡 + --line 描边，发送用 --blue，聚焦环用蓝色淡环。 ── */
.cmp{position:relative;display:flex;flex-direction:column;gap:7px;border-radius:16px;
  background:var(--card);border:1px solid var(--line);padding:12px 13px 10px;
  box-shadow:0 1px 2px rgba(20,35,70,.04)}
.cmp:focus-within{border-color:#bcd0fb;box-shadow:0 0 0 3px rgba(37,99,235,.08)}
.cmp-ta{width:100%;border:0;background:transparent;resize:none;outline:none;overflow:hidden;
  font-family:inherit;font-size:15px;line-height:1.65;color:var(--text);
  min-height:26px;max-height:132px;padding:0}
.cmp-ta::placeholder{color:var(--faint)}
.cmp-bar{display:flex;align-items:center;justify-content:space-between}
.cmp-plus{width:34px;height:34px;border-radius:10px;background:#f1f3f7;border:1px solid var(--line);
  color:var(--sub);display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 1px 2px rgba(20,35,70,.05);padding:0}
.cmp-plus span{font-size:19px;line-height:1;font-weight:300;margin-top:-1px}
.cmp-plus:hover{background:#e9eef7;color:var(--text)}
.cmp-send{width:34px;height:34px;border-radius:10px;background:var(--blue);border:0;color:#fff;
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.cmp-send:hover{background:var(--blue-deep)}
.cmp-send:active{transform:translateY(1px)}
/* 堂内输入条（2026-10-25 业主先贴布局图、又贴狼人杀座位图「类似这种布局」）：
   十八席贴左右两边，业主的输入条就是那张桌子中间的麦 —— 钉在屏幕底部往上一点，
   下面不留空；但不许滑出画布：画布底边上来就贴住，跟着画布一起滚走。
   top 由 v50-decision.js 的 placeDock() 按滚动位置算，这里只留个兜底值。 */
.cmp-dock{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:15;
  width:min(440px,var(--dock-w,440px),calc(100% - 40px));cursor:auto;user-select:text;
  box-shadow:0 10px 28px rgba(20,35,70,.10)}
.dec-sec-h{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.dec-sec-h h2{font-size:15px;font-weight:600}
.dec-sec-h span{font-size:12px;color:var(--faint)}
.dec-talks{display:flex;flex-direction:column;gap:1px;border:1px solid var(--line-soft);
  border-radius:12px;overflow:hidden;background:var(--line-soft)}
.dec-talk{background:#fff;padding:14px 16px}
.dec-talk-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.dec-av{width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;
  justify-content:center;background:#eef2ff;color:#4a6cf7;flex:0 0 22px}
.dec-av.t-con{background:#fdf6e8;color:#c08a2e}
.dec-av.t-sum{background:#eef8f1;color:var(--green)}
.dec-talk-h b{font-size:13px;font-weight:600}
.dec-tag{font-size:10px;border-radius:4px;padding:1px 6px;border:1px solid}
.dec-tag.t-pro{color:#2f6fd0;border-color:#c5d9f5;background:#f2f7fe}
.dec-tag.t-con{color:#b07c22;border-color:#f0dfbc;background:#fffdf8}
.dec-tag.t-sum{color:#1f7a4d;border-color:#cbe7d5;background:#f2faf5}
.dec-line{font-size:11px;color:var(--faint)}
.dec-round{margin-left:auto;font-size:11px;color:var(--faint);font-family:"SF Mono",Consolas,monospace}
.dec-talk p{font-size:13px;line-height:1.72;color:var(--text);margin:9px 0 8px}
.dec-ev{font-size:11px;color:var(--faint);border-left:2px solid var(--line);padding-left:8px}
.dec-verdict{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:14px}
@media (max-width:1100px){.dec-verdict{grid-template-columns:1fr}}
.dec-vd{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:#fff}
.dec-vd.main{border-color:#b9c7f5;background:#f7f9ff}
.dec-vd h3{font-size:13px;font-weight:600;margin-bottom:10px;color:var(--sub)}
.dec-vd.main h3{color:#3b56c4}

.svc-ico.t-pink{background:#fdeef6;color:#db2777}
.svc-ico.t-teal{background:#e6f7f3;color:#0d9488}

.svc-pick .svc-ico.sm{margin-right:6px;vertical-align:0}
.svc-tier{font-style:normal;font-size:11px;color:var(--faint);background:var(--bg-subtle-3);border-radius:var(--dsw-radius-pill);padding:1px 8px;margin-left:6px}

/* ── v29：网关页三个 Tab 的补充样式 ──────────────────────────────────
   ① .svc.idle：本期无调用的模型路由（embed-v3）不该亮着绿灯 ——

   ② .gw-key-row：密钥行。**不能复用 .ab-item** —— 那是给告警清单的
      `1fr auto` 网格，里面塞一个 <button> 会被自动排到第二行第 1 列、拉满整行宽
      （实测按钮 900~1060px，整卡被撑到 271px 高）。密钥行要的是
      「名字 · 关联服务 · 到期 · 动作」横向一段。 */
.svc.idle{background:var(--bg-subtle-1)}
.svc.idle .svc-dot{background:var(--decor)}
.gw-key-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid #f3c9c9;border-radius:var(--dsw-radius-md);background:#fffafa}
.gw-key-row+.gw-key-row{margin-top:8px}
.gw-key-row>b{font-size:13px;flex:0 0 auto}
.gw-key-row .gw-key-svc{font-size:12px;color:var(--sub);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.sk-card{cursor:pointer;padding:12px 14px}

   来源是中文短语，别继承 .svc-kv b 的等宽体；事故条用红底只出现在压着未恢复事故的服务上；
   「重连 / 操作指引 / 复制日志」是修的动作，与下面那排日常动作分开（诊断行不带分隔线）。 */
.svc-kv b.svc-src{font-family:inherit;font-weight:400;font-size:12px;color:var(--sub);max-width:62%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.sug-list{display:flex;flex-direction:column;gap:8px}
.sug{border:1px solid var(--line);border-left-width:3px;border-radius:var(--dsw-radius-md);padding:12px 16px;background:var(--bg-subtle-1)}

/* 当前键盘选中项：J/K 移动时必须有明确视觉锚点，否则「快捷键没生效」和「生效了」看起来一样 */
/* 当前键盘选中项：J/K 移动时必须有明确视觉锚点。
   v10b（走查 1.7★）：旧写法 border-color:#9dbcf5 是 shorthand，会把 .review-item.bad 的
   左边框级别红一并覆盖 —— 当前聚焦的 P0 卡左边红框变蓝，审核场景里最关键的信息
   恰好在选中时消失。改用 box-shadow 内描边做选中锚点，border 一概不动：级别色永远在场。 */

@keyframes rvBlink{0%,50%{opacity:1}51%,100%{opacity:.25}}

/* v27：原用 margin-right:22px 做阶段间的箭头间距 —— margin 会被算进 scrollWidth，
   实测 user-ops / evo 两页在 297px 的列里溢出 15px（div.stage 304 < 319）。
   箭头本就是 .stage::after 的绝对定位，不需要占位，所以直接去掉 margin。 */
.stages{display:flex;gap:0;flex-wrap:wrap;margin-bottom:4px}
.stage::after{content:"";position:absolute;right:-15px;top:50%;transform:translateY(-50%);width:13px;height:13px;background:var(--decor);-webkit-mask:var(--m-arr) center/contain no-repeat;mask:var(--m-arr) center/contain no-repeat}
.stage:last-child::after{content:none}
.stage.done{border-color:#bfe8cd;background:#f7fdf9}

.stage.wait{opacity:.72}
.st-h{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.st-h b{font-size:13px}

.stage.active .st-h b::before{content:"";display:inline-block;width:12px;height:12px;margin-right:4px;vertical-align:-1px;background:var(--blue);-webkit-mask:var(--m-dot) center/contain no-repeat;mask:var(--m-dot) center/contain no-repeat}
.stage.wait .st-h b::before{content:"";display:inline-block;width:12px;height:12px;margin-right:4px;vertical-align:-1px;background:var(--faint);-webkit-mask:var(--m-ring) center/contain no-repeat;mask:var(--m-ring) center/contain no-repeat}
.st-n{margin-left:auto;font-size:13px;font-weight:700;color:var(--blue)}
.st-d{font-size:12px;color:var(--sub);line-height:1.55}

/* v20：终止/暂停后的视觉回收 —— 此前 uo-stopped 类加了但没有样式，卡片除 pill 外毫无变化（C-02 修复的尾巴） */

/* v10b（阿里云 XConsole slide-panel）：详情查看类弹窗改为右侧滑出面板 —— 不离开列表、保留上下文。`n   openModal() 默认挂 slide；危险确认（v10 sheet）保持居中 —— 它要的是打断。 */`n.modal-mask.slide{padding:0;align-items:stretch;justify-content:flex-end}`n.modal-mask.slide .modal{width:min(680px,94vw);max-width:680px;height:100%;max-height:100%;border-radius:0;overflow-y:auto;animation:panelIn .18s ease-out}`n.modal-mask.slide .modal.wide{width:min(820px,94vw);max-width:820px}`n@keyframes panelIn{from{transform:translateX(28px);opacity:.4}to{transform:none;opacity:1}}`n@media (prefers-reduced-motion:reduce){.modal-mask.slide .modal{animation:none}}
.modal{background:#fff;border-radius:var(--dsw-radius-md);max-width:680px;width:100%;max-height:86vh;overflow:hidden auto;box-shadow:0 24px 64px rgba(15,23,42,.28)}

/* SECTION: agent-net
   v24「网状关系」：左侧灰色隔离区 + 右侧关系画布。
   画布用「HTML 节点做绝对定位（百分比）+ SVG 连线（preserveAspectRatio=none、
   同一套 1000×H 归一化坐标）」的组合 —— 两边坐标同源，所以容器多宽，线都落在节点中心。 */
.anet-shell{display:flex;gap:16px;align-items:flex-start}
.anet-iso{flex:0 0 210px;background:var(--dsw-alias-bg-module);border:1px dashed var(--dsw-alias-border-l3);border-radius:var(--dsw-radius-md);padding:12px 12px;min-height:180px}
.anet-iso.anet-iso-ok{background:#f6fbf8;border-color:#cfe9d9}
.anet-iso-h{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.anet-iso-h b{font-size:14px}
.anet-iso-sub{font-size:12px;color:var(--faint);line-height:1.6;margin-bottom:10px}
.anet-iso-list{display:flex;flex-direction:column;gap:2px}
.anet-iso-item{display:flex;align-items:center;width:100%;padding:4px 8px;border-radius:var(--dsw-radius-sm);border:1px solid transparent;text-align:left;font-size:13px;color:var(--sub)}
.anet-iso-item:hover{background:var(--card);border-color:var(--line);color:var(--text)}
.anet-iso-item:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.anet-iso-item .av{filter:grayscale(1);opacity:.7;margin-right:5px;vertical-align:0}
.anet-iso-item:hover .av{filter:none;opacity:1}
.anet-iso-item .av-wrap>span:last-child{max-width:104px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.anet-iso-item em{font-style:normal;margin-left:auto;padding-left:8px;font-size:11px;color:var(--faint);flex:0 0 auto}
/* v26c（B 批）：隔离区同时是**拖拽落点** —— 拖动中悬停要高亮，平时要有一行说明，
   否则"能把节点拖进来"这件事没人会发现。 */
.anet-iso-hover{border-color:var(--blue);border-style:solid;background:#f2f7ff;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.anet-iso-drop{margin:10px 0 2px;padding:8px 8px;border:1px dashed var(--dsw-alias-border-l3);border-radius:var(--dsw-radius-sm);
  font-size:12px;line-height:1.6;color:var(--sub);background:#fff}
.anet-iso-hover .anet-iso-drop{border-color:var(--blue);color:var(--blue-deep);background:var(--blue-weak)}
.anet-iso-drop-sub{display:block;color:var(--faint);font-size:11px}
.anet-iso-row{display:flex;align-items:center;gap:2px}
.anet-iso-row .anet-iso-item{flex:1;min-width:0}
.anet-iso-row .lnk{flex:0 0 auto;padding:0 4px;font-size:12px}
.anet-flash{box-shadow:0 0 0 3px rgba(37,99,235,.35)}
.anet-canvas{position:relative;flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:var(--dsw-radius-md);overflow:hidden}
/* v26c：画布内容层。平移/缩放只作用在这一层（CSS transform），
   里面的坐标仍是"未变换的画布坐标" —— 收边、芯片避让、箭头、拖动换算都不用改。 */
.anet-world{position:absolute;inset:0;will-change:transform}
.anet-canvas.panning{cursor:grabbing}
.anet-canvas.panning .anet-tile{cursor:grabbing}
/* 操作条：撤销/重做/历史/缩放 + 一句操作提示 */
.anet-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.anet-tools .anet-zoomv{min-width:56px;font-variant-numeric:tabular-nums}
.anet-tools-sep{width:1px;height:20px;background:var(--line);margin:0 2px}
.anet-tools-hint{font-size:12px;margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 历史面板：一行一步，当前步高亮 */
.anet-hist{display:flex;flex-direction:column;gap:2px;max-height:340px;overflow:auto;margin:10px 0 4px}
.anet-hist-row{display:flex;align-items:center;gap:8px;padding:8px 8px;border-radius:var(--dsw-radius-sm);font-size:13px}
.anet-hist-row.on{background:var(--blue-weak)}
.anet-hist-row:hover{background:#f7f9fd}
.anet-hist-i{width:22px;color:var(--faint);font-variant-numeric:tabular-nums;flex:0 0 22px}
.anet-hist-t{color:var(--faint);font-variant-numeric:tabular-nums;flex:0 0 60px}
.anet-hist-l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.anet-hist-tag{font-style:normal;font-size:11px;padding:1px 8px;border-radius:var(--dsw-radius-pill);background:var(--bg-subtle-3);color:var(--sub);margin-left:4px}
.anet-hist-tag.now{background:var(--blue);color:var(--card)}
.anet-canvas-empty{display:flex;align-items:center;justify-content:center;min-height:200px}
.anet-edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.anet-edge{fill:none;stroke-width:1.8;stroke-linecap:round}
.anet-edge.t-exp{stroke:var(--blue);stroke-width:1;opacity:.5;stroke-dasharray:3 3}
/* A2A 是最强的一类（业务上真有委派往来），实线 + 箭头；其余四类用不同虚实区分 */
.anet-edge.t-a2a{stroke:var(--purple);stroke-width:2.4}
.anet-arrow{stroke:none}
.anet-arrow.t-a2a{fill:var(--purple)}
.anet-edge.t-conflict{stroke:var(--red);stroke-width:1.2;opacity:.6;stroke-dasharray:6 4}
.anet-edge.t-owner{stroke:#16a34a;stroke-width:1;opacity:.45;stroke-dasharray:2 4}
/* MCP 共用是最弱的一类（共用下游依赖 ≠ 业务上真有往来），线画细一点、淡一点，
   免得全开时 27 条 MCP 线把经验层的强关系淹掉 */
.anet-edge.t-mcp{stroke:#d97706;stroke-width:1;opacity:.45;stroke-dasharray:8 5}
.anet-node{position:absolute;transform:translate(-50%,-50%);width:150px;background:var(--card);border:1px solid var(--line);border-radius:var(--dsw-radius-md);padding:8px 8px;text-align:left;box-shadow:0 2px 6px rgba(15,23,42,.07);z-index:2;transition:border-color .12s,box-shadow .12s}
.anet-node:hover{border-color:var(--blue)}
.anet-node:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.anet-node.off{opacity:.55}
.anet-node-nm{display:block;max-width:100%}
.anet-node-nm .av{width:18px;height:18px;font-size:11px;flex:0 0 18px;margin-right:5px;vertical-align:0}
/* 名字自己截断（带省略号）—— 靠父层 overflow:hidden 截会把「Agent」的 t 切掉、看不到省略号 */
.anet-node-nm .av-wrap{max-width:100%;overflow:hidden}
.anet-node-nm .av-wrap>span:last-child{font-size:13px;font-weight:600;max-width:118px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.anet-node-sub{display:block;margin-top:3px;font-size:11px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 网状节点（v25b）：**Tile 档** —— 图标块 + 名称 + 健康边框，指标进悬停。
   依据 ChartForgeX TopologyNodeDisplayMode 的 Tile，与 SkyWalking Horizon UI
   「边框表健康、图标表身份、数字精简」的拓扑做法。 */
.anet-tile{position:absolute;transform:translate(-50%,-50%);width:118px;padding:8px 8px 8px;
  background:#fff;border:2px solid var(--line);border-radius:var(--dsw-radius-md);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;transition:border-color .15s}
.anet-tile:hover{border-color:var(--blue);background:#fbfdff}
.anet-tile:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
/* 边框 = 健康带（绿/红/灰），与列表页的异常判定同一口径 */
.anet-tile.ok{border-color:#a7e0bd}
.anet-tile.bad{border-color:#f0a9a9;background:#fff7f7}
.anet-tile.gray{border-color:#bcd0f0}
.anet-tile.off{border-color:var(--line);opacity:.55}
.anet-tile-ico{display:flex;align-items:center;justify-content:center;width:34px;height:34px;
  border-radius:var(--dsw-radius-md);background:var(--blue-weak);color:var(--blue)}
.anet-tile.bad .anet-tile-ico{background:#fdeaea;color:#c0392b}
.anet-tile.gray .anet-tile-ico{background:var(--blue-weak);color:var(--blue)}
.anet-tile.off .anet-tile-ico{background:#f1f2f4;color:var(--faint)}
.anet-tile-nm{font-size:12px;font-weight:600;color:var(--text);max-width:106px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.anet-tile-m{font-size:11px;color:var(--faint);white-space:nowrap;letter-spacing:-.2px}
.anet-chip.moved text{fill:var(--blue)}
.anet-chip.stuck rect{stroke:#f0a9a9}
.anet-tile-deg{position:absolute;top:-7px;right:-7px;min-width:18px;height:18px;padding:0 4px;
  border-radius:var(--dsw-radius-md);background:var(--blue);color:#fff;font-size:11px;font-weight:600;
  display:flex;align-items:center;justify-content:center}
/* 逐跳展开（v25d）：聚焦节点加粗、非一跳邻居降透明；边上画吞吐量芯片 */
.anet-tile.focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.18);z-index:3}
.anet-tile.dim{opacity:.28;filter:saturate(.5)}
.anet-tile-go{position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);white-space:nowrap;
  background:var(--blue);color:#fff;font-size:11px;font-weight:600;padding:2px 8px;border-radius:var(--dsw-radius-md);
  box-shadow:0 2px 6px rgba(37,99,235,.3)}
.anet-edge.far{opacity:.12}
.anet-chip rect{fill:var(--card);stroke:var(--line);stroke-width:1}
.anet-chip text{fill:var(--faint);font-size:11px;text-anchor:middle;font-variant-numeric:tabular-nums}
.anet-chip.far{opacity:.12}
.anet-focus-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;margin-bottom:8px;
  background:var(--blue-weak);border:1px solid #c7dbff;border-radius:var(--dsw-radius-md);font-size:13px}
.anet-focus-bar b{font-weight:600}
/* 拖动 / 右键（v25f）：对标 eNSP 的基本操作 */
.anet-tile{cursor:grab}
.anet-tile{touch-action:none}
.anet-tile.dragging{cursor:grabbing;box-shadow:0 12px 30px rgba(15,23,42,.28);z-index:9;opacity:.96}
.anet-menu{position:fixed;z-index:9999;min-width:200px;padding:4px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--dsw-radius-md);box-shadow:0 12px 32px rgba(15,23,42,.18);
  display:flex;flex-direction:column}
.anet-menu button{text-align:left;padding:8px 12px;border:0;background:none;border-radius:var(--dsw-radius-sm);
  font-size:13px;color:var(--text);cursor:pointer;font-family:inherit}
.anet-menu button:hover{background:var(--blue-weak);color:var(--blue)}
.anet-flash{animation:anetFlash 1.4s ease-out}
@keyframes anetFlash{0%,100%{background:transparent}25%,60%{background:#fff3cd}}
.anet-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 9px}
.anet-dot.t-a2a{background:var(--purple)}
.anet-dot.t-exp{background:var(--blue)}
.anet-dot.t-conflict{background:var(--red)}
.anet-dot.t-owner{background:#16a34a}
.anet-dot.t-mcp{background:#d97706}
.anet-legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--sub);margin-top:12px}

.anet-legend span{display:flex;align-items:center;gap:6px}
.anet-legend i{width:18px;height:0;border-top:2px solid var(--faint);display:inline-block}
.anet-legend i.t-a2a{border-top-color:var(--purple);border-top-width:3px}
.anet-legend i.t-exp{border-top-color:var(--blue)}
.anet-legend i.t-conflict{border-top-color:var(--red);border-top-style:dashed}
.anet-legend i.t-owner{border-top-color:#16a34a;border-top-style:dotted}
.anet-legend i.t-mcp{border-top-color:#d97706;border-top-style:dashed}
.anet-tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:var(--dsw-radius-pill);white-space:nowrap;background:var(--bg-subtle-3);color:var(--sub)}
.anet-tag.t-a2a{background:#f3efff;color:var(--purple)}
.anet-tag.t-exp{background:var(--blue-weak);color:var(--blue)}
.anet-tag.t-conflict{background:var(--red-bg);color:var(--red)}
.anet-tag.t-owner{background:var(--green-bg);color:var(--green)}
.anet-tag.t-mcp{background:var(--amber-bg);color:var(--amber)}
/* v26c（C 批）：人工新增的关系在样式上必须与推导出来的边区分开 —— 这一页的纪律是"关系不编" */
.anet-tag-manual{background:#f4f4f5;color:#52525b;border:1px dashed #c4c4cc;margin-left:4px}
.anet-edge.t-a2a.manual{stroke-dasharray:7 4;opacity:.85}

/* SECTION: org-view（组织架构 × 流程）
   列 = 业务线、行 = 调用深度；背景层走 SVG，卡片走 HTML .anet-tile。
   世界层是自然尺寸（内联 width/height），由 .anet-world 的 transform 整体缩放。 */
.anet-lane{fill:var(--dsw-alias-bg-module);stroke:var(--dsw-alias-border-l2);stroke-width:1}
.anet-root{fill:var(--blue);stroke:var(--blue-deep);stroke-width:1}
.anet-bus{stroke:var(--dsw-alias-label-caption);stroke-width:1}
.anet-biz{fill:var(--blue-weak);stroke:var(--dsw-alias-border-l3);stroke-width:1}
.anet-rowstrip{fill:var(--dsw-alias-bg-module);stroke:var(--dsw-alias-border-l2);stroke-width:1}
.anet-rowsep{stroke:var(--dsw-alias-border-l2);stroke-width:1}
.anet-root-t{fill:var(--card);font-size:14px;font-weight:600;dominant-baseline:middle}
.anet-root-s{fill:var(--dsw-static-deepseek-50);font-size:11px;dominant-baseline:middle}
.anet-cap{fill:var(--dsw-alias-state-business-ink);font-size:12px;font-weight:600;dominant-baseline:middle}
.anet-cap2{fill:var(--dsw-alias-label-tertiary);font-size:11px;dominant-baseline:middle}
.anet-rowlab{fill:var(--dsw-alias-label-primary);font-size:11px;font-weight:600;dominant-baseline:middle}
.anet-rowlab2{fill:var(--dsw-alias-label-tertiary);font-size:11px;dominant-baseline:middle}
.anet-flow{fill:none;stroke:var(--purple);stroke-width:1.6}
.anet-flow.manual{stroke-dasharray:6 4}
.anet-flow.far{opacity:.15}
/* ⚠ 旧样式 .anet-edges{pointer-events:none} 让**整层边都不可命中**：
   <title> 悬停出不来、右键菜单里「删除这条边」永远走不到（那分支恒为 null）。
   这里在命中线上显式打开 pointer-events，父层的 none 可以被覆盖。 */
.anet-edges{pointer-events:none}
.anet-flowhit{fill:none;stroke:transparent;stroke-width:10;pointer-events:stroke}
.anet-flowhit:hover{stroke:rgba(124,58,237,.14) /* --purple 14%：连线悬停 */}
.anet-flowarrow{fill:var(--purple);stroke:none}
.anet-flowlab{fill:var(--card);stroke:none}
.anet-flowlabt{fill:var(--purple);font-size:11px;dominant-baseline:middle}
.anet-arc{fill:none;stroke:var(--red);stroke-width:3.2;stroke-linecap:round}
.anet-canvas[data-label-mode="hover"] .anet-flowlab-g{opacity:0}
.anet-canvas[data-label-mode="hover"] .anet-flowlab-g.on{opacity:1}
.anet-labels{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--dsw-alias-label-secondary);margin-left:8px}
.anet-labels .btn-ghost.on{background:var(--blue);border-color:var(--blue);color:var(--card)}
.anet-rename{position:absolute;z-index:10;height:24px;padding:0 6px;font:inherit;font-size:12px;border:1px solid var(--blue);border-radius:var(--dsw-radius-sm);background:var(--card);color:var(--dsw-alias-label-primary);box-shadow:0 6px 18px rgba(15,23,42,.16);outline:none}
.anet-iso-grip{position:absolute;top:0;right:-3px;width:8px;height:100%;cursor:col-resize;border-radius:0 var(--dsw-radius-md) var(--dsw-radius-md) 0}
.anet-iso-grip:hover{background:rgba(37,99,235,.12)}
.anet-iso-guide{position:absolute;top:0;width:0;height:100%;border-left:2px dashed var(--blue);pointer-events:none;z-index:8}
.anet-help{position:relative;margin:-8px 0 12px;padding:12px 14px;border:1px solid var(--dsw-alias-border-l2);border-radius:var(--dsw-radius-md);background:var(--dsw-alias-bg-module);font-size:12.5px;line-height:1.9;color:var(--dsw-alias-label-secondary)}
.anet-help .ah-t{display:block;margin-bottom:4px;color:var(--dsw-alias-label-primary)}
.anet-help .ah-row{display:flex;gap:10px}
.anet-help .ah-k{flex:0 0 88px;color:var(--dsw-alias-label-tertiary)}
.anet-help .ah-v{flex:1}
.anet-help-btn{margin-left:6px;padding:2px 9px}

.anet-empty-note{position:absolute;width:640px}
.anet-iso-inworld{position:absolute;flex:none;width:auto;min-height:0;box-sizing:border-box;background:var(--dsw-alias-bg-module);border:1px dashed var(--dsw-alias-border-l3);border-radius:var(--dsw-radius-md);padding:12px;overflow:hidden}
.anet-iso-inworld .anet-iso-h{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.anet-iso-inworld .anet-iso-h b{font-size:14px}
.anet-iso-inworld .anet-iso-sub{font-size:12px;color:var(--dsw-alias-label-tertiary);line-height:1.6;margin-bottom:8px}
.anet-drophl{fill:rgba(37,99,235,.10);stroke:var(--blue);stroke-width:1.5;stroke-dasharray:6 4}
.anet-dragtip{position:absolute;left:50%;top:8px;transform:translateX(-50%);display:none;z-index:9;
  background:#111827;color:#fff;font-size:12px;padding:4px 12px;border-radius:var(--dsw-radius-sm);pointer-events:none}
.anet-tile-note{position:absolute;transform:translate(0,-50%);font-size:11px;color:var(--dsw-alias-label-tertiary);white-space:nowrap;pointer-events:none}

/* SECTION: toast */
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(10px);background:#111827;color:#fff;font-size:13px;padding:8px 16px;border-radius:var(--dsw-radius-md);opacity:0;pointer-events:none;transition:.24s;z-index:90;max-width:82vw;line-height:1.5;display:flex;align-items:center;gap:8px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.warn{background:#92600a}.toast.bad{background:#991b1b}.toast.ok{background:#166534}
/* v10b（走查 3.5）：带撤销按钮的 Toast 可交互（悬停暂停消失见 app.js bindToast） */
.toast.has-undo{pointer-events:auto}
.toast-undo{border:1px solid rgba(255,255,255,.45);color:#fff;background:none;border-radius:var(--dsw-radius-sm);padding:4px 8px;font-size:12px;cursor:pointer;white-space:nowrap;flex:0 0 auto}
.toast-undo:hover{background:rgba(255,255,255,.16)}

/* SECTION: responsive */
@media (max-width:1100px){
  .gray-wrap{grid-template-columns:1fr}
  .dbg-grid{grid-template-columns:1fr}
  .review-item{grid-template-columns:1fr}
  .span2{grid-column:span 1}
}
/* v24：窄到 1200 以下，隔离区从左侧挪到画布上方 —— 不是审美问题，是几何问题：
   左侧 210px 的隔离区会把画布压到 500～600px，而节点卡片是固定 150px，
   在 1000 单位的虚拟坐标里相当于 250+ 单位，比排布步长（200）还大 ⇒ 节点必然叠。
   同时把节点收小一档，配合更宽的画布。
   ⚠ .anet-canvas 必须把 flex 交回去：它是 flex:1（flex-basis:0），横排时等于「占满剩余宽度」，
   竖排后主轴变成纵向，flex-basis:0 会把画布**压成 0 高**，节点全叠在一点上
   （实测 5 个节点两两完全重叠、画布一个像素都没有）。改回 flex:0 0 auto 才会认 inline 高度。 */
@media (max-width:1200px){
  .anet-shell{flex-direction:column}
  .anet-iso{flex:0 0 auto;width:100%;min-height:0}
  .anet-iso-list{flex-direction:row;flex-wrap:wrap}
  .anet-iso-item{width:auto}
  .anet-canvas{flex:0 0 auto;width:100%}
  .anet-node{width:110px;padding:8px 8px}
  .anet-node-nm .av-wrap>span:last-child{max-width:80px;font-size:12px}
  .anet-node-sub{font-size:11px}
}
@media (max-width:900px){
  .body{flex-direction:column;overflow-y:auto}
  .rail{flex-direction:row;flex:0 0 auto;width:100%;border-right:0;border-bottom:1px solid var(--line);padding:8px 12px;justify-content:flex-start;overflow-x:auto}
  .rail-item{width:auto;flex-direction:row;padding:8px 12px;gap:6px;flex:0 0 auto}
  .rail-sep{width:1px;height:22px;margin:0 5px}
  /* v40：横向导航时设置入口靠右，不占业务域那一串的位置 */
  .rail-foot{margin-top:0;margin-left:auto;padding-top:0;flex-direction:row;width:auto;gap:5px}
  .submenu{flex:0 0 auto;width:100%;border-right:0;border-bottom:1px solid var(--line);display:flex;gap:7px;overflow-x:auto;padding:8px 12px}
  .sm-head{display:none}
  body.pf-sub-collapsed .submenu{flex:0 0 auto;width:100%;padding:8px 12px;align-items:stretch}
  .sm-title,.sm-sep{display:none}
  .sm-item{width:auto;flex:0 0 auto;white-space:nowrap;border:1px solid var(--line);margin-bottom:0}
  .sm-item.active{border-color:var(--blue)}
  .main-col{flex:1 1 auto}
  .content{padding:16px 16px 32px}
  .search-wrap{width:auto;flex:1;margin-left:4px}
  .search-kbd,.brand-sub,.top-clock{display:none}
  .stage{min-width:100%;margin-right:0;margin-bottom:20px}
  .stage::after{width:13px;height:13px;background:var(--decor);-webkit-mask:var(--m-down) center/contain no-repeat;mask:var(--m-down) center/contain no-repeat;right:auto;left:50%;top:auto;bottom:-17px;transform:translateX(-50%)}
}
@media (max-width:620px){
  .page-head{flex-direction:column}
  .ph-side{margin-left:0;width:100%}
  .top-env{display:none}
  .metrics{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .m-value{font-size:20px}
  .meta-row{grid-template-columns:1fr}
  .dim-row{grid-template-columns:1fr;gap:4px}
  .dim-vals,.dim-diff{text-align:left}
  .fl-name{flex-basis:120px}
  .agent-grid{grid-template-columns:1fr}
}
/* v15：本会话新建区块 + 创建表单 */
.v15-newblock{border-color:#bfdbfe;background:var(--blue-weak)}
.v15-newrow{display:flex;align-items:center;gap:8px;padding:8px 2px;border-top:1px solid var(--line-soft);font-size:13px;flex-wrap:wrap}
.v15-newrow:first-of-type{border-top:0}
.v15-newdot{width:7px;height:7px;border-radius:var(--dsw-radius-pill);background:#2563eb;flex:0 0 auto}
.v15-newmeta{color:var(--sub)}
.v15-newacts{margin-left:auto;display:flex;gap:8px}
.v15-cf-row{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px 12px;align-items:start;margin-bottom:10px;font-size:13px}
.v15-cf-row>label{padding-top:8px;color:#475569}
.v15-cf-row .cf-hint{font-size:12px;color:var(--faint);margin-top:4px}
.v15-cf-row.cf-err input,.v15-cf-row.cf-err select{border-color:#dc2626;background:#fef2f2}
.v15-cf-errmsg{font-size:12px;color:#dc2626;margin-top:4px;display:none}
.v15-cf-row.cf-err .v15-cf-errmsg{display:block}
/* 只读展示位：给"由规则算出来"的字段用（如画像覆盖企业数），不给输入框 */
.v15-ro{padding:8px 8px;border:1px dashed #d7dce5;border-radius:var(--dsw-radius-sm);background:#f7f8fb;color:var(--sub);font-size:13px}
/* 圈选条件组：字段/操作符/值 + AND-OR + 增删 */
.v15-cond-row{display:grid;grid-template-columns:1fr 64px 1fr 26px;gap:6px;align-items:center;margin-bottom:6px}
.v15-cond-row select,.v15-cond-row input{width:100%;padding:8px 8px;border:1px solid #d7dce5;border-radius:var(--dsw-radius-sm);font:inherit;font-size:13px;background:#fff}
.v15-cond-del{border:1px solid var(--line);border-radius:var(--dsw-radius-sm);width:26px;height:26px;line-height:1;color:var(--sub);background:#fff;cursor:pointer}
.v15-cond-del:hover{border-color:var(--red);color:var(--red)}
.v15-cond-foot{display:flex;gap:8px;align-items:center;margin-top:2px}
.v15-cond-foot select{width:auto;padding:4px 8px;border:1px solid #d7dce5;border-radius:var(--dsw-radius-sm);font:inherit;font-size:12px;background:#fff}
.v15-cf-sec{font-size:12px;font-weight:500;color:#475569;margin:16px 0 8px;padding-top:12px;border-top:1px solid #f0f2f7}
.v15-cf-sec:first-of-type{border-top:0;padding-top:0;margin-top:0}
.v15-pick{display:flex;gap:6px;flex-wrap:wrap}
.v15-pick button{border:1px solid #d7dce5;background:#fff;border-radius:var(--dsw-radius-pill);padding:4px 12px;font-size:12px;color:#475569;cursor:pointer;font:inherit}
.v15-pick button.on{border-color:#2563eb;background:var(--blue-weak);color:#1d4ed8}
.v15-impact{background:#f8fafc;border-radius:var(--dsw-radius-md);padding:8px 12px;font-size:13px;color:#475569;line-height:1.75}
.v15-impact b{color:#1f2733}
.btn-off{opacity:.5;cursor:not-allowed}
/* ===== AI 访谈作业台（v10-interview.js）===== */
.iv-bar{display:flex;height:10px;border-radius:var(--dsw-radius-pill);overflow:hidden;background:#eef1f6;width:100%;min-width:120px}
.iv-bar .iv-seg{display:block;height:100%}
.iv-seg.iv-pending{background:var(--decor)}
.iv-seg.iv-dialing{background:#60a5fa}
.iv-seg.iv-interrupted{background:#f59e0b}
.iv-seg.iv-unreachable{background:#ef4444}
.iv-seg.iv-done{background:#16a34a}
.iv-input{font:inherit;color:#1f2733;background:#fff}
.iv-input:focus{outline:none;border-color:#2563eb}
.iv-bar.sm{height:7px;min-width:110px}
/* 首页：问卷内容表单 + 用户池 + 问卷列表 + 历史/名单/监控（全宽流式，见 .iv-side）
   2026-10-24：删除「左内容 + 右 300px 侧栏」两列布局（原 .iv-main）—— 问卷看板挂在左列，
   侧栏三张卡结束后右栏整列空白，看板右半屏看着像没铺满。现改全宽流式：
   侧栏三卡横排一行（.iv-side），看板独占整行。
   ⚠ 宽屏 4 列的覆盖规则在本文件靠后的看板样式段末尾（.iv-tile-h .pill 之后）——
   写在前面会被 .iv-board 的基础 2 列规则层叠覆盖，等于没写。 */
.iv-form{display:flex;flex-direction:column;gap:8px}
.iv-field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--sub)}
.iv-field .iv-input{border:1px solid var(--line);border-radius:var(--dsw-radius-sm);padding:8px 8px;width:100%}
.iv-field textarea.iv-input{line-height:1.7;resize:vertical;font-family:inherit}
.iv-field.sm{flex:0 0 auto}
.iv-field.sm .iv-input{padding:8px 8px;min-width:150px}
.iv-row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.iv-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.iv-pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;max-height:320px;overflow:auto;padding:2px}
.iv-person{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 8px 8px;border:1px solid var(--line);border-radius:var(--dsw-radius-md);background:#fff;cursor:pointer;font:inherit}
.iv-person.on{border-color:#2563eb;background:var(--blue-weak)}
.iv-person.off{opacity:.55;cursor:not-allowed;background:#f8fafc}
.iv-person b{font-size:12px;color:#1f2733;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iv-person i{font-size:11px;color:var(--faint);font-style:normal}
.iv-ava{width:34px;height:34px;border-radius:50%;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.iv-ava.sm{width:24px;height:24px;font-size:12px;display:inline-flex;vertical-align:middle;margin-right:6px;flex:0 0 auto}
.iv-check{position:absolute;top:6px;left:6px;width:15px;height:15px;border-radius:var(--dsw-radius-xs);border:1px solid #cbd5e1;background:#fff;font-size:11px;line-height:13px;text-align:center;color:#2563eb}
.iv-meta{font-size:11px;color:var(--faint)}
.iv-dispatchbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:10px;padding-top:12px;border-top:1px dashed var(--line)}
.iv-cur{background:#f5f9ff}
.iv-hist{display:flex;flex-direction:column;gap:8px}
.iv-hist-item{display:flex;flex-direction:column;gap:4px;text-align:left;padding:8px 8px;border:1px solid var(--line);border-radius:var(--dsw-radius-md);background:#fff;cursor:pointer;font:inherit}
.iv-hist-item.on{border-color:#2563eb;background:var(--blue-weak)}
.iv-hist-item b{font-size:13px;color:#1f2733}
.iv-hist-item i{font-size:11px;color:var(--faint);font-style:normal}
.iv-hist-note{font-size:11px;color:var(--sub)}
.iv-modal{max-width:1080px;width:96%}
.iv-modal-hint{font-size:12px;color:var(--sub);margin-bottom:8px}
.iv-modal-hint2{font-size:12px;color:var(--sub)}
.iv-split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
.iv-talk-l{border-right:1px dashed var(--line);padding-right:12px;max-height:56vh;overflow:auto}
.iv-talk-r{max-height:56vh;overflow:auto}
/* 四步条 + 派发区里的 AI 设置 */
/* 2026-10-17：.iv-steps 流程条样式随之删除 —— 访谈首页那条写死的步骤条已移除
 * （永远高亮①、点不动，卡片标题自带 ①②③④⑤ 已足够）。 */
.iv-ai{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--sub)}
/* 原右栏三卡（历史问卷/名单来源/过程监控）：全宽化后横排一行，不再独占右侧窄列 */
.iv-side{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start;margin-bottom:14px}
.iv-side>.card{margin-bottom:0}
@media (max-width:1100px){.iv-side{grid-template-columns:minmax(0,1fr)}}
/* 卡片横排后仍不算宽，状态流转保持"标题+说明"两行，别挤成竖排 */
.iv-flow-item{padding:8px 0;border-bottom:1px dashed var(--line)}
.iv-flow-item:last-child{border-bottom:0}
.iv-flow-h{display:flex;align-items:baseline;gap:6px;font-size:13px}
.iv-flow-h b{color:#1f2733}
.iv-flow-h span{color:var(--sub);font-variant-numeric:tabular-nums}
.iv-flow-d{font-size:12px;color:var(--faint);margin-top:2px}
/* 一对一对话：AI 左、受访者右 */
.iv-chat{display:flex;flex-direction:column;gap:12px}
.iv-chat .row{display:flex}
.iv-chat .row.me{justify-content:flex-end}
.iv-chat .row>div{max-width:78%}
.iv-chat .who{font-size:11px;color:var(--faint);margin-bottom:3px}
.iv-chat .row.me .who{text-align:right}
.iv-chat .bubble{padding:8px 12px;border-radius:var(--dsw-radius-md);background:#fff;border:1px solid var(--line);font-size:13px;line-height:1.7}
.iv-chat .row.me .bubble{background:#2563eb;border-color:#2563eb;color:#fff}
.iv-chat .note{font-size:12px;color:var(--sub);margin-top:5px}
.iv-flash .bubble{box-shadow:0 0 0 3px #fde68a}
/* 看板：卡片网格，不是列表。
   2026-10-24：auto-fill(232px) 在 762 宽的中栏里切 3 列，而发现/人群都是 4 条 ⇒ 必然 3+1 留一个洞。
   固定 2 列后 4 条排成 2×2，长句也不用在 232px 里折成四行。 */
.iv-board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:1180px){.iv-board{grid-template-columns:minmax(0,1fr)}}
.iv-tile{border:1px solid var(--line);border-radius:var(--dsw-radius-md);padding:8px 12px;background:#fff}
.iv-tile.bad{border-color:#fecaca;background:#fef7f7}
.iv-tile-n{font-size:20px;font-weight:700;color:#1f2733;line-height:1.2}
.iv-tile-n em{font-size:12px;font-weight:500;color:var(--faint);font-style:normal;margin-left:4px}
.iv-tile-t{font-size:13px;font-weight:600;margin:4px 0 4px}
.iv-tile-q{font-size:12px;color:var(--sub);line-height:1.6}
/* 用户列表：紧凑、定宽、单行 —— 别把一行拉成一屏那么高 */
.iv-ul{table-layout:fixed;width:100%}
.iv-ul th,.iv-ul td{padding:8px 8px;font-size:13px;text-align:left;vertical-align:middle;line-height:1.5}
.iv-ul th{font-size:12px;color:var(--faint);font-weight:500}
.iv-ul .c1{width:240px}.iv-ul .c2{width:88px}.iv-ul .c3{width:92px}
.iv-ul .c4{width:48px}.iv-ul .c5{width:68px}.iv-ul .c6{width:60px}.iv-ul .c7{width:60px}
.iv-ul .c8{width:auto}
.iv-ul .ta-r{text-align:right}
.iv-ul .iv-a{display:inline-flex;align-items:center;gap:6px}
.iv-ul .iv-ph{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
.iv-bar-wrap{max-width:200px}

/* 2026-10-24：问卷看板 / 提纲评价 视觉统一
   1) KPI 按卡数固定列数 —— auto-fit(196px) 在 762 宽的看板里排成 3+1，第四张孤零零占一行
   2) 评价两列给语义色 —— 两列原来都是灰条，扫不出"该保持 vs 该改"
   3) 数字等宽 —— 轮次与百分比上下对得齐 */
.metrics.g4{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.metrics.g3{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.metrics.g4 .metric,.metrics.g3 .metric{padding:14px 15px}
.metrics.g4 .m-label,.metrics.g3 .m-label{font-size:12.5px;gap:3px}
.metrics.g4 .m-value,.metrics.g3 .m-value{font-size:26px;margin:6px 0 3px;font-variant-numeric:tabular-nums}
.metrics.g4 .m-sub{font-size:11.5px;line-height:1.5}
@media (max-width:1200px){
  .metrics.g4,.metrics.g3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
/* 卡头：标题 + 副标在左，按钮成组贴右。
   原来 .card-sub 带 margin-left:auto，副标会被推到按钮旁边挤成一坨。 */
.card-h.split{gap:10px}
.card-h.split .card-sub{margin-left:0;text-align:left}
.card-h.split .card-act{margin-left:auto;display:flex;align-items:center;gap:6px}
/* 评价两列：左绿「保持」、右红「需要修改」，条目仍是白底细边，只借左侧色条表态。
   ⚠ 必须固定 2 列：.grid2 是 repeat(auto-fit,minmax(360px,1fr))，卡片宽到 1592 时会切成 4 轨，
   而这里只有 2 个 div ⇒ 右边空两轨，整块内容挤在左半边（1920 屏上就是"右侧留白能开奶茶店"）。 */
.grid2.why-cols{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:900px){.grid2.why-cols{grid-template-columns:minmax(0,1fr)}}
.why-cols .why-item{padding:11px 14px;border-left:3px solid var(--line);transition:background .12s,border-color .12s}
.why-cols>div:first-child .why-item{border-left-color:#16a34a;background:#fbfefc}
.why-cols>div:last-child .why-item{border-left-color:#dc2626;background:#fffbfb}
.why-cols .why-item:hover{background:#fff}
/* 下一版建议：蓝条表示「可执行项」，与上面绿（保持）/红（要改）形成三色语义。
   限定 .why-next，别把 KOL 页也在用的 .why-list 一起染蓝。 */
.why-list.why-next .why-item{border-left:3px solid #2563eb;background:#fbfdff}
.why-list.why-next .why-item.skip{background:#fff}
/* 看板小卡：数字等宽、证据等级占右上角（不再随引语长度上下跳） */
.iv-tile-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px}
.iv-tile-n{font-variant-numeric:tabular-nums;display:block}
.iv-tile{padding:10px 13px}
.iv-tile-t{margin:5px 0 5px}
.iv-tile-h .pill{flex:0 0 auto}
/* 2026-10-24 看板全宽化收尾：看板卡独占整行后宽度足够（≥1201px 内容区约 1400+），
   关键发现 / 分人群各 4 条升为 4 列正好一行铺满，不再 2×2 右半留空；
   问卷评价「保持/需要修改」保持并排两列。必须写在本段末尾：
   .iv-board 基础 2 列与窄屏 1 列规则在前，写早了会被层叠覆盖。 */
@media (min-width:1401px){
  .iv-board{grid-template-columns:repeat(4,minmax(0,1fr))}
}

/* SECTION: v26-kb-desk
   企业知识库「桌面式」管理（走查意见：布局跟桌面一样方便管理）。
   形状取自桌面：图标 + 文件夹 + 双击打开 + 右键菜单 + 拖拽归类 + 框选多选 + 状态栏。
   尺寸按"一屏能扫"定：图标 40px、格子最小 108px、每页 24 项（4–8 列 × 3–6 行）。
   选区用蓝色描边 + 浅蓝底（与全站 .view-sw / .sp-item.on 同一套强调色），不用反白 ——
   反白在浅色底上会把 11.5px 的元信息压成看不清。 */
.kb-desk-card{padding:0;overflow:hidden}
.kb-desk{display:flex;flex-direction:column}
/* 工具条：面包屑 + 查看方式 + 动作 */
.kb-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 12px 12px;border-bottom:1px solid var(--line-soft)}
/* v49（业主：「下面换成」「分级，右侧预览，像文件管理一样」）列表视图 = 文件管理器三栏：
   左栏两级树（库 → 分类）/ 中栏带表头的清单 / 右栏预览 + 详细信息。
   表头与行用同一套 grid 列宽（18 / 1fr / 84 / 62 / 10），否则永远对不齐。 */
.kb-cols{display:flex;border-top:1px solid var(--line-soft);min-height:420px;height:calc(100vh - 430px);max-height:620px}
.kb-col{overflow-y:auto;padding:8px 6px}
.kb-col-1{flex:0 0 216px;border-right:1px solid var(--line-soft);background:var(--bg-subtle-1);padding:8px}
.kb-col-2{flex:1;min-width:0;padding:6px 4px}
.kb-col-3{flex:0 0 282px;border-left:1px solid var(--line-soft);background:var(--bg-subtle-1);padding:0;display:flex;flex-direction:column}
/* 左栏树 */
.kb-tree-row{display:flex;align-items:center;gap:7px;width:100%;padding:6px 8px;border:0;border-radius:8px;background:none;font:inherit;font-size:13px;color:var(--text);text-align:left;cursor:pointer}
.kb-tree-row:hover{background:var(--bg-subtle-2)}
.kb-tw{flex:0 0 10px;width:10px;font-size:10px;line-height:1;color:var(--faint)}
.kb-tree-nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.kb-tree-root b{font-weight:400;font-size:12px;color:var(--faint)}
.kb-tree-kids{padding-left:14px}
.kb-col-row{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;margin-bottom:1px;border:0;border-radius:8px;background:none;font:inherit;font-size:13px;color:var(--text);text-align:left;cursor:pointer}
.kb-col-row:hover{background:var(--bg-subtle-2)}
/* 只让第一个 span 吃剩余宽度：行尾那个 › 也是 span，一起 flex:1 会把名字挤成三个字 */
.kb-col-row > span:first-of-type{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kb-col-row.on{background:var(--blue-weak);color:var(--blue)}
.kb-col-row b{flex:0 0 auto;font-weight:400;font-size:12px;color:var(--faint)}
/* 行尾的 > ：参考产品的左栏靠它表示"能进去"，不是装饰 */
.kb-cv{flex:0 0 auto;font-size:12px;line-height:1;color:var(--decor,var(--faint));margin-left:2px}
.kb-col-row.on b{color:var(--blue)}
/* 中栏清单 */
.kb-col-h{position:sticky;top:-6px;z-index:1;display:grid;grid-template-columns:18px 1fr 84px 62px 10px;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line-soft);background:var(--card);font-size:12px;color:var(--faint)}
.kb-col-doc{display:grid;grid-template-columns:18px 1fr 84px 62px 10px;gap:8px;align-items:center;width:100%;padding:7px 10px;margin-bottom:1px;border:0;border-radius:8px;background:none;font:inherit;font-size:13px;color:var(--text);text-align:left;cursor:pointer}
.kb-col-doc:hover{background:var(--bg-subtle-2)}
.kb-col-doc.on{background:var(--blue-weak);color:var(--blue)}
.kb-col-nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kb-ch-r{text-align:right;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
.kb-col-doc.on .kb-ch-r{color:var(--blue);opacity:.8}
.kb-col-dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
.kb-col-dot.warn{background:var(--amber)}
.kb-col-dot.bad{background:var(--red)}
.kb-col-dot.idle{background:var(--faint)}
/* 右栏预览 */
.kb-col-3act{display:flex;gap:8px;padding:16px}
/* 右栏详情区：上半是一张"纸"（页面预览），下半是标题 + 元数据 + 操作 —— 照网盘的详情面板 */
.kb-pv{padding:14px 14px 0}
.kb-pv-page{position:relative;height:176px;overflow:hidden;padding:14px 12px 24px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.kb-pv-page::after{content:"";position:absolute;left:0;right:0;bottom:0;height:26px;background:linear-gradient(rgba(255,255,255,0),#fff 70%)}
.kb-pv-page p{margin:0 0 7px;font-size:10px;line-height:16px;color:var(--sub);text-align:justify}
.kb-pv-pg{position:absolute;right:10px;bottom:6px;z-index:1;padding-left:10px;background:#fff;font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums}
.kb-pv-body{padding:14px 16px 16px}
.kb-pv-nm{display:flex;align-items:flex-start;gap:7px;font-size:14px;font-weight:500;line-height:20px;color:var(--text);word-break:break-all}
.kb-pv-nm .kb-tico{margin-top:2px}
.kb-pv-sub{margin-top:4px;font-size:12px;line-height:18px;color:var(--faint)}
.kb-pv-dl{display:grid;grid-template-columns:64px 1fr;gap:8px 10px;margin:12px 0 0;padding:12px 0 0;border-top:1px solid var(--line-soft);font-size:12px;line-height:18px}
.kb-pv-dl dt{color:var(--faint)}
.kb-pv-dl dd{margin:0;color:var(--text);word-break:break-all}
.kb-pv-note{margin-top:12px;font-size:11px;line-height:16px;color:var(--faint)}
.kb-col-3act{display:flex;gap:8px;padding:14px 0 0}
/* 中栏类型图标：复用全站 ico-i.t-* 色相，与卡片视图同一个配色 */
.kb-tico{display:inline-flex;align-items:center;justify-content:center;margin:0}
.kb-tico svg{width:15px;height:15px}
.kb-crumb{display:flex;align-items:center;gap:6px;font-size:13px;min-width:0}
.kb-crumb-cur{font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.kb-crumb-sep{color:var(--decor)}
.kb-crumb-lnk{color:var(--blue);font-size:13px;padding:2px 4px;border-radius:var(--dsw-radius-sm);white-space:nowrap}
.kb-crumb-lnk:hover{background:var(--blue-weak)}
.kb-crumb-lnk.drop-on{background:var(--blue-weak);box-shadow:inset 0 0 0 1px var(--blue)}
.kb-back{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--sub);border:1px solid var(--line);border-radius:var(--dsw-radius-sm);padding:4px 12px;background:#fff;white-space:nowrap}
.kb-back:hover{border-color:var(--blue);color:var(--blue)}
.kb-layout{flex:0 0 auto}
/* 按名搜索：12,840 篇的库里没有它，桌面就只能靠逐个文件夹点开找 */
.kb-search{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:var(--dsw-radius-sm);
  padding:0 8px;height:30px;background:#fff;flex:0 1 210px;min-width:132px}
.kb-search svg{color:var(--faint);flex:0 0 14px}
.kb-search input{border:0;outline:none;background:none;font-size:13px;color:var(--text);width:100%;min-width:0}
.kb-search:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
/* 画布：桌面本体。浅渐变给它一点"桌面"的层次，但不做成壁纸 —— 底下的文字才是内容 */
.kb-canvas{position:relative;padding:12px;min-height:180px;
  background:linear-gradient(180deg,#fbfdff,#f5f8fd)}
.kb-items{display:grid;gap:12px}
.kb-items-fld{grid-template-columns:repeat(auto-fill,minmax(272px,1fr))}
.kb-items-doc{grid-template-columns:repeat(auto-fill,minmax(236px,1fr))}
/* 知识库列表：**固定每行 4 个**（不走 auto-fill 自适应）——
   自适应会让 5 个库挤成一行 5 个、卡片被压窄；固定 4 列则第 5 个另起一行，
   空位就空着，不拉伸。窄屏再降列。 */
.kb-items-lib{grid-template-columns:repeat(4,1fr)}
/* 画像卡片（卡片管理：网格为主，与知识库同一套 .kb-item 基样式） */
.kb-items-pf{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
/* 经验卡片（卡片管理：网格为主，与知识库/画像库同一套基样式） */
.kb-items-exp{grid-template-columns:repeat(auto-fill,minmax(252px,1fr))}
.kb-item.kb-exp{padding:20px 16px 16px;cursor:pointer;gap:5px}
.kb-exp .kb-nm{font-size:14px}
.kb-exp .kb-mt{font-size:12px;color:var(--faint);text-align:center}
.kb-exp-nums{font-size:12px;color:var(--sub);text-align:center;font-variant-numeric:tabular-nums}
.kb-exp-nums b{font-weight:600;color:var(--text)}
/* v27：#16a34a 在白底只有 3.3:1，不达 AA；改用令牌 --green（5.02:1） */
.kb-exp-nums b.ok{color:var(--green)}
.kb-exp-nums b.bad{color:var(--red)}
.kb-item.kb-pf{padding:24px 16px 20px;cursor:pointer;gap:5px}
.kb-pf .kb-pf-tags{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:2px 0 3px}
.kb-pf .kb-mt{font-size:12px;color:var(--faint);text-align:center}
@media (max-width:1180px){.kb-items-lib{grid-template-columns:repeat(3,1fr)}}
@media (max-width:880px){.kb-items-lib{grid-template-columns:repeat(2,1fr)}}
/* 分类筛选条（一屏两层：分类在上、文档在下） */
.kb-cats{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 14px;margin-bottom:4px;
  border-bottom:1px solid var(--line-soft)}
.kb-cat{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;font-size:13px;
  font-family:inherit;color:var(--sub);background:#fff;border:1px solid var(--line);
  border-radius:var(--dsw-radius-pill);cursor:pointer;transition:border-color .14s,background .14s,color .14s}
.kb-cat:hover{border-color:#c7d5ef;color:var(--text)}
.kb-cat.on{background:var(--blue-weak);border-color:rgba(37,99,235,.32);color:var(--blue);font-weight:600}
.kb-cat>span{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.kb-cat.on>span{color:var(--blue)}
.kb-cat-new{border-style:dashed}
.kb-cat-dot{width:7px;height:7px;border-radius:50%;background:var(--decor);flex:0 0 7px}
.kb-cat-dot.h-blue{background:#2563eb}.kb-cat-dot.h-purple{background:#7c3aed}
.kb-cat-dot.h-teal{background:#0d9488}.kb-cat-dot.h-slate{background:#64748b}
.kb-cat-dot.h-amber{background:#d97706}.kb-cat-dot.h-green{background:#16a34a}
.kb-cat-dot.h-rose{background:#e11d48}.kb-cat-dot.h-indigo{background:#4f46e5}
.kb-cat-dot.h-cyan{background:#0891b2}
.kb-item{display:flex;flex-direction:column;align-items:center;gap:12px;padding:32px 16px 28px;
  background:#fff;border:1px solid var(--line);border-radius:var(--dsw-radius-lg);cursor:pointer;text-align:center;
  transition:border-color .14s,box-shadow .14s,transform .14s}
.kb-item:hover{background:#fff;border-color:#c7d5ef;box-shadow:0 6px 20px rgba(15,23,42,.09);transform:translateY(-1px)}
.kb-item:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.kb-item.on{border-color:var(--blue);box-shadow:0 0 0 2px rgba(37,99,235,.16)}
.kb-item.dragging{opacity:.45}
.kb-item.drop-on{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue),0 0 0 3px rgba(37,99,235,.14)}
.kb-ico{position:relative;display:flex;align-items:center;justify-content:center;
  width:56px;height:56px;border-radius:var(--dsw-radius-lg);color:#64748b;
  background:rgba(100,116,139,.10);transition:background .12s,color .12s}
.kb-item.on .kb-ico{color:var(--blue);background:rgba(37,99,235,.14)}
.kb-ico-kb{color:var(--blue);background:var(--blue-weak)}
.kb-ico-fld{color:#64748b;background:rgba(100,116,139,.10)}
.kb-ico svg{stroke-width:1.7}
.kb-item.on .kb-ico svg{stroke-width:2.1}
.kb-dot{position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;border-radius:50%;border:1.5px solid #fff;background:var(--faint)}
/* 文档类型各一个色相 —— 与 v10-detail-asset.js 的 DOC_TYPES.hue 对应
   依据 Fluent 2 图标规范：「File type icons indicate specific files or file formats」
   「only use one color」。原来 9 类同一个灰，等于没传达类型。 */
.kb-ico.h-blue{color:#2563eb;background:rgba(37,99,235,.11)}
.kb-ico.h-purple{color:#7c3aed;background:rgba(124,58,237,.11)}
.kb-ico.h-teal{color:#0d9488;background:rgba(13,148,136,.12)}
.kb-ico.h-slate{color:#64748b;background:rgba(100,116,139,.12)}
.kb-ico.h-amber{color:#d97706;background:rgba(217,119,6,.12)}
.kb-ico.h-green{color:#16a34a;background:rgba(22,163,74,.12)}
.kb-ico.h-rose{color:#e11d48;background:rgba(225,29,72,.11)}
.kb-ico.h-indigo{color:#4f46e5;background:rgba(79,70,229,.11)}
.kb-ico.h-cyan{color:#0891b2;background:rgba(8,145,178,.12)}
.kb-dot.warn{background:var(--amber)}
.kb-dot.bad{background:var(--red)}
.kb-nm{font-size:15px;line-height:1.35;font-weight:600;color:var(--text);max-width:100%;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.kb-item.on .kb-nm{color:var(--blue-deep);font-weight:600}
.kb-mt{font-size:13px;color:var(--faint);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.kb-mt-new{color:var(--purple)}
/* 访问记录（v27）：大头照 + 人 / Agent 徽章 + 时间 + 点开详情 */
/* 访问记录：默认卡片网格，可切列表；点开走弹窗 */
/* 成员 / Agent 两段：小标题 + 各自的视图切换 */
/* 文档详情：左原文 / 右分析（v28）。
   原文是"这份文档写了什么"，分析是"它在检索里表现如何" —— 并排才能对照。 */
.v10-sheet.wide{max-width:1180px;width:96vw}
.doc-2col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:18px;margin-top:12px}
.doc-col{min-width:0}
/* 左栏独立滚动：读长原文时右侧分析保持可见（不然滚到底就看不到分析了） */
.doc-col-l{max-height:62vh;overflow:auto;padding-right:8px}
.doc-col-r{max-height:62vh;overflow:auto}
.doc-col-r{border-left:1px solid var(--line-soft);padding-left:20px}
@media (max-width:900px){.doc-2col{grid-template-columns:1fr}.doc-col-r{border-left:0;padding-left:0;
  border-top:1px solid var(--line-soft);padding-top:12px}}
.doc-sec{background:#f8fafc;border:1px solid var(--line-soft);border-radius:var(--dsw-radius-sm);
  padding:12px 12px;margin-top:8px}
.doc-sec>b{display:block;font-size:13px;color:var(--text);margin-bottom:6px}
/* 原文按「纸」分页：白纸 + 页边距 + 投影 + 页码（参照成熟产品的文件预览） */
.doc-page{background:#fff;border:1px solid var(--line);border-radius:var(--dsw-radius-sm);
  padding:32px 36px 20px;margin-bottom:14px;box-shadow:0 1px 3px rgba(15,23,42,.06)}
.doc-h{font-size:14px;font-weight:600;color:#0f172a;margin:18px 0 10px;letter-spacing:.02em}
.doc-page>.doc-h:first-child{margin-top:0}
.doc-page>p{margin:0 0 9px;font-size:13px;line-height:2.05;color:#334155;
  text-indent:2em;text-align:justify}
.doc-pgno{margin-top:16px;padding-top:8px;border-top:1px dashed var(--line-soft);
  text-align:center;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.doc-stat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.doc-stat>span{display:flex;flex-direction:column;gap:1px;background:#f8fafc;border-radius:var(--dsw-radius-sm);padding:8px 8px}
.doc-stat i{font-style:normal;font-size:11px;color:var(--faint)}
.doc-stat b{font-size:14px;font-variant-numeric:tabular-nums}
.dl-inline{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:2px 18px}
/* 右侧「版本历史」抽屉（v29）：不遮网格，所以用固定右侧栏而不是居中弹层 */
.kb-desk-wrap{position:relative}
.kb-ver{position:fixed;top:64px;right:0;bottom:0;width:360px;z-index:60;
  background:#fff;border-left:1px solid var(--line);box-shadow:-8px 0 28px rgba(15,23,42,.10);
  padding:16px 20px;overflow:auto}
.kb-ver-h{display:flex;align-items:center;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--line-soft)}
.kb-ver-h b{font-size:15px}
.kb-ver-x{margin-left:auto;width:26px;height:26px;border:0;border-radius:var(--dsw-radius-sm);background:none;
  font-size:20px;line-height:1;color:var(--sub);cursor:pointer}
.kb-ver-x:hover{background:var(--line-soft)}
.kb-ver-sec{margin-top:16px}
.kb-ver-t{display:block;font-size:12px;font-weight:600;color:var(--faint);margin-bottom:8px}
.kb-ver-hues{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.kb-hue{width:24px;height:24px;border-radius:var(--dsw-radius-sm);border:2px solid transparent;cursor:pointer;
  background:rgba(100,116,139,.12);position:relative}
.kb-hue.h-blue{background:#2563eb}.kb-hue.h-purple{background:#7c3aed}
.kb-hue.h-teal{background:#0d9488}.kb-hue.h-slate{background:#64748b}
.kb-hue.h-amber{background:#d97706}.kb-hue.h-green{background:#16a34a}
.kb-hue.h-rose{background:#e11d48}.kb-hue.h-indigo{background:#4f46e5}
.kb-hue.h-cyan{background:#0891b2}
.kb-hue.on{border-color:#0f172a;box-shadow:0 0 0 2px #fff inset}
.kb-ver-reset{margin-left:4px;font-size:12px;color:var(--blue);background:none;border:0;cursor:pointer}
.kb-ver-list{display:flex;flex-direction:column;gap:3px}
.kb-ver-row{display:flex;align-items:center;gap:9px;width:100%;padding:8px 8px;text-align:left;
  background:none;border:1px solid transparent;border-radius:var(--dsw-radius-sm);cursor:pointer;font-family:inherit}
.kb-ver-row:hover{background:var(--blue-weak)}
.kb-ver-row.on{background:var(--blue-weak);border-color:rgba(37,99,235,.28)}
.kb-ver-row.is-gone{opacity:.55}
.kb-ver-v{font-weight:600;font-size:13px;font-variant-numeric:tabular-nums;flex:0 0 30px}
.kb-ver-m{font-size:12px;color:var(--faint);flex:1 1 auto;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kb-ver-cur{font-size:11px;font-weight:600;color:var(--blue);flex:0 0 auto}
/* 卡片上的版本入口 */
.kb-verbtn{margin-top:4px;font-size:11px;color:var(--blue);background:var(--blue-weak);
  border:0;border-radius:var(--dsw-radius-sm);padding:2px 8px;cursor:pointer;font-family:inherit}
.kb-verbtn:hover{background:rgba(37,99,235,.18)}
/* 「被谁用到」表里的发起人列：小头像 + 姓名 */
.kb-who{display:flex;align-items:center;gap:7px;white-space:nowrap}
.kb-who .kb-acc-face{width:22px;height:22px;flex:0 0 22px;border-radius:var(--dsw-radius-sm)}
.kb-who .kb-acc-face .av{font-size:11px}
/* 「访问了什么」—— 主体卡片上的访问对象（文档名 / 查询词） */
.kb-acc-obj{font-size:12px;color:var(--blue);max-width:100%;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kb-acc-rowitem .kb-acc-obj{flex:0 1 auto;min-width:0}
/* 审计表格：一次操作一行，列对齐才排得了序、筛得了 */
/* 详情页返回按钮（面包屑不可点，所以要有显式返回） */
.ph-back{display:inline-flex;align-items:center;gap:4px;margin-right:10px;padding:2px 8px;
  font-size:12px;font-family:inherit;color:var(--blue);background:var(--blue-weak);
  border:0;border-radius:var(--dsw-radius-sm);cursor:pointer;vertical-align:1px}
.ph-back:hover{background:rgba(37,99,235,.18)}
/* 审计表分组标题（人与 Agent 分表） */
.kb-audit-cap{font-size:12px;font-weight:600;color:var(--faint);margin:12px 0 6px}
.kb-audit-cap:first-of-type{margin-top:6px}
.kb-audit{width:100%}
.kb-audit td{font-size:13px;vertical-align:middle}
.kb-audit .kb-who{gap:6px}
.kb-audit .kb-who .kb-acc-face{width:20px;height:20px;flex:0 0 20px;border-radius:var(--dsw-radius-sm)}
.kb-audit .kb-who .av{font-size:11px}
.kb-audit .muted{font-size:12px}
.kb-acc-sec{margin-bottom:14px}
.kb-acc-sec:last-of-type{margin-bottom:10px}
.kb-acc-sec-h{display:flex;align-items:center;gap:9px;margin-bottom:9px;padding-bottom:8px;
  border-bottom:1px solid var(--line-soft)}
.kb-acc-sec-t{font-size:13px;font-weight:600;color:var(--text)}
.kb-acc-sec.is-agent .kb-acc-sec-t{color:#7c3aed}
.kb-acc-sec-n{font-size:12px;color:var(--faint);background:rgba(100,116,139,.10);
  padding:1px 8px;border-radius:var(--dsw-radius-sm)}
.kb-acc-sec-h .view-sw{margin-left:auto}
.kb-acc-cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(196px,1fr))}
.kb-acc-card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 12px 16px;
  background:#fff;border:1px solid var(--line);border-radius:var(--dsw-radius-lg);cursor:pointer;text-align:center;
  font-family:inherit;transition:border-color .14s,box-shadow .14s,transform .14s}
.kb-acc-card:hover{border-color:#c7d5ef;box-shadow:0 6px 20px rgba(15,23,42,.09);transform:translateY(-1px)}
.kb-acc-card:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.kb-acc-card.is-agent{border-color:rgba(124,58,237,.22)}
.kb-acc-card.is-agent:hover{border-color:rgba(124,58,237,.45)}
.kb-acc-list{display:flex;flex-direction:column;gap:2px}
.kb-acc-rowitem{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;
  background:none;border:0;border-bottom:1px solid var(--line-soft);border-radius:var(--dsw-radius-sm);
  cursor:pointer;text-align:left;font-family:inherit}
.kb-acc-rowitem:last-child{border-bottom:0}
.kb-acc-rowitem:hover{background:var(--blue-weak)}
.kb-acc-rowitem:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
/* 头像：列表 30px / 卡片 54px。同一主体色相由 h.avatar 按姓名哈希决定，全站一致 */
.kb-acc-face{display:flex;align-items:center;justify-content:center;width:30px;height:30px;
  border-radius:50%;flex:0 0 30px;background:rgba(100,116,139,.12);color:#475569;overflow:hidden}
.kb-acc-face.lg{width:54px;height:54px;flex:0 0 54px;border-radius:var(--dsw-radius-lg)}
.kb-acc-face.is-agent{border-radius:var(--dsw-radius-sm);background:rgba(124,58,237,.12);color:#7c3aed}
.kb-acc-face.lg.is-agent{border-radius:var(--dsw-radius-lg)}
/* .av 自带 flex:0 0 22px —— 在 flex 容器里会把宽度锁成 22px，width:100% 无效，
   结果是 22×54 的竖胶囊（实测踩到）。必须一并覆盖 flex，才能真填满方块。 */
.kb-acc-face .av{width:100%;height:100%;flex:0 0 auto;font-size:13px;margin:0;border-radius:inherit}
.kb-acc-face.lg .av{font-size:24px}
.kb-acc-main{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1 1 auto}
.kb-acc-nm{font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.kb-acc-card .kb-acc-nm{font-size:15px;margin-top:2px}
.kb-acc-sub{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--faint);min-width:0;justify-content:center}
.kb-acc-rowitem .kb-acc-sub{justify-content:flex-start}
.kb-acc-act{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;color:var(--sub);max-width:100%}
.kb-acc-meta{font-size:12px;color:var(--faint);display:flex;align-items:center;gap:6px}
.kb-acc-badge{font-size:11px;font-weight:600;padding:1px 8px;border-radius:var(--dsw-radius-sm);flex:0 0 auto}
.kb-acc-badge.ag{background:rgba(124,58,237,.12);color:#7c3aed}
.kb-acc-badge.me{background:rgba(37,99,235,.12);color:var(--blue)}
.kb-acc-when{font-size:13px;color:var(--text);font-variant-numeric:tabular-nums;flex:0 0 auto}
.kb-acc-chev{margin-left:auto;font-size:12px;color:var(--blue);flex:0 0 auto}
/* 我建的项：原来靠图标琥珀色区分，图标颜色统一后改用**淡紫底**标记 ——
   分类走文档类型图标，不回到"文件夹相"，但"这是我建的"仍要一眼看得出。 */
.kb-item.kb-fld-new{background:rgba(139,92,246,.07);border-color:rgba(139,92,246,.28)}
.kb-item.kb-fld-new:hover{background:rgba(139,92,246,.13)}
/* 框选：拖出来的矩形。pointer-events:none —— 否则它会挡住自己下面的命中判定 */
.kb-marquee{position:absolute;border:1px solid var(--blue);background:rgba(37,99,235,.10);
  border-radius:var(--dsw-radius-xs);pointer-events:none;z-index:5}
/* 批量条 + 拖动落点条 */
.kb-batchslot{border-top:1px solid var(--line-soft)}
.kb-batch{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;background:var(--blue-weak);border-bottom:1px solid #d9e5ff}
.kb-batch-n{font-size:13px;color:var(--text)}
.kb-batch-n b{color:var(--blue-deep)}
.kb-drops{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;background:#fcfdff}
.kb-drops-k{font-size:12px;color:var(--faint);white-space:nowrap}
.kb-chips{display:flex;gap:6px;flex-wrap:wrap}
.kb-chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--sub);
  border:1px dashed var(--line);border-radius:var(--dsw-radius-pill);padding:3px 12px;background:#fff;white-space:nowrap}
.kb-chip svg{width:13px;height:13px;color:var(--faint)}
.kb-chip:hover{border-color:var(--blue);color:var(--blue);border-style:solid}
.kb-chip:hover svg{color:var(--blue)}
.kb-chip.drop-on{border-style:solid;border-color:var(--blue);background:var(--blue-weak);color:var(--blue-deep)}
.kb-chip-auto{color:var(--faint)}
/* 分页 */
.kb-pager{display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 0 2px;font-size:12px;color:var(--faint)}
/* 状态栏：Explorer 底部那一条 —— 有多少项、选了几项、下一步能干什么 */
.kb-status{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:8px 12px;
  border-top:1px solid var(--line-soft);background:var(--bg-subtle-1);font-size:12px;color:var(--faint)}
.kb-status b{color:var(--sub);font-weight:600}
.kb-st-sel{color:var(--blue-deep)}
.kb-st-sel b{color:var(--blue-deep)}
.kb-st-hint{margin-left:auto;color:var(--faint)}
/* 右键菜单：桌面右键的形状。定位为 fixed（在 body 上），不受卡片 overflow 裁切 */
.kb-menu{position:fixed;z-index:80;min-width:184px;padding:4px;background:#fff;
  border:1px solid var(--line);border-radius:var(--dsw-radius-md);box-shadow:0 14px 34px rgba(15,23,42,.18)}
.kb-mi{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 12px;
  border-radius:var(--dsw-radius-sm);font-size:13px;color:var(--text)}
.kb-mi:hover:not([disabled]){background:var(--blue-weak);color:var(--blue-deep)}
.kb-mi[disabled]{color:var(--decor);cursor:not-allowed}
.kb-mi.danger{color:var(--red)}
.kb-mi.danger:hover{background:var(--red-bg)}
.kb-mi-i{display:flex;color:var(--faint);flex:0 0 14px}
.kb-mi:hover:not([disabled]) .kb-mi-i{color:var(--blue-deep)}
.kb-mi.danger .kb-mi-i,.kb-mi.danger:hover .kb-mi-i{color:var(--red)}
.kb-mi-t{flex:1;min-width:0;white-space:nowrap}
.kb-mi-k{font-size:11px;color:var(--faint);font-family:"SF Mono",Consolas,monospace}
.kb-mi-sep{height:1px;background:var(--line-soft);margin:4px 6px}
/* 分段控件 .seg-group 此前**没有样式**（kb 文档页的筛选用它，渲染成一排裸按钮）。
   这里补上，与 .view-sw 同一形状 —— 两处都是"互斥筛选"，长得一样才对。 */
.seg-group{display:inline-flex;border:1px solid var(--line);border-radius:var(--dsw-radius-sm);overflow:hidden;background:var(--card)}
.seg-group .vs-btn{border-right:1px solid var(--line)}
.seg-group .vs-btn:last-child{border-right:0}
@media (max-width:620px){
  .kb-items-fld{grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}
  .kb-items-doc{grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}
  .kb-st-hint{display:none}
}

/* ── ChatGroupSeat.module.css:1-150 ───────────────────────────────────────── */
.groupseat-root{
  min-width: 0;
}
.groupseat-title{
  display: flex;
  max-width: 100%;
  align-items: center;
  gap: 6px;
  padding: 0;
  border: 0;
  background: none;
  color: var(--dsw-alias-label-tertiary);
  font: inherit;
  font-size: var(--dsh-content-font-size, 14px);
  text-align: left;
  cursor: pointer;
  transition: color 100ms ease;
}
.groupseat-title:hover{
  color: var(--dsw-alias-label-secondary);
}
/* The leading box and its glyph ride the body font-size delta so the icon
   keeps its optical share of the row at every Settings size. */
.groupseat-leading{
  position: relative;
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: calc(16px + var(--dsh-content-font-delta, 0px));
  height: calc(16px + var(--dsh-content-font-delta, 0px));
  color: inherit;
}
.groupseat-leading svg{
  width: calc(14px + var(--dsh-content-font-delta, 0px));
  height: calc(14px + var(--dsh-content-font-delta, 0px));
}
.groupseat-leading svg[width="16"]{
  width: calc(16px + var(--dsh-content-font-delta, 0px));
  height: calc(16px + var(--dsh-content-font-delta, 0px));
}
.groupseat-activityIcon,
.groupseat-chevron{
  position: absolute;
  inset: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: opacity 100ms ease;
}
.groupseat-activityIcon{
  opacity: 1;
}
.groupseat-chevron{
  opacity: 0;
}
.groupseat-title:is(:hover, :focus-visible) .groupseat-activityIcon{
  opacity: 0;
}
.groupseat-title:is(:hover, :focus-visible) .groupseat-chevron{
  opacity: 1;
}
.groupseat-title[aria-expanded="true"] .groupseat-activityIcon{
  opacity: 0;
}
.groupseat-title[aria-expanded="true"] .groupseat-chevron{
  opacity: 1;
}
.groupseat-title[aria-expanded="true"]{
  padding-bottom: 8px;
}
.groupseat-body{
  --dsh-chat-flow-gap: 6px;
  max-height: min(400px, 50vh);
  overflow-y: auto;
  overscroll-behavior-y: auto;
  scrollbar-gutter: stable;
}
.groupseat-label{
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.groupseat-fadeTop{
  mask-image: linear-gradient(to bottom, transparent 0, #000 24px, #000 100%);
}
.groupseat-fadeBottom{
  mask-image: linear-gradient(to bottom, #000 0, #000 calc(100% - 24px), transparent 100%);
}
.groupseat-fadeTop.groupseat-fadeBottom{
  mask-image: linear-gradient(
    to bottom,
    transparent 0,
    #000 24px,
    #000 calc(100% - 24px),
    transparent 100%
  );
}
@media (prefers-reduced-motion: reduce) {
  .groupseat-title,
  .groupseat-activityIcon,
  .groupseat-chevron{
    transition: none;
  }
}
.groupseat-content{
  display: flex;
  flex-direction: column;
}
.groupseat-content > *{ flex-shrink: 0; }
.groupseat-content > :not([hidden]):not(:empty) ~ :not([hidden]):not(:empty){
  margin-top: var(--dsh-chat-flow-gap, 6px);
}
.groupseat-expandedBody{
  max-height: none;
  overflow: visible;
  scrollbar-gutter: auto;
}
/* Member spacing changes share the closing body's timing. */
[data-chat-motion] .groupseat-content > :not([data-chat-motion]){
  transition: margin-top 160ms cubic-bezier(0.4, 0, 0.2, 1);
}
@media (prefers-reduced-motion: reduce) {
  [data-chat-motion] .groupseat-content > :not([data-chat-motion]){
    transition: none;
  }
}

/* ── TurnProcessNodeView.module.css:1-60 ──────────────────────────────────── */

  box-sizing: border-box;
  display: flex;
  align-items: center;
  width: 100%;
  min-width: 0;
  height: calc(33px + var(--dsh-content-font-delta, 0px));
  padding: 0 0 8px;
  border: none;
  border-bottom: 0.5px solid var(--dsw-alias-border-l2);
  background: none;
  color: var(--dsw-alias-label-tertiary);
  font: inherit;
  font-size: var(--dsh-content-font-size, 14px);
  cursor: pointer;
  text-align: left;
  transition: color 100ms ease;
}
.turnprocess-root:disabled{
  cursor: default;
}
.turnprocess-root:hover:not(:disabled){
  color: var(--dsw-alias-label-secondary);
}
.turnprocess-chevron{
  flex: none;
  width: 14px;
  height: 14px;
  margin-left: 4px;
  color: inherit;
  transition: transform 100ms ease;
}
.turnprocess-root[data-open] .turnprocess-chevron{
  transform: rotate(180deg);
}
.turnprocess-label{
  min-width: 0;
  overflow: hidden;
  font-size: inherit;
  line-height: calc(24px + var(--dsh-content-font-delta, 0px));
  text-overflow: ellipsis;
  white-space: nowrap;
}
.turnprocess-durationNumber{
  font-family: var(--ds-font-family-code);
  font-variant-numeric: tabular-nums;
}
@media (prefers-reduced-motion: reduce) {
  .turnprocess-root,
  .turnprocess-chevron{
    transition: none;
  }
}

/* ── ReasoningRow.module.css:1-77 ─────────────────────────────────────────── */
.reasonrow-root{

}
.reasonrow-root:not([data-expanded]){

.reasonrow-row{

}
.reasonrow-root[data-expanded] [data-open] [data-disclosure-header]{

  top: 0;
  z-index: 1;
  background: var(--dsw-alias-bg-base);
}
.reasonrow-leading{

}
.reasonrow-title{
  font-weight: 400;
}
.reasonrow-separator{
  flex: none;
  width: 2px;
  height: 2px;
  margin: 0 8px;
  border-radius: 1px;

.reasonrow-summary{

/* ── ChatView.module.css:57-116（列与流程间距；.frame/.scroll/.root 的容器部分见 .as-feed-wrap） ── */
