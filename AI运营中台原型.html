}

/* ── TurnNavigator.module.css:1-223 ───────────────────────────────────────── */
.turnnav-slot{
  position: absolute;
  top: 0;
  right: 0;
  left: 0;
  /* Above transcript CodeBlock banners (z-index 6). The rail band excludes
     the composer, so its preview never needs to cross the footer. */
  z-index: 7;
  height: 0;
  /* Query the transcript's usable width while keeping the rail full-bleed. */
  padding-inline: calc(var(--dsh-composer-side-clearance) + 16px);
  container-type: inline-size;
  pointer-events: none;
}
.turnnav-frame{
  /* The band a reader actually sees: the scrollport minus the sticky composer
     stack covering its floor. ConversationRoot publishes both measurements on
     the scrollport; the fallbacks carry the first paint before its observer
     fires. */
  --turn-rail-band: calc(
    var(--dsh-conversation-viewport-height, 100dvh) - var(--dsh-composer-height, 152px)
  );
  --turn-preview-height: 100px;
  position: absolute;
  top: calc(var(--turn-rail-band) / 2);
  right: 12px;
  width: 28px;
  /* Fixed-pitch marks never compress: a ladder taller than the band scrolls
     inside this frame instead of pushing marks under the composer or above
     the scrollport. */
  max-height: min(
    max(0px, calc(var(--turn-rail-band) - 64px)),
    420px
  );
  contain: layout;
  cursor: pointer;
  pointer-events: auto;
  transform: translateY(-50%);
}
.turnnav-scroller{
  position: relative;
  max-height: inherit;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: none;
}
.turnnav-scroller::-webkit-scrollbar{
  display: none;
}
.turnnav-fadeTop{
  mask-image: linear-gradient(to bottom, transparent 0, #000 24px, #000 100%);
}
.turnnav-fadeBottom{
  mask-image: linear-gradient(to bottom, #000 0, #000 calc(100% - 24px), transparent 100%);
}
.turnnav-fadeTop.turnnav-fadeBottom{
  mask-image: linear-gradient(
    to bottom,
    transparent 0,
    #000 24px,
    #000 calc(100% - 24px),
    transparent 100%
  );
}
.turnnav-marks{
  position: relative;
}
.turnnav-mark{
  position: absolute;
  top: 0;
  right: 0;
  left: 0;
  height: 10px;
  padding: 0;
  border: 0;
  border-radius: var(--dsw-radius-sm);
  background: transparent;
  cursor: pointer;
}
.turnnav-mark::before{
  position: absolute;
  top: 50%;
  right: 0;
  width: 20px;
  height: 2px;
  border-radius: var(--dsw-radius-xs);
  background: var(--dsw-alias-border-l4);
  content: '';
  transform: translateY(-50%) scaleX(0.6);
  transform-origin: right center;
  transition: transform 140ms ease, background-color 140ms ease;
}
/* Ordered before hover/active so those states keep their stronger tick. */
.turnnav-markUnloaded::before{
  transform: translateY(-50%) scaleX(0.4);
  opacity: 0.6;
}
.turnnav-markPreview::before{
  transform: translateY(-50%) scaleX(0.9);
  background: var(--dsw-alias-label-tertiary);
}
.turnnav-markBusy::before{
  animation: dsh-turn-mark-busy 1s ease-in-out infinite;
}
.turnnav-markActive::before{
  transform: translateY(-50%) scaleX(1);
  background: var(--dsw-alias-label-primary);
}
/* Keyboard focus outranks both resting states: the tick takes the brand color
   the rest of the rail never uses, and a hairline ring keeps it legible
   against a busy transcript. */
.turnnav-mark:focus-visible::before{
  transform: translateY(-50%) scaleX(1);
  background: var(--dsw-focus-ring-color, var(--dsw-alias-state-business-primary));
}
.turnnav-mark:focus-visible{
  outline: none;
}
.turnnav-mark:focus-visible::after{
  position: absolute;
  inset: 0 0 0 auto;
  width: 20px;
  border-radius: inherit;
  outline: 1px solid var(--dsw-focus-ring-color, var(--dsw-alias-state-business-primary));
  /* The scroller clips the right edge; keep the marker's ring inside it. */
  outline-offset: -1px;
  content: '';
}
.turnnav-preview{
  position: absolute;
  top: clamp(
    0px,
    calc(var(--turn-preview-center) - var(--turn-preview-height) / 2),
    calc(100% - var(--turn-preview-height))
  );
  right: calc(100% + 10px);
  box-sizing: border-box;
  width: min(300px, calc(100cqw - 120px));
  max-height: var(--turn-preview-height);
  overflow: hidden;
  padding: 10px 12px;
  border: 0;
  border-radius: var(--dsw-radius-lg);
  color: var(--dsw-alias-label-primary);
  background: var(--dsw-alias-bg-layer-1);
  box-shadow: var(--dsw-elevation-panel);
  pointer-events: none;
  animation: dsh-turn-preview-enter 120ms ease-out;
  transition: top 140ms cubic-bezier(0.2, 0.8, 0.2, 1);
}
.turnnav-previewPrompt,
.turnnav-previewResponse{
  display: -webkit-box;
  overflow: hidden;
  -webkit-box-orient: vertical;
}
.turnnav-previewPrompt{
  font: var(--dsw-font-xs-strong-13);
  -webkit-line-clamp: 1;
}
.turnnav-previewResponse{
  margin-top: 4px;
  color: var(--dsw-alias-label-caption);
  font: var(--dsw-font-xxs-12);
  -webkit-line-clamp: 3;
}
@keyframes dsh-turn-preview-enter {
  from { opacity: 0; transform: translateX(4px); }
  to { opacity: 1; transform: translateX(0); }
}
@keyframes dsh-turn-mark-busy {
  0%,
  100% { opacity: 1; }
  50% { opacity: 0.35; }
}
/* 源码是 @container (max-width: 900px)（:207-211，查 .slot 的 inline-size 容器）。
   我们的 .as-feed-wrap 就是那个容器，这里写成具名容器查询。 */
@container dsh-chat-frame (max-width: 900px) {
  .turnnav-frame{
    display: none;
  }
}
@media (prefers-reduced-motion: reduce) {
  .turnnav-frame,
  .turnnav-scroller,
  .turnnav-mark::before,
  .turnnav-markBusy::before,
  .turnnav-preview{
    transition: none;
    animation: none;
    scroll-behavior: auto;
  }
}

/* ── views.module.css:1-28（轨迹屏外壳 + 工具栏高度 + 底部让位） ──────────── */
.trajviews-root{
  --dsh-trajectory-toolbar-height: 32px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  height: 100%;
  min-height: 0;
  width: 100%;
  box-sizing: border-box;
  color: var(--dsw-alias-label-primary);
  background: var(--dsw-alias-bg-layer-1);
}
.trajviews-ledger{
  position: relative;
  z-index: 0;
  isolation: isolate;
  display: flex;
  flex: 1;
  min-height: 0;
  min-width: 0;
  overflow: hidden;
  /* ConversationRoot publishes the floating composer's live height.
     本原型的轨迹屏**没有**浮动输入条，所以把测量值显式置 0（不猜一个假高度）；
     消费点 TrajectoryTable.module.css:21/1013/1021 因此退化为「底部 0/12px」。 */
  --dsh-composer-height: 0px;
  --dsh-trajectory-bottom-clearance: calc(var(--dsh-composer-height) + 16px);
}

.trajbar-toggleIcon{

}
.trajbar-control{
  display: inline-flex;
  flex: none;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;

  height: 20px;
  padding: 0 5px;

.trajbar-controlThumb{

.trajbar-action{

  align-items: center;
  height: 20px;
  padding: 0 5px;

  border: 0;

/* ── 折叠摘要行（dsh TrajectoryTable.module.css:721-724 的 20px 折叠行）────────────
   「轮次 / 调用」收起后，被折叠的那一段由这一行代替：整行可点，点开只展开这一段。 */
.trajtable-collapsedRow>td{height:20px;padding:0;border-bottom:.5px solid var(--d-border2);cursor:pointer}
.trajtable-collapsedRow:hover>td{background:var(--d-hover)}
.trajtable-collapsedRow:focus-visible>td{outline:2px solid var(--d-brand);outline-offset:-2px}
.trajgroup-collapsed{height:20px;gap:8px}
.trajgroup-hint{flex:none;margin-left:auto;padding-right:20px;font-size:11px;color:var(--d-brand)}

/* ── 轨迹列筛选（工具条下面那排 时长/轮次/调用/输入/模型/工具）──────────────────
   状态存在 st.tfCols，渲染时把关掉的列翻成 wrap 上的 tf-hide-* 类，显隐只由这里决定。
   三档管「行」（输入 / 模型 / 工具），三档管「件」（时长列 / 调用序号 / 分组标题）。 */
.as-tt-wrap.tf-hide-input tbody tr[data-kind="system"],
.as-tt-wrap.tf-hide-input tbody tr[data-kind="context"],
.as-tt-wrap.tf-hide-model tbody tr[data-model],
.as-tt-wrap.tf-hide-tool tbody tr[data-kind="tool"]{display:none}
.as-tt-wrap.tf-hide-duration .as-tt-ms,
.as-tt-wrap.tf-hide-call .trajcell-index{display:none}
.as-tt-wrap.tf-hide-turn .trajtable-groupRow{display:none}

/* ── TrajectoryTable.module.css:99-1015（行高 30/20/9、轮次轨道 2px、选中轨道 3px、
      16px 请求边界圆点、提示词 diff 五种行角色、右侧 320–440px 详情面板） ───── */
.trajtable-split{
  --dsh-scrollbar-thumb: var(--dsw-alias-scrollbar-bg-l2);
  --dsh-scrollbar-thumb-hover: var(--dsw-alias-scrollbar-hover-l2);
  position: relative;
  display: flex;
  flex: 1;
  width: 100%;
  min-height: 0;
  overflow: hidden;
  background: var(--dsw-alias-bg-layer-1);
  container-type: inline-size;
}
.trajtable-tablePane{
  position: relative;
  flex: 1;
  min-width: 0;
  overflow-x: hidden;
  overflow-y: auto;
  padding-bottom: var(--dsh-trajectory-bottom-clearance, 0px);
  container: trajectory-table / inline-size;
}
.trajtable-table{
  --trajectory-turn-accent: color-mix(
    in srgb,
    var(--dsw-static-blue-500) 22%,
    var(--dsw-alias-bg-layer-1)
  );
  width: 100%;
  min-width: 0;
  border-spacing: 0;
  table-layout: fixed;
  color: var(--dsw-alias-label-primary);
  background: var(--dsw-alias-bg-layer-1);
  font: var(--dsw-font-xxs-12);
}
.trajtable-eventColumn{
  width: 122px;
}
.trajtable-eventColumn:where(:lang(zh)){
  width: 84px;
}
.trajtable-contentColumn{
  width: auto;
}
.trajtable-table th{
  position: sticky;
  top: 0;
  z-index: 3;
  box-sizing: border-box;
  height: 30px;
  padding: 0 8px;
  overflow: hidden;
  border-bottom: 0.5px solid var(--dsw-alias-border-l2);
  color: var(--dsw-alias-label-tertiary);
  background: var(--dsw-specific-sidebar-fill);
  font: var(--dsw-font-xxs-12);
  font-weight: 500;
  text-align: left;
  text-overflow: ellipsis;
  user-select: none;
  white-space: nowrap;
}
.trajtable-eventHeader{
  padding-right: 4px !important;
  text-align: right !important;
}
.trajtable-table td{
  box-sizing: border-box;
  height: 30px;
  padding: 0 8px;
  overflow: hidden;
  border-bottom: 0.5px solid var(--dsw-alias-border-l1);
  text-overflow: ellipsis;
  white-space: nowrap;
}
.trajtable-table tbody tr:not([data-collapsed-summary]):not([data-virtual-spacer]):not([data-history-load]){
  cursor: default;
  outline: none;
  transition:
    background-color 120ms var(--ds-ease-in-out),
    opacity 120ms var(--ds-ease-in-out);
}
.trajtable-table tbody tr[data-timeline-focus='outside']{
  opacity: 0.24;
}
.trajtable-table tbody tr:not([data-collapsed-summary]):not([data-virtual-spacer]):not([data-history-load]):not([data-selected='true']):hover{
  background: var(--dsw-alias-interactive-bg-hover);
}
.trajtable-table tbody tr[data-request-only='true']:hover{
  background: transparent;
}
.trajtable-table tbody tr[data-request-only='true'] td{
  height: 0;
  padding-top: 0;
  padding-bottom: 0;
  border-bottom: 0;
}
.trajtable-table tbody tr[data-terminal-request-boundary='true'] td{
  /* Retain the lower half of the 16px boundary marker at the table's end. */
  height: 9px;
}
.trajtable-table tbody tr[data-request-only='true'] .trajtable-turnRail{
  top: -15px;
  bottom: 0;
}
.trajtable-table tbody tr:not([data-collapsed-summary]):focus-visible{
  box-shadow: inset 0 0 0 1px var(--dsw-focus-ring-color, var(--dsw-alias-state-business-primary));
}
.trajtable-table tbody tr[data-selected='true']{
  background: var(--dsw-alias-interactive-bg-active);
}
.trajtable-requestBoundaryControl{
  --request-boundary-base-left: 12px;
  position: absolute;
  z-index: 6;
  top: -8px;
  left: calc(var(--request-boundary-base-left) + var(--request-boundary-offset, 0px));
  width: 16px;
  height: 16px;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
}
.trajtable-requestBoundaryControl::before{
  position: absolute;
  top: 5.5px;
  left: 5.5px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--dsw-alias-label-caption);
  box-shadow:
    0 0 0 2px var(--dsw-alias-bg-layer-1),
    0 0 0 3px transparent;
  content: '';
  transition:
    background 120ms var(--ds-ease-in-out),
    box-shadow 120ms var(--ds-ease-in-out);
}
.trajtable-requestBoundaryControl::after{
  position: absolute;
  top: 2px;
  left: 17px;
  width: max-content;
  padding: 0 4px;
  border: 0.5px solid var(--dsw-alias-border-l1);
  border-radius: var(--dsw-radius-xs);
  color: var(--dsw-alias-label-secondary);
  background: var(--dsw-alias-bg-layer-1);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
  content: attr(data-label);
  font: 9px/12px var(--ds-font-family-code);
  opacity: 0;
  pointer-events: none;
  transform: translateX(-2px);
  transition:
    opacity 120ms var(--ds-ease-in-out),
    transform 120ms var(--ds-ease-in-out);
  user-select: none;
  white-space: nowrap;
}
.trajtable-requestBoundaryControl:hover::before,
.trajtable-requestBoundaryControl:focus-visible::before{
  background: var(--dsw-alias-brand-primary-new-colorprimary-new-color);
}
.trajtable-requestBoundaryControlActive::before,
.trajtable-requestBoundaryControlActive:hover::before,
.trajtable-requestBoundaryControlActive:focus-visible::before{
  background: color-mix(
    in srgb,
    var(--dsw-alias-brand-primary-new-colorprimary-new-color) 18%,
    var(--dsw-alias-bg-layer-1)
  );
  box-shadow: 0 0 0 1.5px var(--dsw-alias-state-business-primary);
}
.trajtable-requestBoundaryControl[data-request-status='error']::before,
.trajtable-requestBoundaryControl[data-request-status='error']:hover::before,
.trajtable-requestBoundaryControl[data-request-status='error']:focus-visible::before{
  background: var(--dsw-alias-state-error-primary);
}
.trajtable-requestBoundaryControl:hover::after,
.trajtable-requestBoundaryControl:focus-visible::after{
  opacity: 1;
  transform: translateX(0);
}
.trajtable-requestBoundaryControl:focus-visible{
  outline: none;
}
.trajtable-table tbody tr:has(.trajtable-requestBoundaryControl:hover):not([data-selected='true']){
  background: transparent;
}
.trajtable-event{
  position: relative;
}
.trajtable-turnRail,
.trajtable-selectionRail{
  position: absolute;
  left: 0;
  background: var(--dsw-alias-brand-primary-new-colorprimary-new-color);
  pointer-events: none;
}
.trajtable-turnRail{
  z-index: 4;
  top: -1px;
  bottom: -1px;
  width: 2px;
  background: var(--trajectory-turn-accent);
}
.trajtable-table tbody tr[data-turn-end='true'] .trajtable-turnRail{
  bottom: 0;
}
.trajtable-selectionRail{
  z-index: 5;
  top: 0;
  bottom: 0;
  width: 3px;
}
.trajtable-table tbody tr[data-error='true'] .trajtable-turnRail{
  background: color-mix(
    in srgb,
    var(--dsw-alias-state-error-primary) 22%,
    var(--dsw-alias-bg-layer-1)
  );
}
.trajtable-table tbody tr[data-error='true'] .trajtable-selectionRail{
  background: var(--dsw-alias-state-error-primary);
}
.trajtable-table tbody tr[data-turn-start='true'] td{
  position: relative;
  overflow: visible;
}
.trajtable-table tbody tr[data-collapsed-summary='turn'] td,
.trajtable-table tbody tr[data-collapsed-summary='assistant'] td{
  height: 20px;
}
.trajtable-table tbody tr[data-collapsed-summary]{
  cursor: pointer;
  outline: none;
  transition: background-color 120ms var(--ds-ease-in-out);
}
.trajtable-table tbody tr[data-collapsed-summary]:hover{
  background: var(--dsw-alias-interactive-bg-hover);
}
.trajtable-collapsedTurnContent{
  display: flex;
  align-items: center;
  min-width: 0;
  color: var(--dsw-alias-label-secondary);
  font-size: 12px;
  line-height: 16px;
}
.trajtable-collapsedTurnEllipsis{
  flex: none;
  margin-right: 6px;
  color: var(--dsw-alias-label-tertiary);
  font-weight: 600;
  user-select: none;
}
/* 提示词 / 系统提示词 diff 面板（:611-672 逐字） */
.trajtable-promptDiffSections{
  display: flex;
  max-height: 100%;
  flex-direction: column;
  padding: 10px 14px 14px;
  gap: 14px;
  overflow: auto;
}
.trajtable-promptDiffSection{
  min-width: 0;
}
.trajtable-promptDiffTitle{
  margin: 0 0 6px;
  color: var(--dsw-alias-label-secondary);
  font: var(--dsw-font-xs-strong-13);
  user-select: none;
}
.trajtable-promptDiff{
  margin: 0;
  overflow: auto;
  color: var(--dsw-alias-label-primary);
  background: var(--dsw-alias-bg-layer-1);
  font: 11px/17px var(--ds-font-family-code);
  white-space: pre;
}
.trajtable-promptDiff span{
  display: block;
  min-width: max-content;
  padding: 0 6px;
}
.trajtable-promptDiffLinemeta{
  color: var(--dsw-alias-label-caption);
  background: var(--dsw-alias-bg-module-platform);
  user-select: none;
}
.trajtable-promptDiffLinecontext{
  color: var(--dsw-alias-label-secondary);
}
.trajtable-promptDiffLineadded{
  color: color-mix(
    in srgb,
    var(--dsw-alias-state-success-primary) 72%,
    var(--dsw-alias-label-primary)
  );
  background: var(--dsw-alias-state-success-tertiary);
}
.trajtable-promptDiffLineremoved{
  color: var(--dsw-alias-state-error-primary);
  background: color-mix(
    in srgb,
    var(--dsw-alias-state-error-primary) 12%,
    var(--dsw-alias-bg-layer-1)
  );
}
/* 右侧详情面板（:853-1015 逐字） */
.trajtable-details{
  position: relative;
  display: flex;
  flex: none;
  flex-direction: column;
  width: clamp(320px, 38%, 440px);
  max-width: calc(100% - 280px);
  min-width: 0;
  min-height: 0;
  border-left: 0.5px solid var(--dsw-alias-border-l2);
  background: var(--dsw-alias-bg-layer-1);
}
.trajtable-detailsResizeHandle{
  position: absolute;
  z-index: 6;
  top: 0;
  bottom: 0;
  left: -4px;
  width: 8px;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: col-resize;
  touch-action: none;
  user-select: none;
}
.trajtable-detailsResizeHandle:focus-visible{
  outline: none;
}
.trajtable-detailsHeader{
  display: flex;
  flex: none;
  align-items: center;
  justify-content: space-between;
  box-sizing: border-box;
  height: 42px;
  padding: 0 8px 0 12px;
  border-bottom: 0.5px solid var(--dsw-alias-border-l2);
}
.trajtable-detailsTitle{
  display: flex;
  align-items: center;
  min-width: 0;
  gap: 8px;
  color: var(--dsw-alias-label-primary);
}
.trajtable-requestDetailsDot{
  flex: none;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--dsw-alias-label-secondary);
}
.trajtable-requestDetailsName{
  flex: none;
  font: 500 12px/16px var(--ds-font-family-code);
}
.trajtable-detailsLocation{
  min-width: 0;
  overflow: hidden;
  color: var(--dsw-alias-label-tertiary);
  font: 11px/16px var(--ds-font-family-code);
  text-overflow: ellipsis;
  white-space: nowrap;
}
.trajtable-close{
  display: inline-flex;
  flex: none;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  padding: 0;
  border: 0;
  border-radius: var(--dsw-radius-sm);
  color: var(--dsw-alias-label-secondary);
  background: transparent;
  cursor: pointer;
  font-size: 18px;
  line-height: 18px;
}
.trajtable-close:hover{
  color: var(--dsw-alias-label-primary);
  background: var(--dsw-alias-interactive-bg-hover);
}
.trajtable-detailTabs{
  display: flex;
  flex: none;
  box-sizing: border-box;
  width: 100%;
  min-width: 0;
  max-width: 100%;
  height: 34px;
  padding: 0 8px;
  overflow-x: auto;
  overflow-y: hidden;
  gap: 1px;
  border-bottom: 0.5px solid var(--dsw-alias-border-l2);
  overscroll-behavior-x: contain;
  scrollbar-width: none;
  white-space: nowrap;
}
.trajtable-detailTabs::-webkit-scrollbar{
  display: none;
}
.trajtable-detailTab{
  position: relative;
  flex: none;
  padding: 0 9px;
  border: 0;
  color: var(--dsw-alias-label-tertiary);
  background: transparent;
  cursor: pointer;
  font: var(--dsw-font-xs-13);
}
.trajtable-detailTab:hover{
  color: var(--dsw-alias-label-primary);
  background: var(--dsw-alias-interactive-bg-hover);
}
.trajtable-detailTabActive{
  color: var(--dsw-alias-state-business-primary);
}
.trajtable-detailTabActive::after{
  position: absolute;
  right: 9px;
  bottom: 0;
  left: 9px;
  height: 2px;
  border-radius: 1px 1px 0 0;
  background: var(--dsw-alias-state-business-primary);
  content: '';
}
.trajtable-close:focus-visible,
.trajtable-detailTab:focus-visible{
  outline: 1px solid var(--dsw-focus-ring-color, var(--dsw-alias-state-business-primary));
  outline-offset: -1px;
}
.trajtable-detailBody{
  flex: 1;
  min-height: 0;
  overflow-x: hidden;
  overflow-y: auto;
  padding-bottom: var(--dsh-trajectory-bottom-clearance, 0px);
  scrollbar-gutter: stable;
}
@media (max-width: 760px) {
  .trajtable-details{
    position: absolute;
    z-index: 8;
    top: 0;
    right: 0;
    bottom: 0;
    width: min(440px, 100%);
    max-width: 100%;
    box-shadow: var(--dsw-elevation-panel);
  }
}

/* SECTION: v27-agent-session
   Agent 详情「会话与干预」（运行监控右边）。视觉照 DSH 的**真实取值**做——
   证据=asar 解包出的 dsh-client-ui-*（README.zh.md + 66 个还原 CSS Module），规格见
   DSH对话界面-界面规格.md 与 _check/cssdump/_tokens.txt。关键出处标在每块注释里。
   本地变量前缀 --d-：只作用于这一屏，不动设计稿既有变量。 */
.as-view{--d-label1:var(--dsw-alias-label-primary);--d-label2:var(--dsw-alias-label-secondary);--d-label3:var(--dsw-alias-label-tertiary);--d-caption:var(--dsw-alias-label-caption);
  --d-surface:var(--dsw-alias-bg-base);--d-module:var(--dsw-alias-bg-module-platform);--d-border1:var(--dsw-alias-border-l1);--d-border2:var(--dsw-alias-border-l2);--d-border3:var(--dsw-alias-border-l3);
  --d-hover:var(--dsw-alias-interactive-bg-hover);--d-hover-solid:var(--dsw-alias-interactive-bg-hover-solid);--d-brand:var(--dsw-alias-state-business-primary);--d-bubble:var(--dsw-specific-bubble);/* 语义位修正：原 --dsw-static-deepseek-50 与 --dsw-specific-bubble 精确等值，改走语义令牌 */
  --d-red:var(--dsw-alias-state-error-primary);--d-amber:var(--dsw-alias-state-warn-primary);--d-warn:var(--dsw-alias-state-warn-label);--d-green:var(--dsw-alias-state-success-primary);--d-idle:var(--dsw-alias-state-idle-primary);
  --d-r-xs:var(--dsw-radius-xs);--d-r-sm:var(--dsw-radius-sm);--d-r-md:var(--dsw-radius-md);--d-r-lg:var(--dsw-radius-lg);--d-r-xl:var(--dsw-radius-xl);--d-r-panel:var(--dsw-radius-panel);
  --d-mono:var(--dsw-font-family-code);
  /* 字号阶梯（DSH 同构）：基准 --d-fs 可整体调（设置项），次级与 delta 全部由它派生 */
  --d-fs:14px;
  --d-delta:calc(var(--d-fs) - 14px);
  --d-fs-secondary:min(calc(var(--d-fs) - 1px),max(13px,calc(var(--d-fs) - 2px)));
  --d-delta-secondary:calc(var(--d-fs-secondary) - 13px);
  --d-lh-body:calc(var(--d-fs) + 10px);
  --d-lh-secondary:calc(24px + var(--d-delta));
  --d-lh-caption:calc(20px + var(--d-delta-secondary));
  --d-content-w:900px;            /* 正文列宽：DSH clamp(680, 列宽*.64, 920) 的中间档 */
  color:var(--d-label1)}
/* 页签条（ConversationRoot.module.css:191-227）：13/16·500、gap36、pad-left 8。
   两种座位：
   · 独立成条（轨迹屏 .as-view>.as-tabs）—— 自己带下边线与下边距；
   · 搬进 .as-hd 内（会话屏，DOM 已冻结）—— 落 header 的 grid 第二行，
     下边线**交给 header 那条 .5px l3**（否则叠出两条线），2px 选中条用
     border-bottom + margin-bottom:-1px 压在那条线上（与全站二级页签同一套画法）。 */
/* v39：第二排页签改为**与管理页二级页签同一套规格**（业主：会话屏的「对话 / 轨迹」
   要长得像「编排配置 / 版本与发布 / 权限与工具」）。
   改前实测差异（1600×1000，逐项计算样式）：
     容器 gap  会话 36px  ←→  管理 2px          （两个页签隔了 88px 中心距）
     子项 pad  会话 0/13/9 ←→  管理 7/12/9       （会话少 7px 上内边距，整条矮 10px）
     字重 on   会话 500    ←→  管理 600
     下划线    会话 ::after 单画 ←→ 管理 border-bottom:2px + margin-bottom:-1px
     主色      会话 --d-brand(65,118,230) ←→ 管理 --blue(37,99,235)
   最后一条最要紧：同一屏的**第一排**用的是 --blue，第二排用 --d-brand，
   两排蓝不是同一个蓝 —— 切到管理页时两条蓝线并排，色差一眼能看出来。
   现在第二排整体对齐全站二级页签（.cwall-subtabs / .cwall-subtab）：
   字号 13、行高 16、padding 7/12/9、gap 2、hover/选中 --blue、选中 600。 */
.as-tabs{display:flex;gap:2px;padding:0;border-bottom:.5px solid var(--d-border3);margin-bottom:14px}
/* 会话屏：第二排紧跟第一排（管理页的 -4px 同款节奏，实测两排净距 20px → 6px） */
.as-hd>.as-tabs{grid-column:1/-1;position:relative;z-index:1;margin:-4px 0 0;padding:0;border-bottom:0}
/* v39b：.as-view 为了会话区满幅用了 margin:0 -24px，页签行因此比第一排页签**左移 24px**、
   它底下那条 .5px 线也比第一排长 48px（实测：第二排文字 292 / 第一排 317，线 280↔304）。
   这里把页头族的水平内缩补回给 .as-hd 自己 —— 页签起点、底线两端、右侧「右栏」按钮
   三样一起回到与第一排/页头同一竖线（304 / 1576）。 */
.content--as>.as-view>.as-hd{margin:0 24px}
.content--as>.as-view>.as-tabs{margin:0 24px 14px}
.as-tab{background:none;border:0;padding:7px 12px 9px;font-size:13px;font-weight:400;
  color:var(--sub);cursor:pointer;position:relative;border-bottom:2px solid transparent;margin-bottom:-1px}
.as-tab:hover{color:var(--blue)}
.as-tab.on{color:var(--blue);font-weight:600;border-bottom-color:var(--blue)}
/* v37：右栏开关 —— 钉在页签行**右上**（与「对话 / 轨迹」同一行，不新增一条孤行；
   上一版那行"展示模式 ⌄ · 右栏"就是因为孤零零被撤掉的）。
   存在的理由：窄屏（≤1280）默认收起右栏后，没有它就叫不回来；宽屏也照 DSH 允许收起。 */
.as-hd{position:relative}
/* ⚠ v46：**z-index 必须是 2**。.as-tabs 自己带 z-index:1 且 grid-column:1/-1（横跨整个 as-hd），
   按钮是绝对定位、z-index:auto —— 会被页签条整块盖住：elementFromPoint 拿到的是 DIV.as-tabs，
   真实鼠标点击全部落在页签条上，按钮"看着在、点不动"（程序化 .click() 能过，所以之前没抓到）。 */
.as-sidebtn{position:absolute;right:0;top:3px;z-index:2;display:inline-flex;align-items:center;gap:6px;
  height:22px;padding:0 8px;background:none;border:0;border-radius:var(--d-r-sm);
  font:inherit;font-size:12px;line-height:22px;color:var(--d-label3);cursor:pointer}
/* right:0 的前提是 .as-hd 已经内缩到页头那层（见上面 .content--as>.as-view>.as-hd 的 margin）——
   之前那版 .as-view 用 margin:0 -24px 拉满，按钮必须 right:24 才能回到页头右缘；
   现在 .as-hd 自己内缩了，再写 24 就会多缩一层。改这里之前先确认 .as-hd 的 margin。 */
.as-sidebtn:hover{color:var(--d-label2);background:var(--d-hover)}
.as-sidebtn.is-on{color:var(--d-label2)}
/* 图标：一个矩形 + 右侧竖分割线（"右边那一栏"），用 currentColor 画，不做 emoji */
.as-sidebtn-ico{width:11px;height:11px;border:.5px solid currentColor;border-radius:2px;
  background:linear-gradient(90deg,transparent 0 6px,currentColor 6px 7px,transparent 7px);opacity:.85}
/* 状态胶囊行：搬进右栏顶部 .as-side-top 后，纵向间距由容器统一给，自己不再留 padding-bottom
   （原 8px 是它在会话流里当独立条时的呼吸位，搬走后会与容器的 8/10px 叠成 18px）。 */
.as-status{display:flex;align-items:center;gap:10px;font-size:12.5px;padding-bottom:0;color:var(--d-label3)}
/* 三列：正文 | 拖拽条 | 右栏。右栏轨道与 .as-body 自己一起量（源码 ConversationRoot.module.css:384-387
   的 --dsh-chat-content-width: clamp(680px, 列宽*0.64, 920px) 是同一个列宽轴）：
   上限 32%、下限 300px，正文列因此永远拿得到源码 clamp 的下限 680px。
   原先写死 minmax(300px,32%) 但 JS 内联 743px 覆盖，正文列被压到 518px。 */
.as-body{display:grid;grid-template-columns:minmax(0,1fr) 10px minmax(300px,32%);gap:18px;align-items:start}
/* 轨迹页的 body 变体：**列要拿到确定高度**（.trajviews-root 的 height:100% 才能解析）。
   flex:1 占满 .as-view 里 header 之外的高度；grid-template-rows:minmax(0,1fr) 让唯一一行
   撑满；align-items:stretch 让三列等高（默认 start 会让格子按内容收缩，轨迹内容又归零）。 */
/* v40：轨迹视图**单列**（业主：轨迹异常 / 直接全屏，界面太小了）。
   改前 .as-body 的三列（内容 | 把手 | 右栏 32%）在轨迹屏也生效，但轨迹屏现在只有一个孩子
   （.trajtable-split）—— 实测列宽被算成 851.6 | 10 | 422.4，表格被压在 852、右边 432 全空。
   轨迹屏的"详情"不是右栏，而是 .trajtable-split 内部的第二个孩子（trajDetails，选中调用才出现），
   由 split 自己横向排；所以这里只需要把它变成单列，账本自然吃满整个内容宽。 */
.as-body--traj{flex:1;min-height:0;align-items:stretch;grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr)}
/* 输入条遮挡正文（老毛病，第二次修）：.as-composer 原来是 `position:sticky; bottom:0`。
   上一版的修法是给正文列预留出输入条高度 —— 它只在**贴底**那一格成立：sticky 的
   "停止线"是滚动容器的内容底，滚到中间位置时输入条仍会浮在正文上（实测中间档仍重叠 ≤39px）。
   源码 ConversationRoot 根本不靠 sticky 覆盖：`.scrollBody` 自己滚、`.composerSeat` 是
   **滚动口之外的兄弟**（ConversationRoot.module.css:401-434）。
   这里照源码把会话区做成受视口限制的独立滚动口（见下面 `.content--as` 作用域块），
   输入条/回底按钮/任务条/状态条/口径条都是滚动口的兄弟，几何上不可能压住正文。
   --as-composer-h 仍由 chatView 按实测高度写回（ResizeObserver），供轨道带等消费；
   padding-bottom 只留 8px 呼吸位 —— 预留量不再承担避让职责。 */
.as-feed-col{min-width:0;padding-bottom:8px}
.as-side{display:flex;flex-direction:column;gap:12px;position:sticky;top:0}
/* 右栏顶部容器（新增）：原「状态胶囊行」从会话流搬到这里，成为 .as-side 的第一个子元素。
   与下面的小节同规矩 —— 列内分区，不带卡外观，只用一条 0.5px 分隔线收口。 */
/* v47：右栏「数据口径与说明」默认**折叠**。实测它一条占 461px（meta-list 6 行），
   把右栏总高撑到 917px 而视口只有 432px —— 业主的原话是「下面一片空白，还有信息
   但必须滚动才能看，占一屏」。折叠后右栏 ≈ 439px，一屏读完；数据一行没删，点标题展开。 */
/* v48：右栏小节标题可点（现在「第 N 轮改动」默认折叠成一行） */
.as-side-hd.as-foldhd{width:100%;background:none;border:0;font:inherit;font-size:13px;font-weight:600;
  color:var(--d-label1);text-align:left;cursor:pointer;padding:0;display:flex;align-items:center;gap:8px}
.as-side-hd.as-foldhd:hover{color:var(--d-brand)}
.as-side-hd.as-foldhd .as-caret{font-size:10px;color:var(--d-label3)}
/* v48：右栏里的口径条改成**紧凑竖排**。原来 .meta-row 是「132px 标签列 + 1fr 值」的横排，
   右栏只有 418 宽，值区只剩 274px —— 「干预权限」那条 120 字要换 6 行（121px 高），
   6 项合计 461px。竖排后值区拿满 386px，同样内容只需 4 行，6 项合计约 390px。 */
/* v51：右栏拖窄之后，顶部状态行里的「暂停 / 接管」「N 件事等你点头 →」会被**按字拆行**
   （截图里"暂/停"竖着两行、"1 件事等你点头"换行后箭头单独一行）。中文默认任意字间可断，
   所以按钮必须自己锁 nowrap，整块换行而不是拆字。 */
.as-side-top button,
.as-side-top .as-link,
.as-side-top .as-status{white-space:nowrap}
/* v52：右栏里的 .as-kv（新增的「用到的服务 / 本会话用量」）在 418 宽下把标签挤成两行
   （"轮次 ·" / "动作" 竖着排）。右栏统一改成**标签上、值下**的紧凑竖排。 */
/* v52c：右栏里的一行读数（本会话用量）—— 12px、行高 18、不换行 */
.as-side .as-one{font-size:12px;line-height:18px;color:var(--d-label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.as-side .as-kv{display:block;padding:5px 0;border-bottom:.5px dashed var(--d-border2)}
.as-side .as-kv:last-child{border-bottom:0;padding-bottom:0}
.as-side .as-kv span{display:block;font-size:11.5px;line-height:15px;color:var(--d-label3);white-space:nowrap}
.as-side .as-kv b{display:block;font-size:12px;line-height:18px;color:var(--d-label1);font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.as-side .meta-row{display:block;padding:4px 0}
.as-side .meta-row dt{font-size:11.5px;line-height:15px;margin-bottom:0}
.as-side .meta-row dd{font-size:12px;line-height:1.5}
.as-side{gap:10px}
.as-side .meta-list{padding:0 14px 10px}
.as-side .meta-bar{font-size:12px}
.as-meta-collapse>.meta-bar>.meta-bar-h{cursor:pointer;user-select:none;display:flex;align-items:center;gap:8px}
.as-meta-collapse>.meta-bar>.meta-bar-h::after{content:'⌄';margin-left:auto;font-size:11px;
  color:var(--d-label3);transition:transform .15s ease}
.as-meta-collapse.is-open>.meta-bar>.meta-bar-h::after{transform:rotate(180deg)}
.as-meta-collapse:not(.is-open)>.meta-bar>.meta-list{display:none}
.as-side-top{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0 10px;border-bottom:.5px solid var(--d-border1)}
/* 正文列：max-width + margin auto（chat__ChatView.css:41-47）；流程间距 6/12/16（同文件 48-62） */
/* 列宽照 DSH：clamp(680, 列宽*.64, 920)；正文左右各 32px（chat__ChatView.css:21-27） */
.as-feed{width:100%;margin:0 auto;padding:16px 32px;max-width:clamp(680px,64%,920px)}
/* composer / 任务条限宽 = 内容列 + 32px，居中（ConversationRoot.css:240） */
/* 2026-10-17：输入条改为**跟对话列同中心、同宽度**，两处病因：
   ① max-width 原挂在 .as-composer 上，64% 相对**整个 .as-view** 算 → 实测卡片 928px 而消息
      正文只有 680px，两者不同宽；移到 .as-c-box 上后 64% 相对对话列算，卡片跟着正文宽走。
   ② margin-left/right:auto 是在整个 .as-view 里居中，右边挂着右栏 → 偏右 232px。
   现 .as-composer 用 align-self:stretch 撑满对话列，右侧占位由 JS 按右栏**实际可见性**内联写入
   （见 composerSeat：.as-grip 被 @media(max-width:1280px) 藏掉时写 auto，回到整幅居中）。 */
/* 右侧占位走 CSS 自定义属性：JS 只把「右栏宽 + 46」写进 --as-composer-inset（见 composerSeat），
   **是否应用**由下面的媒体查询决定 —— 跨 1280 断点缩放窗口时 CSS 自动重判，不依赖 JS。
   1280 及以下 .as-body 已是单列（HTML:4185），右栏不再并列 → 强制 auto 回整幅居中。 */
.as-composer{align-self:stretch;margin-right:var(--as-composer-inset,auto)}
@media (max-width:1280px){.as-composer{margin-right:auto}}
.as-c-box{max-width:calc(clamp(680px,64%,920px) + 32px)}
.as-tasks,.as-task-list{max-width:calc(clamp(680px,64%,920px) + 32px);margin-left:auto;margin-right:auto}
.as-round{padding:0 0 4px;border-bottom:.5px solid var(--d-border1);margin-bottom:16px}
/* 左侧色条已删：dsh 里没有这种画法，状态靠 StateDot 圆点 + 文字色表达，不使用左侧实色条，
   也不以别的颜色替代。padding-left 原是给色条让位的，按"只删 border 声明"保留。 */
/* is-need 原来的 padding-left:12px 是给已删除的 3px 左色条让位的，色条没了它就是无理由缩进，
   整条规则删除，让需要处理的轮次与普通轮次对齐；状态强调交给 StateDot 圆点 + 文字色（与 dsh 一致） */
.as-round.is-rolled{opacity:.7}
/* 用户气泡（chat__MessageItem.css:11-27）：var(--dsw-specific-bubble) / 半径 20 / 10px 16px / 14 与 22 行高 / pre-wrap */
.as-u{display:flex;flex-direction:column;align-items:flex-end;gap:6px;margin-bottom:16px}
.as-u-b{max-width:min(calc(var(--d-content-w) * .702),82%);background:var(--d-bubble);border-radius:var(--d-r-xl);
  padding:10px 16px;font-size:var(--d-fs);line-height:calc(var(--d-fs) + 8px);color:var(--d-label1);
  white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
/* 轮次折叠摘要行（chat__TurnProcessNodeView.css:5-28）：高 33+delta、下边 .5px l2、padding 0 0 8px、tertiary→hover secondary
   ⚠ 字号必须是 var(--dsh-content-font-size,14px)（=14px），不能用 --d-fs-secondary（=13px）：
   源码 TurnProcessNodeView.module.css:1 是 `font: inherit; font-size: var(--dsh-content-font-size, 14px)`，
   两条都指向"正文档 14px"。原来写 13px 会让「已完成，用时 1秒」这一行比源码矮一档
   （逐元素计算样式比对里表现为 fontSize 期望 14px / 实际 13px）。
   .as-a-hd 同时是 .as-round-meta（纯文字行）与 .turnprocess-root（整轮控件）的类，
   所以这一处修正同时作用于两者。 */
/* ⚠ 这里**不再声明 transition**：源码 TurnProcessNodeView.module.css:1 的一条规则里就同时写了
   color 与 `transition: color 100ms ease`；本原型原来把 transition 挪到这条别名规则上，
   两条同特异性规则叠加后走的是本原型的值，逐元素比对于是看到
   transition 期望 "color 100ms ease"（或 none）、实际 "color 0.1s"。
   收起 transition，交给逐字搬入的那条源码规则。 */
.as-a-hd{display:flex;align-items:center;gap:6px;min-height:calc(33px + var(--d-delta));padding:0 0 8px;border-bottom:.5px solid var(--d-border2);
  font-size:var(--dsh-content-font-size,14px);line-height:var(--d-lh-secondary);color:var(--d-label3);margin:16px 0 6px}
.as-a-hd:hover{color:var(--d-label2)}
.as-when{font-variant-numeric:tabular-nums}
.as-meta2{color:inherit}
.as-copy{background:none;border:0;color:inherit;font-size:12px;padding:0 4px;cursor:pointer;
  text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.as-copy:hover{color:var(--d-brand)}
/* ── 过程行：源码 DOM 层级所对应的 CSS（逐字取自下列源码文件，只加模块前缀）─────────
   根因修复：上一版只逐字搬了 CSS、没搬 DOM，`.disclosure-*` / `.toolrow-*` / `.shimmer-*`
   这些选择器一个都命中不了，行距与列对齐全靠下面那套 `.as-act` 自己撑，于是错乱。
   现在 v27 的 processRow() 按源码层级产出这些元素，样式在这里按源码值落位：
     ui-primitives/src/DisclosureRow.module.css:9-111   → .disclosure-*
     ui-tool/src/.../components/ToolRow.module.css:9-320 → .toolrow-*
     ui-primitives/src/TextShimmer.module.css:1-58        → .shimmer-*
     ui-primitives/src/StateDot.module.css:1-100          → .statedot-*
   `.as-act` 保留为外层容器与既有断言的锚点。 */
/* DisclosureRow.module.css:9-14 / ToolRow.module.css:9-12 —— 行根是纵向列 */
.as-act{display:flex;flex-direction:column;width:100%;min-width:0}
/* DisclosureRow.module.css:16-28 —— 头部行内排。
   ⚠ 这里**按已发布的实现取 flex:1 1 auto**，不取本地源码树那一版。
   证据（同一组件的两份产物，环境里的权威实现是下面这份）：
     · 环境 @deepseek-ai/dsh-client-ui-primitives/lib/DisclosureRow.module.css
       —— 只有 .header{display:flex;align-items:center;min-width:0} 和 .row{flex:1 1 auto;…}，
          没有 [data-has-accessory] 那两条。
     · 本地源码树 packages/client/ui-primitives/src/DisclosureRow.module.css:16-28
       —— 多出 .header[data-has-accessory]{gap:8px} 和 .header[data-has-accessory] .row{flex:0 1 auto}。
   实测：照源码树那版，.row 的 flex-basis 退化成 on-content，而里面的 .shimmer-root 是
   inline-grid + width:max-content（TextShimmer.module.css:1-7）—— 两者构成循环依赖，
   行宽塌成 132px，标题/详情/耗时被折成三行（这正是「行距与对齐错乱」的最后一块）。
   取发布版 flex:1 1 auto 后，行宽 = 头部可用宽，标题定宽、详情 FILL 省略、耗时/状态点列对齐。 */
.disclosure-header{display:flex;align-items:center;min-width:0}
/* DisclosureRow.module.css:30-48 —— 24px 行、tertiary→hover secondary、100ms */
.disclosure-row{flex:1 1 auto;position:relative;overflow:hidden;display:flex;align-items:center;
  height:calc(24px + var(--d-delta));min-width:0;color:var(--d-label3);transition:color .1s ease}
.disclosure-row[data-expandable]{cursor:pointer}
.disclosure-row:hover{color:var(--d-label2)}
/* DisclosureRow.module.css:50-76 —— 16 盒 14 图、margin-right 6px（**不是 gap**） */
.disclosure-leading{position:relative;flex:none;width:calc(16px + var(--d-delta));height:calc(16px + var(--d-delta));
  display:inline-flex;align-items:center;justify-content:center;margin-right:6px;padding:0;border:none;
  background:none;color:inherit}
.disclosure-leading svg:not([data-state]){width:calc(14px + var(--d-delta));height:calc(14px + var(--d-delta))}
button.disclosure-leading{cursor:pointer}
.disclosure-iconIdle{display:inline-flex;opacity:1;transition:opacity .1s ease}
.disclosure-chevronHover{position:absolute;inset:0;margin:auto;opacity:0;transition:opacity .1s ease}
.disclosure-row:hover .disclosure-iconIdle{opacity:0}
.disclosure-row:hover .disclosure-chevronHover{opacity:1}
.disclosure-chevron{font-size:11px;line-height:1;color:inherit}
/* TextShimmer.module.css:1-27 —— inline-grid / max-content / 内容 flex 行。
   ⚠ 在 DisclosureRow 的 .row 里额外给 flex:1 1 auto：源码 .row 是 flex:0 1 auto 时
   ToolRow 的 .summary 拿不到 FILL（ToolRow.module.css:35-43 的 flex:1 1 auto 要父级先长开），
   「详情」会停在 max-content 宽、右边留一段空白。给 .row 内的 shimmer 长开，
   详情才按源码 FILL + 省略号，耗时/状态点仍钉在最右列。 */
.disclosure-row .shimmer-root{flex:1 1 auto}
.shimmer-root{position:relative;display:inline-grid;width:max-content;max-width:100%;min-width:0;
  vertical-align:top;color:inherit}
.shimmer-content{display:flex;align-items:center;min-width:0}
.shimmer-text{color:inherit}
/* DisclosureRow.module.css:100-105 + ToolRow.module.css:22-24 —— 标题 13/24、400 */
.disclosure-title,.toolrow-title{flex:none;font-size:var(--d-fs-secondary);line-height:calc(24px + var(--d-delta));
  color:inherit;font-weight:400}
/* ToolRow.module.css:26-33 —— 2×2 分隔点，margin 0 8px */
.toolrow-sep{flex:none;width:2px;height:2px;border-radius:var(--dsw-radius-hairline);margin:0 8px;background:var(--d-caption)}
/* ToolRow.module.css:35-43 —— 摘要 FILL + 省略号，13/24 */
.toolrow-summary{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:var(--d-fs-secondary);line-height:calc(24px + var(--d-delta))}
/* ToolRow.module.css:50-56 —— 尾部片段不参与省略号 */
.toolrow-summarySuffix{flex:none;margin-left:4px;white-space:nowrap;font-size:var(--d-fs-secondary);
  line-height:calc(24px + var(--d-delta))}
/* ToolRow.module.css:107-114 —— 失败摘要用错误色 */
.toolrow-errorSummary{color:var(--d-red)}
/* ToolRow.module.css:117-120 —— 展开体：纵向列 */
.toolrow-bodyWrap{display:flex;flex-direction:column}
/* ToolRow.module.css:126-150 —— Inspect 药丸：自适应内容宽、行内、hover 才出现 */
.toolrow-inspectButton{display:inline-flex;align-self:flex-start;align-items:center;gap:4px;
  margin:4px 0 2px 4px;padding:2px 8px;border:.5px solid var(--d-border3);border-radius:var(--dsw-radius-pill);
  background:var(--d-surface);color:var(--d-label2);font-size:11px;line-height:16px;cursor:pointer;
  opacity:0;transition:opacity .1s ease;corner-shape:round}
.disclosure-root:hover .toolrow-inspectButton,.toolrow-inspectButton:focus-visible{opacity:1}
.toolrow-inspectButton:hover{background:var(--d-hover-solid);color:var(--d-label1)}
/* StateDot.module.css:1-32 —— 10px 槽位 + ::after 的 6px currentColor 核心 */
.statedot-dot{position:relative;display:inline-block;flex:none;width:10px;height:10px}
.statedot-dot::after{content:'';position:absolute;inset:20%;border-radius:50%;background:currentColor;corner-shape:round}
.statedot-dot[data-state='done']{color:var(--d-green)}
.statedot-dot[data-state='warning']{color:var(--d-amber)}
.statedot-dot[data-state='error']{color:var(--d-red)}
.statedot-dot[data-state='idle']{color:var(--d-idle)}
/* StateDot.module.css:37-62 —— 进行中是环 + 呼吸弧（唯一非圆点态） */
.statedot-spinner{flex:none;display:inline-flex;width:10px;height:10px;color:var(--d-label3)}
.statedot-spinnerMotion{transform-origin:center;animation:asStateDotSpin 1.5s linear infinite}
.statedot-spinnerTrack,.statedot-spinnerArc{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.statedot-spinnerTrack{opacity:.25}
.statedot-spinnerArc{stroke-dasharray:12 150;animation:asStateDotDash 1.5s ease-in-out infinite}
@keyframes asStateDotSpin{to{transform:rotate(360deg)}}
@keyframes asStateDotDash{0%{stroke-dasharray:12 150;stroke-dashoffset:0}
  50%{stroke-dasharray:24 150;stroke-dashoffset:-6}100%{stroke-dasharray:12 150;stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){
  .statedot-spinnerMotion,.statedot-spinnerArc{animation:none}
  .statedot-spinnerArc{stroke-dasharray:18 150;stroke-dashoffset:-3}}
/* ChatGroupSeat.tsx:190 的组头外壳（源码是个裸 div，就是折叠控件的挂点） */
.groupseat-headerWrap{display:contents}
.as-acts{display:flex;flex-direction:column;gap:6px;padding:0 0 2px}
/* ⚠ 旧实现（行根自己就是那一行）已被上面的 DisclosureRow 层级取代：
   .as-act 现在是**纵向列的行根**（同源码 .toolrow-root/.disclosure-root），
   行本身是里面的 .disclosure-row。原来那条 `display:flex;align-items:center;gap:6px;
   min-height:24px` 会把「行 + 展开体」并排成一行、并给两者都加 6px 沟 —— 这正是行距/对齐错乱的
   直接来源，所以在这里删掉。`.as-ico / .as-st / .as-dot2 / .as-ms / .as-det` 只保留为
   既有断言的锚点与兼容别名（新 DOM 用的是源码类名）。 */
.as-ico{align-items:center;justify-content:center}
.as-lab{font-weight:400;color:inherit}
.as-det{color:inherit}
.as-ms{color:var(--d-label3);font-variant-numeric:tabular-nums}
.as-st{width:10px;height:10px;flex:0 0 10px;display:inline-flex;align-items:center;justify-content:center}
.as-st i{width:6px;height:6px;border-radius:50%;background:var(--d-idle);corner-shape:round}
.as-st.done i{background:var(--d-green)}
.as-st.warn i{background:var(--d-amber)}
.as-st.err i{background:var(--d-red)}
/* 进行中 = 旋转环（StateDot 的 ongoing），与 warning 分开 */
.as-st.run i{width:9px;height:9px;background:transparent;border:1.5px solid var(--d-brand);
  border-top-color:transparent;animation:asSpin .8s linear infinite}
@keyframes asSpin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.as-st.run i{animation:none}}
/* 单次调用行：整行可点开合，hover 给底色（tool__ToolRow） */
.as-call{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left}
.as-call:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
/* 滚动条 5px（--dsh-scrollbar-width，theme README:86） */
.as-view ::-webkit-scrollbar,.as-view::-webkit-scrollbar{width:5px;height:5px}
.as-view ::-webkit-scrollbar-thumb{background:var(--d-border3);border-radius:var(--dsw-radius-xs)}
.as-view ::-webkit-scrollbar-track{background:transparent}
.as-w{font-size:10.5px;color:var(--dsw-static-white);background:var(--d-amber);border-radius:var(--d-r-xs);padding:0 4px;line-height:15px}
.as-act.is-fail,.as-act.is-fail .as-lab,.as-fail{color:var(--d-red)}
.as-fail{font-size:12px}
.as-more{background:none;border:0;color:var(--d-brand);font-size:12.5px;cursor:pointer;padding:2px 0;text-align:left}
/* Assistant 回复（chat__AssistantMarkdown.css:5-16 + flow gap 12）：14 / 24 行高 */
.as-prose{font-size:var(--d-fs);line-height:var(--d-lh-body);color:var(--d-label1);padding:12px 0 0;white-space:pre-wrap;word-break:break-word}
.as-prose.bad{color:var(--d-red)}
.as-adj{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.as-adj-tag{font-size:12px;line-height:18px;color:var(--d-brand);background:var(--d-bubble);border-radius:var(--d-r-sm);padding:2px 8px}
.as-adj-one{font-size:12.5px;line-height:18px;color:var(--d-label2);background:var(--d-module);border-radius:var(--d-r-sm);padding:3px 9px}
.as-need{margin-top:12px;font-size:12.5px;line-height:19px;color:var(--dsw-alias-state-warn-ink);background:var(--dsw-alias-state-warn-tertiary);border-radius:var(--d-r-sm);padding:7px 10px}
/* 任务条（conversation__TodoPanel.css:5-99）：16 圆角、菜单底 + 磨砂、行 .5px 分隔、标题行按钮
   画线改法（对齐 dsh 浮起面板规矩）：源码 .root 是 `border: 0` + 菜单底 + elevation 描边，
   不用实边框画线（docs/web-styling.md：elevated surface 不得把 border-* 与 lv/elevation 阴影并用）。
   这里把原来的 .5px 实边框换成 box-shadow 的 0.5px 描边，底由 --d-module 换成 --dsw-specific-menu。 */
.as-tasks{display:flex;align-items:center;gap:10px;width:100%;font-size:13px;background:var(--dsw-specific-menu);
  border:0;box-shadow:0 0 0 .5px var(--d-border1);border-radius:var(--d-r-lg);padding:6px 12px;margin:12px 0 8px;cursor:pointer;text-align:left}
.as-tasks:hover{background:var(--d-hover-solid)}
.as-tasks-ico{display:inline-flex;color:var(--d-label2)}
.as-tasks b{font-size:13px;line-height:24px;font-weight:500;color:var(--d-label1)}
.as-tasks-prog{flex:auto;min-width:0;font-size:13px;line-height:20px;color:var(--d-label3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.as-tasks-prog .warn{color:var(--d-amber)}
.as-caret{color:var(--d-label3);flex:none}
.as-task-list{display:flex;flex-direction:column;gap:8px;max-height:180px;overflow:auto;padding:2px 12px 10px;
  border:0;box-shadow:0 0 0 .5px var(--d-border1);border-radius:0 0 var(--d-r-lg) var(--d-r-lg);margin:-8px 0 8px}
.as-task-row{display:flex;align-items:center;gap:10px;font-size:13px;line-height:20px;color:var(--d-label2)}
.as-task-row.done{color:var(--d-label3)}
.as-task-nm{color:var(--d-label1);white-space:nowrap}
.as-task-tp,.as-task-du{color:var(--d-label3);font-variant-numeric:tabular-nums;font-family:var(--d-mono);font-size:12px}
.as-task-ft{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--d-label3)}
/* 任务条 / 任务清单**搬进 composer 的 .as-c-dock** 之后的收紧（dock 只留 2px 沟，见输入条分段）：
   原来那套「独立成条」的外边距（上 12 / 下 8）会与 dock 的节奏打架、把 dock 从 ~98px 顶到 114px；
   这里按 2/4 收敛。配对的 .as-task-list 负上边距同步从 -8 收到 -4，
   保持「任务条下边 → 清单上边」贴合的原设计（4 + (-4) = 0）。 */
.as-c-dock>.as-tasks{margin:2px 0 4px}
.as-c-dock>.as-task-list{margin:-4px 0 4px}
/* 停止按钮：随所属行一起收成 11px 级的小按钮（原 12/18 + 2px 8px 是它单独一条时的规格）。
   现在它挂在 .as-c-live（composer 下方 11/18 小字行）里，尺寸必须与那行同档，否则会把行高顶开。 */
.as-stop{background:none;border:.5px solid var(--d-border2);border-radius:var(--d-r-sm);font-size:11px;line-height:16px;
  color:var(--d-label2);padding:1px 6px;cursor:pointer}
.as-stop:hover{border-color:var(--d-red);color:var(--d-red)}
.as-stop.armed{border-color:var(--d-red);color:var(--dsw-static-white);background:var(--d-red)}
.as-stop.armed::after{content:' · 3s 内再点一次'}
/* 输入条 —— 按 InputBar.module.css 分层（这一版修的根因：按钮条/键盘提示/权限档/口径说明
   全挤在一个 flex 行里，于是互相挤压换行怪异）。
   源码对应（packages/client/ui-conversation/src/client/skeleton/InputBar.module.css）：
     .root   :2-11    padding 0 <side-clearance> 4px，纵向列
     .card   :45-77   radius panel、background specific-input-major、box-shadow elevation-soft、gap 12、padding-top 8
     .scroll :128-134 max-height、overflow-y auto、margin-right 4
     .input  :169-185 min-height 36、padding 4px 8px 0 14px、outline none、caret business-primary
     .placeholder :213-222 inset 4px 8px auto 14px、nowrap + 省略号
     .row    :251-267 flex wrap、space-between、gap 12、padding 2px 8px 6px、container-type inline-size
     .tools  :285-287 gap 12 / .modes :289-291 gap 12 / .trailing :293-302 margin-left auto、gap 12
     .add    :314-326 28×28 圆形 / .select :339-358 高 28 / .primary :372-391 34×34、translateY(-2px)
     .dock   :13-20  辅助层：padding-top 4、gap 12（与 .row **分开**）
   本原型自创的「投递方式 / 键帽 / 口径」放进 .as-c-dock，各自独立成行。 */
/* 2026-10-17：**去掉 composer 容器的矩形渐隐背景**。改前 .as-composer 有一层
   linear-gradient(rgba(255,255,255,.6),#fff 34%) 且 radius:0 —— 它在圆角卡片（28px）外面
   围出一个 736×206 的**方形**（上探 8px、下包 dock 100px），就是用户看到的「圆角外面有方形卡片」。
   dsh 的 .composerSeat **没有任何背景**（ConversationRoot.module.css:346-357 只有 flex 与
   --dsh-composer-text-max-height:336px）；"内容滚到输入条下面"由 .scrollBody:has(
   [data-conversation-composer-overlay]) 给**滚动体**加遮罩解决，而不是在卡片背后垫矩形。 */
.as-composer{position:sticky;bottom:0;z-index:7;display:flex;flex-direction:column;align-items:center;
  padding-top:8px}
.as-c-box{position:relative;box-sizing:border-box;display:flex;flex-direction:column;width:100%;gap:12px;
  border:0;border-radius:var(--d-r-panel);padding:8px 12px 0;background:var(--d-surface);
  font-size:14px;line-height:24px;
  box-shadow:0 0 0 .5px var(--d-border2),var(--dsw-elevation-soft)}
/* 草稿滚动口：唯一滚动盒（InputBar.module.css:128-134） */
.as-scroll{max-height:336px;overflow-y:auto;margin-right:4px}
.as-grow{position:relative}
/* 可编辑面：outline:none —— **不画整框 focus ring**（缺陷 7）。
   源码 InputBar.module.css:181 就是 `outline: none`；键盘聚焦态由容器化的
   描边/光标/发送按钮的 focus-visible 表达，不在这块面上套 2px 蓝框。 */
.as-input{display:block;width:100%;box-sizing:border-box;min-height:36px;padding:4px 8px 0 14px;
  border:0;outline:none;resize:none;font-family:var(--dsw-font-family);font-size:inherit;line-height:inherit;
  color:var(--d-label1);background:transparent;white-space:pre-wrap;word-break:break-word;
  overflow-wrap:anywhere;caret-color:var(--d-brand)}
.as-input:focus,.as-input:focus-visible{outline:none;border:0;box-shadow:none}
/* 键盘聚焦态走容器（对齐 dsh focus.css:10-21）：容器内有 :focus-visible 元素才画 2px 品牌环，
   鼠标操作时不亮环；不在输入面外圈套框（缺陷 7）。卡片自身的 .5px 描边与 elevation 阴影保持不变。
   颜色令牌与原来的 1px 环等值（--dsw-alias-state-business-primary = --d-brand），只是规格由
   1px box-shadow 换成 dsh 的 2px outline。 */
.as-c-box:has(:focus-visible){outline:2px solid var(--dsw-alias-state-business-primary);outline-offset:2px}
/* 旧内核不支持 :has() 时的降级：退回容器聚焦态（无法区分键盘/鼠标，已登记取舍）。 */
@supports not selector(:has(*)){
  .as-c-box:focus-within{outline:2px solid var(--dsw-alias-state-business-primary);outline-offset:2px}
}
.as-input::placeholder{color:var(--d-caption)}
/* 占位：镜像 .input 的内距（缺陷 10）。
   源码写的是 `inset: 4px 8px auto 14px`（InputBar.module.css:215）—— 四个值里含 auto，
   而 `inset` 这个简写在部分解析器上会被整条丢弃（本机 Edge 实测：inset 命中、top/bottom 落空）。
   这里改成四条长手声明，语义与源码逐字对应（top 4 / right 8 / bottom auto / left 14），不依赖简写支持。 */
.as-ph{position:absolute;top:4px;right:8px;bottom:auto;left:14px;font-size:14px;line-height:24px;color:var(--d-caption);
  pointer-events:none;user-select:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 按钮条 .row（InputBar.module.css:251-267） */
.as-c-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;
  padding:2px 8px 6px;min-width:0;box-sizing:border-box}
.as-c-tools,.as-c-modes,.as-c-trailing{display:flex;align-items:center;min-width:0}
.as-c-tools{gap:12px}
.as-c-modes{gap:12px}
.as-c-trailing{flex:none;margin-left:auto;gap:12px}
/* + 圆形 28×28（InputBar.module.css:314-326） */
.as-plus{display:grid;place-items:center;flex:none;box-sizing:border-box;width:28px;height:28px;border:0;
  border-radius:var(--dsw-radius-pill);background:var(--d-module);color:var(--d-label1);cursor:pointer;line-height:1;font-size:16px;
  corner-shape:round}
.as-plus:hover{background:var(--d-hover-solid)}
/* 选择器 chip（InputBar.module.css:339-358 的 .select）：高 28、13/20 500 secondary */
.as-perm,.as-model{display:inline-flex;align-items:center;gap:4px;box-sizing:border-box;height:28px;
  border-radius:var(--d-r-sm);font-size:13px;line-height:20px;font-weight:500;color:var(--d-label2);
  background:transparent;padding:0 20px 0 8px;cursor:pointer;white-space:nowrap;max-width:220px;overflow:hidden}
.as-perm:hover,.as-model:hover{background:var(--d-hover)}
.as-perm i,.as-model i{color:var(--d-caption);font-style:normal;font-size:12px}
/* 发送 34×34 圆（InputBar.module.css:372-391）：translateY(-2px) 是源码给按钮条 2px 上移的补偿 */
.as-send{display:grid;place-items:center;flex:none;box-sizing:border-box;width:34px;height:34px;border:0;
  border-radius:var(--dsw-radius-pill);background:var(--d-brand);color:var(--dsw-static-white);cursor:pointer;corner-shape:round;
  transition:background-color .1s ease;transform:translateY(-2px)}
.as-send:hover{background:var(--dsw-alias-button-info-hover)}
.as-send:focus-visible{outline:2px solid var(--d-brand);outline-offset:2px}
/* 辅助说明层 .dock（InputBar.module.css:13-20）：与按钮条分开的独立层。
   收成 dsh 的节奏：纵向 2px 沟、只留 4px 上边距 —— 三行小字（运行状态 / 投递方式+键帽）
   不再各自撑开 4px 沟 + 20px 行高。 */
/* composer 内的运行状态行（新增，替代原来钉在 .as-view 底座的 .as-live-bar）：
   规格对齐 dsh composer 下方的小字行（11/18、三级灰）；.as-live-bar 保留为别名，
   两个类名命中同一条规格，DOM 用哪个都不会漏。 */
.as-c-live,.as-live-bar{display:flex;align-items:center;gap:8px;font-size:11px;line-height:18px;color:var(--d-label3);padding:2px 0}
/* 2026-10-17：dock 改成**一行居中**（dsh InputBar.module.css 的 .dock：display:flex;
   align-items:center;justify-content:center;gap:12px;max-width:100%;padding-top:4px）。
   改前是 flex-direction:column 的竖排，且 ContextMeter 塞在卡片按钮条里；dsh 的 dock 是
   **一行三颗**：activity pill + usage pill + ContextMeter 环（InputBar.tsx:520-524）。 */
.as-c-dock{display:flex;align-items:center;justify-content:center;gap:12px;max-width:100%;padding-top:4px;flex-wrap:wrap}
/* 统计 pill：逐字搬 dsh StatsPills.module.css 的 .pill（inline-flex / gap 6 / padding 1px 8px /
   半径 999 / 透明底 / 三级灰 / 12px·20px / tabular-nums / nowrap） */
.as-stat{display:inline-flex;align-items:center;gap:6px;box-sizing:border-box;max-width:100%;
  padding:1px 8px;border:none;border-radius:999px;corner-shape:round;background:transparent;
  color:var(--d-label3);font-size:12px;line-height:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
/* 原 .as-c-help（投递方式切换 + 键帽提示）已于 2026-10-17 删除：dsh 的 .dock 只有 TodoPanel 与
   ContextMeter（InputBar.tsx:520-524）。随它一起死掉的 .as-sw* / .as-deliv / .as-kbd 也一并清除；
   投递方式仍由 ⌘/Ctrl+Enter 与 /delivery 指令切换，发送钮标签同步显示（排队发送/插话发送）。 */
.as-mode-b{background:none;border:.5px solid var(--d-border1);border-radius:var(--dsw-radius-pill);font-size:11.5px;line-height:18px;
  color:var(--d-label2);padding:3px 10px;cursor:pointer;corner-shape:round}
.as-mode-b:hover{background:var(--d-hover)}
.as-mode-b.on{background:var(--d-bubble);border-color:var(--d-brand);color:var(--d-brand)}
/* 口径说明（原 .as-c-note）**整条样式已删**：该件不再渲染（口径已并入页脚 meta-bar）。
   对应选择器与规则一并移除，不留死规则。 */
/* 右栏三块**不是浮层，是列内分区**（dsh 的"浮起面用 elevation stroke、不用实边框"只管
   对话流里的浮起件）。这里按 dsh 右栏 tab 面板的做法：去整圈描边 / 圆角 / 白卡底，
   只留「分区标题 + 0.5px 分隔线」，让三块读成**一栏里的三个小节**，而不是三张卡。
   ⚠ 改前是 box-shadow 0 0 0 .5px + radius md + --d-surface 白卡（上一轮的做法）。 */
.as-side-p{border:0;border-bottom:.5px solid var(--d-border1);border-radius:0;background:transparent}
.as-side-hd{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--d-label2);
  padding:6px 0;border:0;border-bottom:.5px solid var(--d-border1);background:transparent}
.as-side-hd .muted{font-weight:400;color:var(--d-label3);font-size:11.5px}
.as-cnt{font-size:11px;color:var(--d-label2);background:var(--d-surface);border-radius:var(--dsw-radius-pill);padding:1px 7px;corner-shape:round}
/* 去卡后内距同步归零横向 12px —— 否则标题贴在 x=0、正文缩进 12px，一眼歪。 */
.as-side-b{padding:8px 0 4px}
.as-side-empty{font-size:12.5px;color:var(--d-label3);text-align:center;padding:18px 6px;line-height:1.7}
.as-side-ft{padding:0 0 10px}
.as-chg{display:flex;align-items:baseline;gap:8px;font-size:12.5px;padding:4px 0;color:var(--d-label1)}
.as-chg span{color:var(--d-label3);font-size:11.5px}
.as-chg i{margin-left:auto;font-style:normal;color:var(--d-label3);font-size:11.5px;font-family:var(--d-mono)}
.as-link{background:none;border:0;color:var(--d-brand);font-size:12px;cursor:pointer;padding:0}
.as-link.muted{color:var(--d-label3)}
.as-link:hover{text-decoration:underline}
.as-pend{border:0;box-shadow:0 0 0 .5px var(--d-border1);border-radius:var(--d-r-sm);padding:8px 10px;margin-bottom:8px}
.as-pend-hd{display:flex;align-items:center;gap:7px;font-size:12.5px}
.as-pend-sub{font-size:11.5px;color:var(--d-label3);padding:4px 0 7px}
.as-pend-ft{display:flex;gap:12px}
.as-hint-i{display:flex;flex-direction:column;gap:3px;padding:7px 0;border-bottom:1px dashed var(--d-border1);font-size:12.5px;color:var(--d-label1)}
.as-hint-i:last-child{border-bottom:0}
.as-hint-i i{font-style:normal;font-size:11px;color:var(--d-label3)}
.as-hint-r{font-size:11px;color:var(--d-brand)}
/* 轨迹（trajectory__TrajectoryToolbar.css + TrajectoryTimeline.css:5-168）：
   工具条按钮 20px 高 / 12px 字；口径是**开关**（轨道 20×10 + 6px 圆点）；概览 50px、刻度列 44px、泳道行高 14px、色块 8px 圆角 1 */
.as-traj-hd{display:flex;align-items:center;gap:8px;border-bottom:.5px solid var(--d-border2);margin-bottom:12px;
  padding:6px 6px 10px;position:sticky;top:0;z-index:4;background:var(--d-surface)}
/* 轨迹屏工具栏搜索框：几何已由逐字搬入的 .trajbar-search 承载
   （TrajectoryToolbar.module.css:158-178：flex 0 1 164px / min-width 84 / height 22 /
    padding 0 6px / gap 4px / .5px 描边 / label-caption 色）。
   这里只留本原型自己的内部件样式，**不再覆写** gap/color/padding/border ——
   原来 .as-search 的 gap:5px + label-tertiary 把源码的 4px 与 caption 色盖掉了
   （逐元素比对里 trajbar-search 的 gap 与 color 两项直接命中）。 */
.as-search{display:inline-flex;align-items:center;font-size:12px;line-height:18px}  border:.5px solid var(--d-border2);border-radius:var(--d-r-sm);background:var(--d-module);padding:2px 12px;min-width:120px}
.as-traj-body{display:grid;grid-template-columns:minmax(180px,240px) minmax(0,1fr);gap:16px;align-items:start}
.as-traj-list{display:flex;flex-direction:column;gap:2px;max-height:420px;overflow:auto}
.as-tl{display:flex;flex-direction:column;gap:2px;text-align:left;background:none;border:0;border-radius:var(--d-r-sm);
  padding:6px 8px;cursor:pointer;font-size:12px;line-height:18px;color:var(--d-label3)}
.as-tl b{color:var(--d-label1);font-size:12px;font-weight:600}
.as-tl.on{background:var(--d-bubble)}
.as-tl.on b{color:var(--d-brand)}
.as-traj-chart{min-width:0;display:flex;flex-direction:column;gap:0}
.as-lanes{background:var(--d-module);border:.5px solid var(--d-border2);border-radius:var(--d-r-sm);padding:7px 0}
.as-lane{display:grid;grid-template-columns:44px minmax(0,1fr);align-items:center;height:14px}
.as-lane-n{font-size:10px;line-height:1;color:var(--d-label3);text-align:right;padding-right:8px;
  border-right:.5px solid var(--d-border1);height:100%}
.as-lane-t{position:relative;height:100%}
.as-lane-t i{position:absolute;top:3px;height:8px;border-radius:var(--dsw-radius-hairline);min-width:2px;display:block;opacity:.78}
.as-lane-t i.on,.as-lane-lg i.on{outline:2px solid var(--d-brand);outline-offset:1px}
.as-traj-note{font-size:11px;line-height:16px;color:var(--d-caption);padding:0 0 8px}
.as-traj-sel{font-size:11.5px;color:var(--d-brand);padding:0 0 6px}
.as-lane-t i.k-start{background:var(--d-brand)}
.as-lane-t i.k-llm{background:color-mix(in srgb,var(--dsw-alias-button-info-fill) 60%,var(--dsw-alias-state-error-secondary))}
.as-lane-t i.k-tool{background:var(--d-warn)}
.as-lane-t i.k-guard{background:color-mix(in srgb,var(--dsw-static-green-500) 68%,var(--dsw-alias-label-secondary))}
.as-lane-t i.is-fail{background:var(--d-red);opacity:1}
.as-lane-lg{display:flex;gap:12px;font-size:11px;color:var(--d-label3);padding-top:8px;flex-wrap:wrap}
.as-lane-lg i{width:9px;height:9px;border-radius:var(--dsw-radius-hairline);display:inline-block;margin-right:4px;background:var(--d-brand);vertical-align:-1px}
.as-lane-lg i.k-llm{background:color-mix(in srgb,var(--dsw-alias-button-info-fill) 60%,var(--dsw-alias-state-error-secondary))}
.as-lane-lg i.k-tool{background:var(--d-warn)}
.as-lane-lg i.k-guard{background:color-mix(in srgb,var(--dsw-static-green-500) 68%,var(--dsw-alias-label-secondary))}
.as-lane-lg i.is-fail{background:var(--d-red)}
/* ── 轨迹页：列筛选器 + 时间条（对齐 dsh 轨迹视图）──────────────────────────
   预置给 v27-agent-session.js 新产出的 DOM（类名已冻结）：.as-traj-filters / .as-tf /
   .as-traj-gantt / .as-tg-bar。分隔线沿用本屏既有画法（.as-traj-hd 同用 border-bottom
   + --d-border2），颜色全部走本屏既有令牌（--d-*），不新造色值。 */
.as-traj-filters{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:.5px solid var(--d-border2)}
.as-tf{border:0;background:transparent;font-size:13px;line-height:20px;color:var(--d-label2);cursor:pointer;padding:2px 6px;border-radius:var(--d-r-sm)}
.as-tf:hover{background:var(--d-hover)}
/* 选中态不用品牌蓝（那是"当前项"的语义，这里是"开启/关闭"），用正文色 + 后面的小符号
   （.as-tf i）表示，与 dsh 轨迹视图的 ⊟ 语义一致。 */
.as-tf.on{color:var(--d-label1)}
.as-tf i{font-style:normal;opacity:.5;margin-left:4px}
/* off 态小符号变淡：DOM 不变（<i>⊟</i> 常显），开关语义靠这一行 + 上一行的 color 变化表达 */
.as-tf:not(.on) i{opacity:.28}
/* v41：事件时间轴 = **三条泳道**（几何逐条照 dsh TrajectoryTimeline.module.css:25-51 / 118-171）。
   dsh 的取值：标签列高 8、top 7/21/35（行距 14）、轨道 span 高 8、`top: lane*14px`、
   整条含上下各 7px 留白 = 50px；轮次边界是贯穿的 0.5px 竖线（border-l2）。
   改前本原型是一条 22px 的单轨、所有 bar 都 top:0 —— 于是几十个 span 全叠在一行里，
   看上去是一排互相压着的花块（业主截图的"轨迹异常"之一）；idle 灰条也是自创的，
   dsh 在时间档是**压缩空闲**，空隙就是空白，不画色块。 */
/* 时间轴整条用我们自己的模块底色（--d-module = #f5f6f7），不要那块白 ——
   白底贴着下面的白表格，看起来像"这里没渲染"；换成模块灰后才像一块画布。 */
.as-traj-gantt{display:flex;gap:8px;margin:6px 0 10px;padding:0 6px 0 0;
  background:var(--d-module);border-radius:var(--d-r-sm)}
/* 标签列照 dsh：44px + 右细线（TrajectoryTimeline.module.css:21-55：labels 44px / border-right .5px / 字号 10） */
.as-tg-labels{position:relative;flex:none;width:44px;height:50px;box-sizing:border-box;
  border-right:.5px solid var(--dsw-alias-border-l1)}
.as-tg-labels span{position:absolute;right:3px;height:8px;line-height:8px;font-size:10px;color:var(--d-label3)}
.as-tg-labels span:nth-child(1){top:7px}
.as-tg-labels span:nth-child(2){top:21px}
.as-tg-labels span:nth-child(3){top:35px}
/* 画布（dsh TrajectoryTimeline.module.css:16-25）：plot 自带 layer-2 底色 —— 这正是"空白"
   看起来像画布、而不是像没渲染出来的关键；光标十字（track cursor:crosshair）。
   ⚠ 本原型的 bg-layer-1/2/3 三个令牌都被压成了 #fff（见 dsh-tokens 段），直接用 layer-2 等于没底色，
   所以这里用「label-tertiary 5% 混 surface」现算一个中性底色，深浅色主题都成立。 */
.as-tg-plot{position:relative;flex:1;min-width:0;height:50px;overflow:hidden;
  background:transparent;cursor:crosshair}
/* ── 时间轴像剪辑软件的那三件（dsh TrajectoryTimeline：playhead / draftRange / viewport）──
   游标竖线跟手走；框选是一块半透明带左右边界；右上角小标显示当前缩放倍数与选中条数。 */
.as-tg-playhead{position:absolute;top:0;bottom:0;left:calc(var(--x) * 1%);width:1px;
  background:var(--d-brand);opacity:.6;pointer-events:none;z-index:2}
.as-tg-selbox{position:absolute;top:0;bottom:0;left:calc(var(--a) * 1%);
  width:calc((var(--b) - var(--a)) * 1%);pointer-events:none;z-index:1;
  background:color-mix(in srgb,var(--d-brand) 16%,transparent);
  border-left:1px solid var(--d-brand);border-right:1px solid var(--d-brand)}
.as-tg-selbox[hidden],.as-tg-playhead[hidden]{display:none}
.as-tg-zoomtag{position:absolute;right:0;top:-2px;z-index:3;pointer-events:none;
  font-size:10px;line-height:16px;color:var(--d-label3);background:var(--d-surface);
  border:.5px solid var(--d-border2);border-radius:var(--d-r-sm);padding:0 6px}

/* 轮次分隔：贯穿整条轨的 0.5px，压在 span 之下（pointer-events:none 免得挡 tooltip） */
.as-tg-turn{position:absolute;top:0;bottom:0;left:calc(var(--x) * 1%);width:.5px;background:var(--d-border2);pointer-events:none}
.as-tg-bar{position:absolute;top:calc(7px + var(--lane) * 14px);height:8px;border-radius:1px;
  left:calc(var(--x) * 1%);width:max(2px,calc(var(--w) * 1% - 1px))}
/* 右侧让 1px = dsh 的 --trajectory-span-gap（min(width*8%, 1px)：两端各让一次）——
   同轮内相邻 span 首尾相接（SPAN_GAP_MS 很小），不让缝的话同色的会粘成一根长条，
   看不出"这里其实是 7 次工具调用"。宽度用 max(2px, …) 兜住极短 span（dsh 的 min-width:2px）。 */
/* 配色照 dsh：工具 = state-warn-label（琥珀）、模型/输入 = label-secondary 0.78、
   失败 = error-primary。原来 tool 用品牌蓝、llm 用绿，是自配色，与 dsh 不同。 */
.as-tg-bar[data-kind="io"]{background:var(--d-brand);opacity:.78}
.as-tg-bar[data-kind="llm"]{background:var(--d-label2);opacity:.78}
.as-tg-bar[data-kind="tool"]{background:var(--d-warn)}
.as-tg-bar[data-kind="error"]{background:var(--d-red)}
/* 时间轴条可点（点一下定位到账本那一行）：给出手型光标与 hover 反馈，
   定位后那一行闪一下，免得用户不知道跳到哪去了 */
/* 框选后，没被框中的条降到 0.2（dsh .span[data-selected='false']{opacity:.2}） */
.as-tg-bar[data-dim]{opacity:.2}
.as-tg-bar[data-act]{cursor:pointer}
.as-tg-bar[data-act]:hover{filter:brightness(1.15);box-shadow:0 0 0 1px var(--dsw-alias-bg-base),0 0 0 2px var(--d-brand)}
.as-tt tbody tr.as-tt-flash>td{background:color-mix(in srgb,var(--d-brand) 10%,transparent)}
/* 焦点环（theme__focus.css）：2px business-primary */
/* ⚠ 缺陷 7：这条通用规则以前给**输入条的 textarea** 也画了 2px 蓝框，源码里输入面是
   `outline: none`（InputBar.module.css:181）。这里把输入面排除掉 ——
   键盘聚焦态按源码做法改由**卡片描边**表达（.as-c-box:focus-within，见输入条分段）。 */
.as-view button:focus-visible{outline:2px solid var(--d-brand);outline-offset:2px}
.as-view textarea:focus-visible:not(.as-input){outline:2px solid var(--d-brand);outline-offset:2px}
/* 「本次会话」运行状态行的**定位**已搬到 composer 的 .as-c-dock
   （规格见上面的 .as-c-live / .as-live-bar 那条）。
   这里不再钉底部座位、不再限宽 —— 原来的 `max-width + margin:6px auto 0 + padding:0 4px`
   是它在 .as-view 底座当独立条时的几何，留着会与 dock 的 2px 沟叠加、把行顶开。 */
.as-live-bar b{font-size:11px;font-weight:600;color:var(--d-label2)}
.as-run-dot{width:8px;height:8px;border-radius:50%;background:var(--d-idle);flex:0 0 8px;corner-shape:round}
.as-run-dot.run{background:var(--d-green);box-shadow:0 0 0 3px var(--dsw-alias-state-success-tertiary);animation:asPulse 1s ease-in-out infinite alternate}
@keyframes asPulse{from{opacity:.35}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.as-run-dot.run{animation:none}}
.as-hint-state{font-size:11px;color:var(--d-label3);padding-top:4px}
/* 排队坞（DSH conversation__QueueDock）：仅上圆角 16、菜单底 + 磨砂、行间 1px 分隔 */
.as-dock{border:.5px solid var(--d-border1);border-bottom:0;border-radius:var(--d-r-lg) var(--d-r-lg) 0 0;
  background:var(--dsw-alias-fill-empty);-webkit-backdrop-filter:blur(40px) saturate(150%);backdrop-filter:blur(40px) saturate(150%);
  padding:4px 12px 6px;margin-bottom:-6px}
.as-dock-hd{display:flex;align-items:center;gap:10px;height:36px;font-size:13px;line-height:24px;color:var(--d-label3)}
.as-dock-hd b{font-size:13px;color:var(--d-label1);font-weight:500}
.as-qrow{display:flex;align-items:center;gap:10px;min-height:36px;font-size:12.5px;
  box-shadow:inset 0 1px 0 var(--d-border1);padding:4px 0 4px 12px}
.as-qbtn{width:28px;height:28px;flex:0 0 28px;border:0;border-radius:var(--dsw-radius-pill);background:transparent;color:var(--d-label3);
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;corner-shape:round}
.as-qbtn:hover{background:var(--d-hover-solid);color:var(--d-label1)}
.as-dock-list{max-height:180px;overflow:auto}
.as-qrow textarea{flex:1;font:inherit;font-size:12.5px;line-height:18px;border:.5px solid var(--d-border2);
  border-radius:var(--d-r-sm);padding:4px 8px;resize:none;background:var(--d-surface);color:var(--d-label1)}
.as-qtext{flex:1;min-width:0;color:var(--d-label1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.as-qstate{font-size:11px;color:var(--d-caption);flex:none}
/* 原 .as-deliv / .as-kbd / .as-kbd kbd 随 .as-c-help 一并删除（2026-10-17），见 .as-c-dock 处注释 */
.as-grow{flex:1}
.as-dm{display:inline-flex;align-items:center;gap:2px}
.as-pmlist{display:flex;flex-direction:column;gap:6px;padding:4px 0 10px}
.as-pmrow{display:flex;align-items:flex-start;gap:8px;border:.5px solid var(--d-border1);border-radius:var(--d-r-sm);padding:8px 10px;cursor:pointer}
.as-pmrow.on{border-color:var(--d-brand);background:var(--dsw-specific-bubble)}
.as-pmrow b{font-size:13px;color:var(--d-label1);font-weight:600}
.as-pmrow em{display:block;font-style:normal;font-size:11.5px;color:var(--d-label3);padding-top:2px}
.as-risk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--d-label2);padding:2px 0 6px}
/* 轮次轨道（chat__TurnNavigator.css:19-93）：28px 宽、刻度 20×2px 圆角 2px；正文 ≤900px 隐藏（按容器宽） */
/* 轮次轨道挂点（TurnNavigator.module.css:2-15 的 .slot）：满宽、top:0、两侧留出
   「输入条侧边余量 + 16px」，并且**它自己就是那个 inline-size 容器** ——
   源码的 @container (max-width:900px) 查的就是它。这里同时给它容器名，
   好在 dsh-verbatim 段里用具名容器查询写隐藏规则（源码是匿名容器查询）。 */
.as-feed-wrap{position:relative;container-type:inline-size;container-name:dsh-chat-frame}
/* ⚠ 轨道挂点的几何（本原型特有的一处适配，源码的父级不同）：
   逐字搬入的 .turnnav-slot 写的是 `position:absolute; top:0; right:0; left:0; height:0`
   （TurnNavigator.module.css:2-15）—— 它假设父级给了带高度的定位上下文，
   所以槽位自身高度为 0、由 .frame 的 top/bottom 去撑。而本原型的宿主 .as-feed-wrap 是
   `position:relative` 且高度随正文增长（3291px），照抄的结果是：
   槽位高 0 → .frame 虽写 width:28px 也塌成 0×0 → 8 个刻度全在 0 高度里，
   一个都画不出来（这正是"轮次轨道刻度"取不到几何的原因）。
   这里把槽位改成**覆盖正文列竖直中轴的一段固定高度带**：
   高度 = 视口 - 输入条预留，top 居中，左/右按输入条余量让位，
   于是 .frame 的 top:calc(band/2)+translateY(-50%) 正常落位，刻度按 10px 间距排开。 */
.as-rail{position:absolute;display:block}
.as-rail-slot{
  /* top:50% 是本原型对槽位挂点的一处显式适配（源码父级给高度、我们是覆盖层），
     已在差异清单登记；其余几何由逐字搬入的 .turnnav-* 决定。 */
  top:50%;
  height:calc(100dvh - var(--dsh-composer-height, 152px) - 160px);
  min-height:120px;
  transform:translateY(-50%);
}
/* 槽位宽度回正到源码的 80px（源码 .tagSlot: width 80px）；表头/数据行同宽，列才对齐。 */
.as-rail{position:absolute;display:block}
.turnnav-slot{pointer-events:none}
.turnnav-mark[data-fail="1"]::before{background:var(--dsw-alias-state-error-primary)}
/* 自创泳道的出处标注 */
.as-traj-lanes-note{font-size:11px;line-height:16px;color:var(--dsw-alias-label-caption);padding:10px 4px 4px}
.as-traj-details{flex:none}
.as-kv-list{display:flex;flex-direction:column;gap:4px;padding:10px 14px}
/* 表头 / 标签槽的既有类名挂到源码的列结构上（TrajectoryCell.module.css:22-47）：
   序号列 24px、标签槽 80px、标签 22px、尾部 320px（4×71 + 3×12）。
   尾部宽度照源码写死 320（原先 235）：尾部一变窄，.trajcell-text 的 flex 分配就与源码不同，
   省略号也会在奇怪的位置截断。行根补 flex:1 1 auto，让 .text 拿到源码的 FILL。 */
.as-tt .trajcell-tagSlot{width:80px;height:22px}
.as-tt .as-tt-k{height:30px;width:80px}
.as-tt .trajcell-root{flex:1 1 auto}
.as-tt .trajcell-trailing{width:320px}
.as-tt .as-tt-ms{text-align:left}
/* 账本字号照源码：TrajectoryTable.module.css:97-105 的 .table 是 `font: var(--dsw-font-xxs-12)`
   = 12px/18px，表头 th 同（:125）。本原型原来写 13px/22px，整张表比源码大一号。 */
.as-tt{font-size:12px;line-height:18px}
/* 轨迹屏在 .as-view 里的高度链：view → 账本外壳 → split → tablePane。
   源码的 views.module.css:8 / TrajectoryTable.module.css:7,22 是 100%/flex:1 链，
   但它们的父级高度由 DSH 的 webserver 布局给；本原型必须自己把链补上，
   否则 flex:1 无高度可依、tablePane 的内部滚动不会生效。 */
.as-view>.as-traj{flex:1;min-height:0}
.as-view>.as-side{align-self:start;max-height:100%;overflow:auto}
.as-bottom{align-self:center;margin:8px auto;display:block;font-size:12px;line-height:18px;color:var(--d-label2);
  background:var(--d-surface);border:.5px solid var(--d-border2);border-radius:var(--dsw-radius-pill);padding:3px 12px;cursor:pointer;
  box-shadow:0 3px 8px var(--dsw-alias-border-l1);corner-shape:round}
.as-bottom:hover{background:var(--d-hover-solid)}
/* Inspect 药丸（tool__ToolRow.css:83-116）：hover 出现、.5px 描边、radius 999、11/16 */
/* Inspect 药丸的历史别名（.as-inspect 与源码类名 .toolrow-inspectButton 同挂一个元素）。
   这里只留"本原型自己的"两条：整行 hover 时显示 + focus-within 也显示。
   几何（padding/margin/描边/字号/opacity 初值）全部交给 .toolrow-inspectButton ——
   原来这里写 padding:1px 8px，把源码的 2px 顶边距改成 1px

   于是表被压成 360px、后面「压缩」块紧跟上来，再往下就是一片死白（业主截图报的空白）。
   轨迹页里滚动归 pane 管，内层不再限高；overflow 也要放开 ——
   内层只要还是 overflow:auto 就是个（永不滚动的）滚动口，表头的 sticky 会绑在它身上、跟着表格滚走。
   注：工具条/时间轴现在已移出 pane（结构照 DSH），表头 sticky 停在 top:0 即可，不必再让位。 */
